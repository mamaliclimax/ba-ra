function play(L,seed){const du=seed!=null;if(du)L=16+seed%8;else if(L>23||L>0&&!S.lv[L-1])return;const r=R[L%8],t=L/8|0,T=du?35:30+t*5,d=r[4].map(i=>({e:D[i][0],nm:D[i][1],w:D[i][2],tip:D[i][3],n:i==6,s:i==6?1:0})),f=d.filter(x=>!x.n),sum=f.reduce((a,x)=>a+x.w,0);f[0].s=2;G={L,t:T,d,E:0,k:0,cb:0,bn:0,du,r:du?mb(seed):Math.random,sp:1.2,iv:du?1:Math.max(.75,2.2-.08*L)*S.ad,pw:du?.5:.3+.1*t,mx:sum*T,cap:sum,m:sum*T*.03,over:0,st:1,h:0};show('game')}

function spawn(){const c=G.d.filter(d=>!d.n),d=c[G.r()*c.length|0],ro=G.r();if(d.s==0)d.s=ro<G.pw?2:1;else if(d.s==1)d.s=2;draw(G.d.indexOf(d))}
function tick(){if(G.over)return;G.t-=.1;G.sp-=.1;if(G.sp<=0){G.sp=G.iv*(.7+G.r()*.6);spawn()}let w=0;G.d.forEach(d=>{if(d.s==2)w+=d.w});G.E+=w*.1;const p=Math.min(100,w/G.cap*100),b=$('#mb');$('#t').textContent=fa(Math.max(0,Math.ceil(G.t)));$('#w').textContent=fa(w);$('#k').textContent=fa(G.k);b.style.width=p+'%';b.style.background=p<30?'#3ee0a3':p<60?'#ffd54a':'#ff5d7a';if(G.t<=0)endL()}

function tap(i){const d=G.d[i];if(!d||G.over)return;const updK=()=>{const ke=$('#k');if(ke)ke.textContent=fa(G.k)};if(d.n){G.E+=G.m;G.cb=0;G.k=Math.max(0,G.k-1);sfx.no();fx(i,'−۱ 🧊');say('🧊 یخچال باید همیشه روشن بماند! یک امتیاز کم شد');updK();return}if(d.s==2){d.s=0;G.k++;G.cb++;if(G.cb>=3)G.bn+=G.cb;sfx.ok();fx(i,G.cb>=3?'🔥 ×'+fa(G.cb):'+۱ ✅');say(d.tip)}else if(d.s==1){d.s=0;G.E+=G.m;G.cb=0;G.k=Math.max(0,G.k-1);sfx.no();fx(i,'−۱ 🙈');say('اوه! داشتند ازش استفاده می‌کردند — یک امتیاز کم شد 🙈')}else return;draw(i);updK()}
function endL(){clearInterval(G.h);G.over=1;const r=G.E/G.mx;if(G.du){DL.sc=Math.round(1000*Math.max(0,1-2.5*r))+10*G.k+G.bn;sfx.win();dend();return}G.st=r<.1?3:r<.2?2:1;S.lv[G.L]=Math.max(S.lv[G.L]||0,G.st);S.ad=G.st==3?Math.max(.75,S.ad-.07):G.st==1?Math.min(1.3,S.ad+.1):S.ad;save();sfx.win();show('res');say(G.st==3?'تو واقعاً هوشمندی! 🌟':'آفرین! دفعهٔ بعد بهتر هم می‌شود 💪')}

function mk(id,g){g=g||Math.random;let c,o,q,ex;if(id<306){const t=id&1;let r=(id+1)*2654435761>>>0;const x=[];while(x.length<4){r=(r*1664525+1013904223)>>>0;const i=(r>>>9)%AP.length;if(x.indexOf(i)<0)x.push(i)}x.sort((a,b)=>AP[a][1]-AP[b][1]);const k=AP[t?x[0]:x[3]];c=k[0];ex=k[0]+' حدود '+fa(k[1])+' وات برق می‌کشد.';o=x.map(i=>AP[i][0]);q='کدام وسیله هنگام روشن بودن برق '+(t?'کمتری':'بیشتری')+' می‌کشد؟'}else{const h=id-306,t=h&1,i=(h>>1)%6,O=[[0,1,2],[1,3,5],[2,3,4],[0,2,5]][((h>>1)/6|0)%4];c=(t?BD:GD)[i];ex=(t?'این کار برق را هدر می‌دهد: ':'درست است: ')+c;o=[c].concat(O.map(d=>(t?GD:BD)[(i+d)%6]));q=t?'کدام کار اشتباه است و برق را هدر می‌دهد؟':'کدام کار برق را صرفه‌جویی می‌کند؟'}for(let i=3;i>0;i--){const j=g()*(i+1)|0,t=o[i];o[i]=o[j];o[j]=t}return{id,q,o,c,ex,d:0}}
function startQ(){let u=[];for(let i=0;i<NQ;i++)if(S.seen.indexOf(i)<0)u.push(i);if(u.length<4){S.seen=[];u=[];for(let i=0;i<NQ;i++)u.push(i)}const ids=[];while(ids.length<4)ids.push(u.splice(rnd(u.length),1)[0]);S.seen=S.seen.concat(ids);S.qs={ids,i:0,ok:0};save()}

function hourKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'-'+d.getHours()}
function daySeed(){const t=today();let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h||1}
function hourSeed(){const t=hourKey();let h=0;for(let i=0;i<t.length;i++)h=(h*33+t.charCodeAt(i))>>>0;return h||1}
function seededPick(seed,n,mod){const out=[];let x=seed||1;while(out.length<n){x=(Math.imul(x,1664525)+1013904223)>>>0;const v=x%mod;if(out.indexOf(v)<0)out.push(v)}return out}

function escTick(){if(!EG||EG.over||cur!=='esrun')return;EG.t-=1;const el=$('#et');if(el)el.textContent=fa(Math.max(0,EG.t));if(EG.t<=0)escEnd()}
setInterval(escTick,1000);
function escTap(i){if(!EG||EG.over)return;const it=EG.items[i];if(!it||it.found)return;it.found=1;if(it.w){EG.found++;sfx.ok();fxEsc(i,'+');say(it.t)}else{EG.t=Math.max(0,EG.t-5);sfx.no();say('این بی‌خطر بود! −۵ ثانیه');}const ef=$('#ef');if(ef)ef.textContent=fa(EG.found);if(EG.found>=EG.need)escEnd();else show('esrun')}
function fxEsc(i,t){try{const e=document.querySelector('[data-a=ex'+i+']');if(!e)return;const r=e.getBoundingClientRect(),n=document.createElement('b');n.className='fx';n.textContent=t;n.style.left=r.left+r.width/2+'px';n.style.top=r.top+'px';document.body.appendChild(n);setTimeout(()=>n.remove(),700)}catch(e){}}
function escEnd(){if(!EG||EG.over)return;EG.over=1;const ratio=EG.found/Math.max(1,EG.need);const stars=ratio>=1&&EG.t>20?3:ratio>=1?2:EG.found>=EG.need-1?1:0;const prev=S.esc[today()]||0;if(stars>prev){S.esc[today()]=stars;if(stars>=2)add(stars);save()}sfx.win();EG._stars=stars;show('esres');say(stars?('آفرین! '+stars+' ستاره'):'دفعه بعد بیشتر پیدا کن!')}
V.esres=()=>{const s=EG&&EG._stars||0;return `<div class="card" style="text-align:center"><div style="font-size:48px">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div><h2>${fa(EG?EG.found:0)} از ${fa(EG?EG.need:0)} هدررفت</h2><p>${s>=2?'امتیاز هفته هم گرفتی!':'دوباره تلاش کن'}</p><button class="btn" data-a="escgo" style="--c:#7e57c2">🔁 دوباره</button>${BK}</div>`};

// --- خانه هوشمند (فروشگاه ارتقا) ---
const UPS=[
  {id:'led',e:'💡',n:'لامپ LED',c:8,d:'نور کمتر با روشنایی بهتر'},
  {id:'curtain',e:'🪟',n:'پرده هوشمند',c:12,d:'روزها نور طبیعی به‌جای چراغ'},
  {id:'smart',e:'📱',n:'پریز هوشمند',c:15,d:'قطع خودکار وسایل آماده‌به‌کار'},
  {id:'insul',e:'🧱',n:'عایق پنجره',c:20,d:'کمتر روشن ماندن بخاری/کولر'},
  {id:'solar',e:'☀️',n:'پنل کوچک',c:35,d:'کمک به تأمین برق خانه'},
  {id:'tree',e:'🌳',n:'درخت حیاط',c:10,d:'سایه و خنکای طبیعی'}
];
V.shop=()=>{const list=UPS.map(u=>{const owned=!!(S.up&&S.up[u.id]);return `<div class="card" style="display:flex;gap:10px;align-items:center"><div style="font-size:36px">${u.e}</div><div style="flex:1;text-align:right"><b>${u.n}</b><br><small>${u.d}</small><br><small>${owned?'✅ خریداری شده':'هزینه: '+fa(u.c)+' امتیاز'}</small></div>${owned?'':`<button class="btn" data-a="buy_${u.id}" style="--c:#26a69a;padding:8px 12px">خرید</button>`}</div>`}).join('');return `<div class="card" style="text-align:center"><h3 style="margin:0">🏡 خانه هوشمند</h3><p>امتیاز کل: ${fa(S.pts)} · با امتیاز، خانه را بهتر کن</p></div>${list}${BK}`};
function buyUp(id){const u=UPS.find(x=>x.id===id);if(!u)return;if(S.up[id]){say('قبلاً خریدی');return}if(S.pts<u.c){say('امتیاز کافی نیست');sfx.no();return}S.pts-=u.c;S.up[id]=1;save();hud();sfx.win();say(u.n+' اضافه شد! 🎉');show('shop')}

// --- تیم / کلاس ---
V.team=()=>{const t=S.team;if(t)return `<div class="card" style="text-align:center"><div style="font-size:48px">👥</div><h3 style="margin:0">تیم ${esc(t.name||'')}</h3><p>کد تیم: <b style="letter-spacing:4px">${esc(t.code)}</b></p><p>امتیاز تیمی این هفته: ${fa(t.wp||0)}</p><small>کد را به هم‌تیمی‌ها بده تا بپیوندند. با بازی کردن، امتیاز تیم بالا می‌رود.</small><button class="btn" data-a="teamx" style="--c:#ff9aa8;margin-top:10px">ترک تیم</button>${BK}</div>`;return `<div class="card" style="text-align:center"><div style="font-size:48px">👥</div><h3 style="margin:0">تیم و کلاس</h3><p>یک تیم بساز یا با کد به تیم دوست/هم‌کلاسی بپیوند.</p><input id="tn" placeholder="نام تیم (برای ساخت)" maxlength="20"><button class="btn" data-a="teamc" style="--c:#42a5f5;width:100%">ساخت تیم</button><hr style="border:none;border-top:1px solid #fff3;margin:14px 0"><input id="tc" placeholder="کد تیم" maxlength="6" style="text-transform:uppercase;text-align:center"><button class="btn" data-a="teamj" style="--c:#3ee0a3;width:100%">پیوستن با کد</button>${BK}</div>`};
function teamCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const g=Math.random;for(let i=0;i<5;i++)s+=c[g()*c.length|0];return s}
ACT.teamc=()=>{const n=(($('#tn')&&$('#tn').value)||'').replace(/[<>]/g,'').trim();if(n.length<2){say('نام تیم را بنویس');return}S.team={code:teamCode(),name:n,wp:0,wk:wkey()};save();sfx.win();show('team');say('تیم ساخته شد!')};
ACT.teamj=()=>{const code=(($('#tc')&&$('#tc').value)||'').trim().toUpperCase();if(code.length<4){say('کد را کامل بنویس');return}S.team={code:code,name:'تیم '+code,wp:0,wk:wkey()};save();sfx.ok();show('team');say('به تیم پیوستی!')};
ACT.teamx=()=>{S.team=null;save();show('team')};
// when add() points, also bump team weekly
/* team points hooked in add */

// --- کوییز ساعتی ---
function hourlyQs(){const ids=seededPick(hourSeed(),10,NQ);return ids.map(id=>mk(id,mb(hourSeed()+id*3)))}
V.hourly=()=>{const hk=hourKey();if(S.hq===hk)return `<div class="card" style="text-align:center"><div style="font-size:52px">⏰</div><h2>این ساعت شرکت کردی</h2><p>${fa(S.hqOk)} از ۱۰ درست</p><small>ساعت بعد دوباره باز می‌شود</small>${BK}</div>`;if(!window.__HQ||window.__HK!==hk){window.__HQ=hourlyQs();window.__HI=0;window.__HOK=0;window.__HK=hk}const Qh=window.__HQ[window.__HI];if(!Qh)return `<div class="card">خطا</div>${BK}`;return `<div class="card"><small>کوییز ساعتی · ${fa(window.__HI+1)}/۱۰ · برای همه یکسان در این ساعت</small><h3>${Qh.q}</h3>${Qh.o.map((o,j)=>`<button class="opt" data-a="hy${j}">${o}</button>`).join('')}<div id="hfb"></div></div>`};
function hourlyAns(j){const Qh=window.__HQ&&window.__HQ[window.__HI];if(!Qh||Qh._d)return;Qh._d=1;const ok=Qh.o[j]===Qh.c;document.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(Qh.o[i]===Qh.c)x.classList.add('ok');else if(i===j&&!ok)x.classList.add('no')});if(ok){window.__HOK++;sfx.ok()}else sfx.no();const last=window.__HI>=9;const fb=$('#hfb');if(fb)fb.innerHTML=`<p>${ok?'✅':'💡'} ${Qh.ex||''}</p><button class="btn" data-a="hn" style="--c:#ec407a;width:100%">${last?'نتیجه':'بعدی'}</button>`}
ACT.hn=()=>{if(window.__HI<9){window.__HI++;show('hourly')}else{const ok=window.__HOK|0;S.hq=hourKey();S.hqOk=ok;const bonus=ok>=8?6:ok>=5?3:1;add(bonus);window.__HQ=null;sfx.win();show('hourly');say(fa(bonus)+' امتیاز کوییز ساعتی!')}};

// --- رأی امروز ---
const VOTES=[
  {q:'کدام کار بیشتر در خانه برق صرفه‌جویی می‌کند؟',a:'خاموش کردن چراغ اتاق خالی',b:'شارژر را در پریز گذاشتن'},
  {q:'برای خنک شدن بهتر است؟',a:'پرده را کنار بزنی و پنکه',b:'کولر با پنجره باز'},
  {q:'کدام لامپ کم‌مصرف‌تر است؟',a:'لامپ LED',b:'لامپ رشته‌ای قدیمی'},
  {q:'بعد از شارژ گوشی چه کار کنیم؟',a:'شارژر را از پریز بکشیم',b:'همان‌جا بماند'},
  {q:'لباسشویی کی روشن شود بهتر است؟',a:'وقتی پر است',b:'با دو سه لباس'},
  {q:'تلویزیون را وقتی کسی نگاه نمی‌کند؟',a:'خاموش کنیم',b:'روشن بماند برای صدا'}
];
function voteToday(){return VOTES[daySeed()%VOTES.length]}
V.vote=()=>{const v=voteToday();if(S.voteD===today())return `<div class="card" style="text-align:center"><div style="font-size:52px">🗳️</div><h3>رأی امروز ثبت شد</h3><p>${esc(v.q)}</p><p>انتخاب تو: <b>${esc(S.voteC==='a'?v.a:v.b)}</b></p><small>فردا سؤال جدید می‌آید. انتخاب درست آموزشی است؛ امتیاز رقابتی ندارد.</small>${BK}</div>`;return `<div class="card" style="text-align:center"><div style="font-size:52px">🗳️</div><h3 style="margin:0">رأی امروز</h3><p>${esc(v.q)}</p><button class="btn" data-a="va" style="--c:#ab47bc;width:100%;margin:8px 0">${esc(v.a)}</button><button class="btn" data-a="vb" style="--c:#7e57c2;width:100%">${esc(v.b)}</button>${BK}</div>`};
function castVote(c){if(S.voteD===today())return;S.voteD=today();S.voteC=c;save();sfx.ok();show('vote');say('رأی‌ات ثبت شد 🗳️')}


Object.assign(ACT,{home:()=>show('home'),map:()=>show('map'),quiz:()=>show('quiz'),wheel:()=>show('wheel'),story:()=>show('media','s'),anim:()=>show('media','a'),lb:()=>show('lb'),daily:()=>show('daily'),escape:()=>show('escape'),shop:()=>show('shop'),team:()=>show('team'),hourly:()=>show('hourly'),vote:()=>show('vote'),va:()=>castVote('a'),vb:()=>castVote('b'),snd:()=>{S.snd=S.snd?0:1;save();hud()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,c=a[0];if(ACT[a]){sfx.tap();ACT[a]()}else if(a.slice(0,2)=='mp'){sfx.tap();const kind=a[2],ix=+a.slice(3);show('media',{k:kind=='s'?'s':'a',ix:ix});}else if(a.slice(0,4)=='buy_'){sfx.tap();buyUp(a.slice(4))}else if(a.slice(0,2)=='dy'){sfx.tap();dailyAns(+a.slice(2))}else if(a.slice(0,2)=='hy'){sfx.tap();hourlyAns(+a.slice(2))}else if(a.slice(0,2)=='ex'){sfx.tap();escTap(+a.slice(2))}else if(c=='L'){sfx.tap();play(+a.slice(1))}else if(c=='o')(cur=='dq'?dans:ans)(+a.slice(1));else if(c=='v'){av=AVS[+a.slice(1)];document.querySelectorAll('.avb').forEach((b,i)=>b.className='avb'+(AVS[i]==av?' on':''))}});
// لمس وسیله‌ها: انتخاب با مختصات روی صفحه (مستقل از hit-test سه‌بعدی مرورگر)
document.addEventListener('pointerdown',e=>{if(cur!='game'||!G||G.over)return;let b=-1,m=1e9;G.d.forEach((d,i)=>{const el=$('#d'+i);if(!el)return;const r=el.getBoundingClientRect(),p=10;if(e.clientX>=r.left-p&&e.clientX<=r.right+p&&e.clientY>=r.top-p&&e.clientY<=r.bottom+p){const dx=e.clientX-(r.left+r.right)/2,dy=e.clientY-(r.top+r.bottom)/2,q=dx*dx+dy*dy;if(q<m){m=q;b=i}}});if(b>=0)tap(b)});
function boot(){
  try{
    show('home');
    setTimeout(function(){
      var v=document.getElementById('v');
      if(v && (!v.innerHTML.trim() || v.innerHTML.indexOf('در حال بارگذاری')>=0)){
        try{show(S&&S.p?'home':'reg')}catch(e2){
          v.innerHTML='<div class="card" style="text-align:center;margin-top:40px"><div style="font-size:48px">⚡</div><h2>سلام! من برقی‌ام</h2><p>اگر این پیام را می‌بینی، روی دکمه بزن تا بازی شروع شود.</p><button class="btn" data-a="reg" style="--c:#3ee0a3;width:100%">شروع</button></div>';
        }
      }
    }, 120);
  }catch(e){
    console.error('BOOT ERROR', e);
    var v=document.getElementById('v');
    if(v) v.innerHTML='<div class="card" style="text-align:center;margin-top:40px"><h2>خطا در بارگذاری</h2><p style="direction:ltr;font-size:12px;opacity:.8">'+String(e&&e.message||e)+'</p><button class="btn" style="--c:#3ee0a3;width:100%" onclick="location.reload()">تلاش دوباره</button></div>';
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
