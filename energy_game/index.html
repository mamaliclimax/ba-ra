<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>برقی و خانهٔ هوشمند</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet">
<script src="https://tapi.bale.ai/miniapp.js"></script>
<style>
:root{color-scheme:dark;--y:#ffd54a;--g:#3ee0a3;--r:#ff5d7a;--card:#ffffff1c;--tx:#fff8e7;--ink:#2a1b00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font:500 16px/1.7 Vazirmatn,Tahoma,system-ui,sans-serif;color:var(--tx);background:radial-gradient(circle at 85% 0,#5a45c9,transparent 55%),linear-gradient(#1c1550,#0e0a2c);background-attachment:fixed;user-select:none;-webkit-user-select:none}
#app{max-width:480px;margin:auto;padding:12px 14px 120px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.chip{background:var(--card);border:0;border-radius:99px;padding:3px 12px;font:800 15px Vazirmatn,Tahoma,sans-serif;color:inherit;white-space:nowrap;cursor:pointer}
.card{background:var(--card);border-radius:24px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:22px;padding:12px 8px;font:800 16px Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:var(--c,#ffd54a);box-shadow:0 5px 0 #0004;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0004}
.btn:disabled{filter:grayscale(1);opacity:.6}
.btn b{display:block;font-size:36px;line-height:1.3}
.btn small{display:block;font-weight:500;font-size:12px}
input{width:100%;margin:6px 0;padding:12px;border-radius:14px;border:2px solid #fff4;background:#0003;color:inherit;font:inherit;user-select:text;-webkit-user-select:text}
.opt{display:block;width:100%;margin:8px 0;padding:12px;border-radius:16px;border:2px solid #fff5;background:#ffffff14;color:inherit;font:800 15px Vazirmatn,Tahoma,sans-serif;cursor:pointer}
.opt.ok{background:#1fae7a;border-color:var(--g)}.opt.no{background:#c93c58;border-color:var(--r)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{border:0;border-radius:16px;padding:6px 2px;background:var(--c);color:var(--ink);font:800 12px Vazirmatn,Tahoma,sans-serif;cursor:pointer}
.lv b{display:block;font-size:26px;line-height:1.3}.lk{filter:grayscale(1) brightness(.6);pointer-events:none}
.house{transform:perspective(700px) rotateX(5deg)}
.meter{height:12px;border-radius:9px;background:#0005;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .2s}
.sc{perspective:760px;height:310px;display:flex;justify-content:center;align-items:center}
.rm{position:relative;width:300px;height:220px;transform-style:preserve-3d;transform:rotateX(22deg) rotateY(-26deg)}
.f{position:absolute;left:0;pointer-events:none;box-shadow:inset 0 0 40px #0003}
.bw{width:300px;height:220px;top:0;transform:translateZ(-150px);background:var(--w)}
.lw{width:300px;height:220px;top:0;transform:rotateY(90deg) translateZ(-150px);background:var(--w);filter:brightness(.8)}
.fl{width:300px;height:300px;top:-40px;transform:rotateX(90deg) translateZ(-110px);background:repeating-conic-gradient(#0002 0 25%,#0000 0 50%) 0 0/60px 60px,var(--fl)}
.dv{position:absolute;left:calc(50% - 34px);top:calc(50% - 40px);width:68px;height:80px;text-align:center;cursor:pointer;transform:translate3d(var(--x),var(--y),var(--z)) rotateY(26deg) rotateX(-22deg);transition:filter .3s}
.dv span{display:block;font-size:50px;line-height:56px}
.dv em{display:block;font:800 11px/16px Vazirmatn,Tahoma,sans-serif;background:#0009;border-radius:8px}
.dv u{position:absolute;top:-8px;right:-4px;font-size:22px;text-decoration:none}
.s0{filter:grayscale(1) brightness(.6)}.s1{filter:drop-shadow(0 0 10px var(--g))}
.s2{filter:drop-shadow(0 0 14px var(--r))}.s2 span{animation:sh .35s infinite}
@keyframes sh{50%{transform:rotate(9deg) scale(1.12)}}
.wh{width:240px;height:240px;border-radius:50%;margin:0 auto 10px;position:relative;border:6px solid var(--tx);background:conic-gradient(#ff9aa8 0 45deg,#ffd54a 0 90deg,#3ee0a3 0 135deg,#5ec8ff 0 180deg,#ff9aa8 0 225deg,#ffd54a 0 270deg,#3ee0a3 0 315deg,#b99cff 0 360deg);transition:transform 4s cubic-bezier(.15,.7,.1,1)}
.wh b{position:absolute;left:50%;top:50%;width:30px;margin:-14px -15px;text-align:center;font-size:20px;color:var(--ink)}
.wp{font-size:34px;line-height:1;color:var(--r);margin-bottom:-10px;position:relative;z-index:1}
#m{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:0;right:0;max-width:480px;margin:auto;display:flex;gap:8px;align-items:flex-end;padding:0 12px;pointer-events:none}
#m i{font-style:normal;font-size:48px;pointer-events:auto;animation:bob 2s ease-in-out infinite}
#m p{margin:0 0 8px;background:var(--tx);color:var(--ink);border-radius:16px 16px 16px 4px;padding:6px 12px;font:800 14px/1.6 Vazirmatn,Tahoma,sans-serif;box-shadow:0 3px 12px #0006}
@keyframes bob{50%{transform:translateY(-6px) rotate(-5deg)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="bar" id="h"></div><div id="v"></div></div>
<div id="m"><i>🤖</i><p>سلام!</p></div>
<script>
'use strict';
// ⚙️ تنظیمات: لینک قصهٔ صوتی (mp3) و انیمیشن (mp4) و آدرس API جدول هفتگی را اینجا بگذارید
const STORY_URL='',ANIM_URL='',API='',NQ=354,K='barghi1';
const $=s=>document.querySelector(s),fa=n=>(+n).toLocaleString('fa-IR'),rnd=n=>Math.random()*n|0;
const AP=[['لامپ رشته‌ای',60],['لامپ ال‌ای‌دی',9],['پنکه',50],['تلویزیون',100],['شارژر موبایل',5],['لپ‌تاپ',65],['یخچال',150],['اتو',1200],['سشوار',1800],['لباسشویی',500],['جاروبرقی',1400],['بخاری برقی',2000],['کولر گازی',1500],['مایکروویو',1000],['کتری برقی',2200],['کنسول بازی',120],['کامپیوتر',250],['پمپ آب',750]];
const GD=['خاموش کردن چراغ اتاق خالی','درآوردن شارژر از پریز بعد از شارژ','باز کردن پرده در روز به جای چراغ','استفاده از لامپ کم‌مصرف','بستن سریع در یخچال','پر کردن لباسشویی قبل از روشن کردن'];
const BD=['روشن گذاشتن تلویزیون در اتاق خالی','ماندن شارژر در پریز بدون استفاده','روشن کردن چراغ در ظهر آفتابی','باز گذاشتن در یخچال','روشن بودن کولر با پنجرهٔ باز','روشن کردن لباسشویی با دو تا لباس'];
const D=[['💡','لامپ',60,'چراغِ اتاقِ خالی را خاموش کن!'],['📺','تلویزیون',100,'تلویزیونِ بدون بیننده برق می‌خورد!'],['🌀','پنکه',50,'پنکه برای اتاق خالی لازم نیست.'],['🎮','کنسول',120,'بعد از بازی، کنسول را خاموش کن.'],['💻','لپ‌تاپ',65,'لپ‌تاپِ رهاشده را خاموش کن.'],['🔌','شارژر',5,'شارژرِ بدون گوشی هم برق می‌گیرد!'],['🧊','یخچال',150,''],['🚿','آبگرمکن',1500,'آبِ گرمِ بی‌مصرف انرژی هدر می‌دهد.'],['❄️','کولر',1500,'با پنجرهٔ باز، کولر روشن نگذار!'],['🌬️','سشوار',1800,'سشوار را بعد از استفاده خاموش کن.'],['🫖','کتری',2200,'آب اضافه نجوشان؛ کتری را خاموش کن.'],['💧','پمپ آب',750,'پمپ آب بی‌دلیل کار نکند.']];
const R=[['هال','🛋️','#ff9a8b','#e3b778',[0,1,2,3]],['آشپزخانه','🍳','#7be0b5','#d8d0bd',[0,6,10,11]],['اتاق بازی','🧸','#ffd36e','#cfa6ff',[0,3,4,5]],['حمام','🛁','#7ed6ff','#bfe9ff',[0,7,9,11]],['خواب','🛏️','#b9a7ff','#e6c9a8',[0,8,5,1]],['مطالعه','📚','#ffb3d1','#dcc7a1',[0,4,5,2]],['حیاط','🌳','#8fe388','#a7d67a',[0,11,2,8]],['انباری','🔧','#a0b4ff','#c9c1b3',[0,6,7,9]]];
const P=[[-85,70,-70],[25,70,-100],[88,70,10],[-30,70,70]];
const PR=['آفرین!','عالی بود!','تو قهرمان انرژی‌ای! ⚡','دمت گرم!','چه باهوشی! 🌟'];
const MS={home:'سلام! بیا برق را هوشمندانه مصرف کنیم ⚡',map:'یک اتاق انتخاب کن؛ هر مرحله سخت‌تر می‌شود!',game:'قرمز 💸 = برق هدر می‌رود، لمسش کن. سبز 🙂 = دارند استفاده می‌کنند.',quiz:'فکر کن و جواب بده؛ اشتباه هم یاد گرفتن است 💛',wheel:'شانست را امتحان کن! 🍀',media:'راحت بنشین و لذت ببر 🌙',lb:'تلاش کن، جایزه منتظر توست! 🎁'};
const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),today=()=>dk(new Date());
const wkey=()=>{const d=new Date();return dk(new Date(d.getFullYear(),d.getMonth(),d.getDate()-(d.getDay()+1)%7))};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({p:null,pts:0,wp:0,wk:'',lv:{},seen:[],qs:null,nq:0,wd:'',wl:0,ms:'',ma:'',snd:1,ad:1},S||{});
if(S.wk!=wkey()){S.wk=wkey();S.wp=0}
const W=window.Bale&&Bale.WebApp||window.Telegram&&Telegram.WebApp;
try{W.ready();W.expand()}catch(e){}
let uid=0;try{uid=W.initDataUnsafe.user.id}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function sync(){if(API&&S.p)try{fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:uid,p:S.p,pts:S.pts,wp:S.wp,wk:S.wk})}).catch(()=>{})}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}sync()}
let AC;
function tone(f,d,t,v,s){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+(s||0);o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(v||.12,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
const seq=a=>a.forEach((f,i)=>tone(f,.2,'triangle',.13,i*.1));
const sfx={ok:()=>seq([523,659,784]),no:()=>tone(170,.3,'sawtooth',.07),tap:()=>tone(700,.06,'square',.04),win:()=>seq([523,659,784,1047,1319]),tick:()=>tone(1000,.03,'square',.04)};
setInterval(()=>{if(AC&&!document.hidden)tone([392,440,523,587,659][rnd(5)],1,'sine',.025)},800);
function say(t){const p=$('#m p');p.textContent=t;p.style.animation='none';p.offsetWidth;p.style.animation='pop .35s'}
$('#m i').onclick=()=>{try{const u=new SpeechSynthesisUtterance($('#m p').textContent);u.lang='fa-IR';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const hud=()=>{$('#h').innerHTML=`<button class="chip" data-a="home">🏠</button><span class="chip">⭐ ${fa(S.pts)}</span><span class="chip">📅 ${fa(S.wp)}</span><button class="chip" data-a="snd">${S.snd?'🔊':'🔇'}</button>`};
function add(n){if(S.wk!=wkey()){S.wk=wkey();S.wp=0}S.pts+=n;S.wp+=n;save();hud()}
const wl=()=>{if(S.wd!=today()){S.wd=today();S.wl=3;save()}return S.wl};
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return fa(s/60|0)+':'+fa(s%60).padStart(2,'۰')};
const tree=()=>{const g=S.pts+2*Object.values(S.lv).reduce((a,b)=>a+b,0);return g<10?'🌱':g<30?'🌿':g<60?'🪴':g<100?'🌳':'🌳🍎'};
const B=(a,e,t,s,c)=>`<button class="btn" data-a="${a}" style="--c:${c}"><b>${e}</b>${t}<small>${s}</small></button>`;
const BK='<button class="btn" data-a="home" style="--c:#b99cff;margin-top:8px">🏠 برگشت</button>';
const V={},post={},ACT={};let cur,arg,G=null,Q=null,lastOk=0,rot=0;
function show(n,a){if(G&&n!='game')clearInterval(G.h);if(!S.p)n='reg';cur=n;arg=a;$('#v').innerHTML=V[n](a);$('#h').style.display=n=='reg'?'none':'';window.scrollTo(0,0);post[n]&&post[n](a);hud();if(MS[n])say(MS[n])}
V.reg=()=>`<div class="card"><div style="font-size:64px;text-align:center">🤖</div><h2 style="text-align:center;margin:0">سلام! من برقی‌ام</h2><p>قبل از شروع، خودت را معرفی کن:</p><input id="f" placeholder="نام" maxlength="20"><input id="l" placeholder="نام خانوادگی" maxlength="25"><input id="c" placeholder="شهر" maxlength="25"><p id="er" style="color:#ff9aa8;margin:4px 0"></p><button class="btn" data-a="reg" style="--c:#3ee0a3;width:100%">شروع ماجراجویی ⚡</button></div>`;
ACT.reg=()=>{const v=i=>$('#'+i).value.replace(/[<>&"'`]/g,'').trim(),f=v('f'),l=v('l'),c=v('c');if(f.length<2||l.length<2||c.length<2){$('#er').textContent='لطفاً نام، نام خانوادگی و شهر را کامل بنویس 🙂';return}S.p={f,l,c};save();show('home')};
V.home=()=>{const q=S.qs?'ادامه بده':S.nq>Date.now()?'منتظر نوبت بعد ⏳':'۴ سؤال آماده ✨',l=wl();return `<div class="card" style="text-align:center"><div style="font-size:70px;line-height:1.2">${tree()}</div><b>درخت انرژیِ ${S.p.f}</b><br><small>هر چه برق را بهتر مدیریت کنی، بزرگ‌تر می‌شود!</small></div><div class="grid">${B('map','🏠','مراحل خانه',fa(Object.keys(S.lv).length)+' از ۲۴','#ffb44a')}${B('quiz','❓','کوییز',q,'#5ec8ff')}${B('wheel','🎡','گردونه شانس',l?fa(l)+' بار شانس':'فردا دوباره','#ff9aa8')}${B('story','🌙','قصه شب',S.ms==today()?'✅ انجام شد':'+۵ امتیاز','#b99cff')}${B('anim','🎬','انیمیشن',S.ma==today()?'✅ انجام شد':'+۵ امتیاز','#3ee0a3')}${B('lb','🏆','جدول هفته',fa(S.wp)+' امتیاز','#ffd54a')}</div>`};
V.map=()=>{let h='<div class="house">';for(let t=0;t<3;t++){h+=`<div class="card"><b>طبقهٔ ${fa(t+1)}</b><div class="g4">`;for(let i=0;i<8;i++){const L=t*8+i,r=R[i],st=S.lv[L]||0,lk=L>0&&!S.lv[L-1];h+=`<button class="lv${lk?' lk':''}" data-a="L${L}" style="--c:${r[2]}"><b>${lk?'🔒':r[1]}</b>${r[0]}<br>${'⭐'.repeat(st)||'·'}</button>`}h+='</div></div>'}return h+'</div>'};
function play(L){if(L>23||L>0&&!S.lv[L-1])return;const r=R[L%8],t=L/8|0,T=30+t*5,d=r[4].map(i=>({e:D[i][0],nm:D[i][1],w:D[i][2],tip:D[i][3],n:i==6,s:i==6?1:0})),f=d.filter(x=>!x.n),sum=f.reduce((a,x)=>a+x.w,0);f[0].s=2;G={L,t:T,d,E:0,k:0,sp:1.2,iv:Math.max(.9,2.4-.07*L)*S.ad,pw:.25+.1*t,mx:sum*T,cap:sum,m:sum*T*.03,over:0,st:1,h:0};show('game')}
V.game=()=>{const r=R[G.L%8];return `<div class="bar"><span class="chip">⏱ <b id="t">${fa(G.t)}</b></span><span class="chip">⚡ <b id="w">۰</b> وات</span><span class="chip">✅ <b id="k">۰</b></span></div><div class="meter"><i id="mb"></i></div><h3 style="text-align:center;margin:6px 0 0">${r[1]} ${r[0]} · مرحلهٔ ${fa(G.L+1)}</h3><div class="sc" style="--w:${r[2]};--fl:${r[3]}"><div class="rm"><div class="f bw"></div><div class="f lw"></div><div class="f fl"></div>${G.d.map((d,i)=>`<div class="dv s${d.s}" id="d${i}" data-a="d${i}" style="--x:${P[i][0]}px;--y:${P[i][1]}px;--z:${P[i][2]}px"><u></u><span>${d.e}</span><em>${d.nm}</em></div>`).join('')}</div></div>`};
function draw(i){const d=G.d[i],e=$('#d'+i);if(!e)return;e.className='dv s'+d.s;e.querySelector('u').textContent=['','🙂','💸'][d.s]}
post.game=()=>{G.d.forEach((d,i)=>draw(i));G.h=setInterval(tick,100)};
function spawn(){const c=G.d.filter(d=>!d.n),d=c[rnd(c.length)];if(d.s==0)d.s=Math.random()<G.pw?2:1;else if(d.s==1)d.s=2;draw(G.d.indexOf(d))}
function tick(){if(G.over)return;G.t-=.1;G.sp-=.1;if(G.sp<=0){G.sp=G.iv*(.7+Math.random()*.6);spawn()}let w=0;G.d.forEach(d=>{if(d.s==2)w+=d.w});G.E+=w*.1;const p=Math.min(100,w/G.cap*100),b=$('#mb');$('#t').textContent=fa(Math.max(0,Math.ceil(G.t)));$('#w').textContent=fa(w);$('#k').textContent=fa(G.k);b.style.width=p+'%';b.style.background=p<30?'#3ee0a3':p<60?'#ffd54a':'#ff5d7a';if(G.t<=0)endL()}
function tap(i){const d=G.d[i];if(!d||G.over)return;if(d.n){G.E+=G.m;sfx.no();say('🧊 یخچال باید همیشه روشن بماند!');return}if(d.s==2){d.s=0;G.k++;sfx.ok();say(d.tip)}else if(d.s==1){d.s=0;G.E+=G.m;sfx.no();say('اوه! داشتند ازش استفاده می‌کردند 🙈')}draw(i)}
function endL(){clearInterval(G.h);G.over=1;const r=G.E/G.mx;G.st=r<.12?3:r<.25?2:1;S.lv[G.L]=Math.max(S.lv[G.L]||0,G.st);S.ad=G.st==3?Math.max(.75,S.ad-.07):G.st==1?Math.min(1.3,S.ad+.1):S.ad;save();sfx.win();show('res');say(G.st==3?'تو واقعاً هوشمندی! 🌟':'آفرین! دفعهٔ بعد بهتر هم می‌شود 💪')}
V.res=()=>{const s=G.st;return `<div class="card" style="text-align:center"><div style="font-size:52px">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><h2>${['','تمام کردی!','خیلی خوب!','فوق‌العاده!'][s]}</h2><p>${fa(G.k)} بار برقِ هدررفته را قطع کردی.<br>${s<3?'کمی سریع‌تر باشی، ۳ ستاره می‌گیری!':'برقی مرحلهٔ بعد را کمی سخت‌تر می‌کند 🚀'}</p><div class="grid"><button class="btn" data-a="L${G.L}" style="--c:#5ec8ff">🔁 دوباره</button>${G.L<23?`<button class="btn" data-a="L${G.L+1}" style="--c:#3ee0a3">▶ مرحلهٔ بعد</button>`:''}</div><button class="btn" data-a="map" style="--c:#b99cff;margin-top:10px">🏠 نقشهٔ خانه</button></div>`};
function mk(id){let c,o,q,ex;if(id<306){const t=id&1;let r=(id+1)*2654435761>>>0;const x=[];while(x.length<4){r=(r*1664525+1013904223)>>>0;const i=(r>>>9)%AP.length;if(x.indexOf(i)<0)x.push(i)}x.sort((a,b)=>AP[a][1]-AP[b][1]);const k=AP[t?x[0]:x[3]];c=k[0];ex=k[0]+' حدود '+fa(k[1])+' وات برق می‌کشد.';o=x.map(i=>AP[i][0]);q='کدام وسیله هنگام روشن بودن برق '+(t?'کمتری':'بیشتری')+' می‌کشد؟'}else{const h=id-306,t=h&1,i=(h>>1)%6,O=[[0,1,2],[1,3,5],[2,3,4],[0,2,5]][((h>>1)/6|0)%4];c=(t?BD:GD)[i];ex=(t?'این کار برق را هدر می‌دهد: ':'درست است: ')+c;o=[c].concat(O.map(d=>(t?GD:BD)[(i+d)%6]));q=t?'کدام کار اشتباه است و برق را هدر می‌دهد؟':'کدام کار برق را صرفه‌جویی می‌کند؟'}o.sort(()=>Math.random()-.5);return{id,q,o,c,ex,d:0}}
function startQ(){let u=[];for(let i=0;i<NQ;i++)if(S.seen.indexOf(i)<0)u.push(i);if(u.length<4){S.seen=[];u=[];for(let i=0;i<NQ;i++)u.push(i)}const ids=[];while(ids.length<4)ids.push(u.splice(rnd(u.length),1)[0]);S.seen=S.seen.concat(ids);S.qs={ids,i:0,ok:0};save()}
V.quiz=()=>{if(!S.qs){if(S.nq>Date.now())return `<div class="card" style="text-align:center"><div style="font-size:60px">⏳</div><p>۴ سؤال بعدی تا</p><h1 id="cd" style="margin:0">${fmt(S.nq-Date.now())}</h1><p>دیگر باز می‌شود. تا آن موقع گردونه یا قصهٔ شب را امتحان کن!</p>${BK}</div>`;startQ()}const q=S.qs;if(!Q||Q.id!=q.ids[q.i])Q=mk(q.ids[q.i]);return `<div class="card"><small>سؤال ${fa(q.i+1)} از ۴ · هر جواب درست ۱ امتیاز</small><h3>${Q.q}</h3>${Q.o.map((o,j)=>`<button class="opt" data-a="o${j}">${o}</button>`).join('')}<div id="fb"></div></div>`};
function ans(j){if(!Q||Q.d||!S.qs)return;Q.d=1;const ok=Q.o[j]==Q.c,b=document.querySelectorAll('.opt'),q=S.qs;b.forEach((x,i)=>{x.disabled=true;if(Q.o[i]==Q.c)x.classList.add('ok')});if(ok){q.ok++;add(1);sfx.ok();say(PR[rnd(PR.length)])}else{b[j].classList.add('no');sfx.no();say('اشکال نداره! حالا درستش را می‌دانی 💛')}q.i++;const last=q.i>=4;if(last){lastOk=q.ok;S.nq=Date.now()+36e5;S.qs=null}save();$('#fb').innerHTML=`<p>${ok?'✅':'💡'} ${Q.ex}</p><button class="btn" data-a="nq" style="--c:#ffd54a;width:100%">${last?'دیدن نتیجه':'سؤال بعدی'}</button>`}
ACT.nq=()=>show(S.qs?'quiz':'qr');
V.qr=()=>`<div class="card" style="text-align:center"><div style="font-size:56px">${lastOk>=3?'🏆':'🌟'}</div><h2>${fa(lastOk)} جواب درست از ۴</h2><p>${fa(lastOk)} امتیاز به حسابت اضافه شد.<br>۴ سؤال بعدی یک ساعت دیگر باز می‌شود ⏳</p>${BK}</div>`;
setInterval(()=>{const c=$('#cd');if(cur=='quiz'&&c){const l=S.nq-Date.now();l>0?c.textContent=fmt(l):show('quiz')}},1000);
const WV=[1,2,4,10,1,2,1,4],WP=[1,1,1,1,2,2,2,4,4,10];
V.wheel=()=>{const l=wl();return `<div class="card" style="text-align:center"><h3 style="margin:0">🎡 گردونهٔ شانس</h3><div class="wp">▼</div><div class="wh" id="wh" style="transform:rotate(${rot}deg)">${WV.map((v,i)=>`<b style="transform:rotate(${i*45+22.5}deg) translateY(-84px)">${fa(v)}</b>`).join('')}</div><p id="wm">${l?'امروز '+fa(l)+' بار شانس داری':'امروز شانست تمام شد؛ فردا دوباره بیا 🌙'}</p><button class="btn" data-a="spin" style="--c:#ff9aa8;width:70%"${l?'':' disabled'}>بچرخان!</button>${BK}</div>`};
ACT.spin=()=>{if(!wl()||cur!='wheel')return;S.wl--;const v=WP[rnd(WP.length)],ix=[];WV.forEach((x,i)=>{if(x==v)ix.push(i)});const a=ix[rnd(ix.length)]*45+22.5;rot+=1440+(((360-a-rot%360)%360)+360)%360;save();$('#wh').style.transform='rotate('+rot+'deg)';$('[data-a=spin]').disabled=true;const tk=setInterval(sfx.tick,250);setTimeout(()=>{clearInterval(tk);add(v);sfx.win();if(cur=='wheel')show('wheel');say(fa(v)+' امتیاز گرفتی! 🎉')},4200)};
V.media=k=>{const u=k=='s'?STORY_URL:ANIM_URL,done=(k=='s'?S.ms:S.ma)==today(),t=k=='s'?'قصه شب':'انیمیشن';return `<div class="card" style="text-align:center"><div style="font-size:60px">${k=='s'?'🌙':'🎬'}</div><h3 style="margin:0">${t}</h3>${u?(k=='s'?`<audio id="md" src="${esc(u)}" controls style="width:100%"></audio>`:`<video id="md" src="${esc(u)}" controls playsinline style="width:100%;border-radius:16px"></video>`):`<p>لینک ${t} هنوز تنظیم نشده است.</p><button class="btn" data-a="demo" style="--c:#5ec8ff">پخش آزمایشی (۶ ثانیه)</button>`}<p id="mm">${done?'امروز ۵ امتیاز گرفتی ✅':'تا آخر '+(k=='s'?'گوش کن':'تماشا کن')+' و ۵ امتیاز بگیر!'}</p>${BK}</div>`};
function done(k){const f=k=='s'?'ms':'ma';if(S[f]==today())return;S[f]=today();add(5);sfx.win();say('۵ امتیاز گرفتی! 🎉');const e=$('#mm');if(e)e.textContent='امروز ۵ امتیاز گرفتی ✅'}
post.media=k=>{const m=$('#md');if(m){m.onended=()=>done(k);m.ontimeupdate=()=>{if(m.duration&&m.currentTime/m.duration>.9)done(k)}}};
ACT.demo=()=>{$('#mm').textContent='در حال پخش آزمایشی…';const k=arg;setTimeout(()=>done(k),6000)};
V.lb=()=>`<div class="card" style="text-align:center"><h3 style="margin:0">🏆 جدول هفته (شنبه تا جمعه)</h3><p>${S.p.f} ${S.p.l} · ${S.p.c}</p><h1 style="margin:0">${fa(S.wp)} امتیاز</h1><p>مجموع همهٔ امتیازها: ${fa(S.pts)}</p><div id="top">${API?'در حال بارگیری…':'جدول همهٔ بچه‌ها بعد از اتصال به سرور فعال می‌شود.'}</div><p>آخر هفته، نفر اول جایزه می‌گیرد! 🎁</p>${BK}</div>`;
post.lb=()=>{if(API)fetch(API+'?top=1').then(r=>r.json()).then(a=>{$('#top').innerHTML=a.slice(0,10).map((x,i)=>`<div>${fa(i+1)}. ${esc(x.n)} (${esc(x.c)}) — ${fa(x.p)}</div>`).join('')}).catch(()=>{})};
Object.assign(ACT,{home:()=>show('home'),map:()=>show('map'),quiz:()=>show('quiz'),wheel:()=>show('wheel'),story:()=>show('media','s'),anim:()=>show('media','a'),lb:()=>show('lb'),snd:()=>{S.snd=S.snd?0:1;save();hud()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,c=a[0];if(ACT[a]){sfx.tap();ACT[a]()}else if(c=='L'){sfx.tap();play(+a.slice(1))}else if(c=='d')tap(+a.slice(1));else if(c=='o')ans(+a.slice(1))});
show('home');
</script>
</body>
</html>
