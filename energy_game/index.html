function duelStart(k,code){
  if(DL&&(DL.ph=='wait'||DL.ph=='vs'||DL.ph=='play')){say('یک بازی در حال انجام است');return}
  refreshUid();
  const priv=!!(code&&String(code).length);
  if(!SB_URL||!SB_KEY){if(priv){say('فایل بازی کلید آنلاین ندارد؛ مالک «دریافت فایل بازی» را دوباره بزند');return}botStart(k);return}
  refreshUid();
  if(!uid){say('شناسه کاربر بله پیدا نشد. بازی را فقط از دکمه داخل بله باز کن (نه مرورگر).');return}
  DL={kind:k,ph:'wait',t0:Date.now(),sc:0,paid:0,bot:0,priv:priv};
  say(priv?(code==='NEW'?'در حال ساخت اتاق…':'در حال ورود…'):'در حال پیدا کردن حریف…');
  show('dload');

    if(!DL)return;
    if(r&&r.err=='nf'){DL=null;say('کد اتاق پیدا نشد 😕');show('duel');return}
    if(r&&r.err=='full'){DL=null;say('اتاق پر است یا بازی شروع شده');show('duel');return}
    if(r&&r.err){DL=null;say('خطا: '+r.err);show('duel');return}
    if(!r||!r.id){duelFail('پاسخ سرور نامعتبر',k,!priv);return}
    DL.r=r;DL.kind=r.kind||k;
    show(r.st==='play'?'dvs':'dwait');
  }).catch(e=>{console.error(e);duelFail('خطای سرور: '+(e&&e.message||'اتصال'),k,!priv)})
}

// ========== بخش‌های جدید v5 ==========
function iranParts(){
  try{
    const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tehran',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hour12:false});
    const o={};fmt.formatToParts(new Date()).forEach(p=>{if(p.type!=='literal')o[p.type]=p.value});
    return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour,mi:+o.minute};
  }catch(e){const n=new Date();return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate(),h:n.getHours(),mi:n.getMinutes()}}
}
function hourKey(){const p=iranParts();return p.y+'-'+p.m+'-'+p.d+'-'+p.h}
function daySeed(){const t=today();let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h||1}
function hourSeed(){const t=hourKey();let h=0;for(let i=0;i<t.length;i++)h=(h*33+t.charCodeAt(i))>>>0;return h||1}
function seededPick(seed,n,mod){const out=[];let x=seed||1;while(out.length<n){x=(Math.imul(x,1664525)+1013904223)>>>0;const v=x%mod;if(out.indexOf(v)<0)out.push(v)}return out}
function nightOpen(){const p=iranParts();return p.h===22||(p.h===21&&p.mi>=55)||(p.h===23&&p.mi<30)}
function upBonus(){const u=S.up||{};let b={time:0,hint:0,score:0};if(u.led)b.score+=1;if(u.curtain)b.time+=5;if(u.smart)b.hint+=1;if(u.insul)b.time+=5;if(u.solar)b.score+=2;if(u.tree)b.hint+=1;return b}

function teamBoardHtml(){
  try{
    const raw=localStorage.getItem('barghi_teams_week')||'{}';
    const data=JSON.parse(raw);
    const wk=wkey();

  }catch(e){return ''}

function dealNightBoard(){
  // دقیقاً ۵ پرمصرف + ۱۰ بی‌خطر؛ با shuffle فقط جایشان عوض می‌شود
  if(!NG.targets||!NG.targets.length){
    const g=mb(nightSeed()+7);
    const w=WASTE_POOL.map((_,i)=>i);
    for(let i=w.length-1;i>0;i--){const j=g()*(i+1)|0;const t=w[i];w[i]=w[j];w[j]=t}
    NG.targets=w.slice(0,5).map(i=>({...WASTE_POOL[i]}));
  }
  const g2=mb(nightSeed()+(NG.shuffle|0)*13+3);
  const s=SAFE_POOL.map((_,i)=>i);
  for(let i=s.length-1;i>0;i--){const j=g2()*(i+1)|0;const t=s[i];s[i]=s[j];s[j]=t}
  const safes=s.slice(0,10).map(i=>({...SAFE_POOL[i]}));
  const foundIds=NG.foundIds||{};
  const wastes=NG.targets.map(t=>({...t,found:!!foundIds[t.id]}));
  const board=wastes.concat(safes);
  for(let i=board.length-1;i>0;i--){const j=g2()*(i+1)|0;const t=board[i];board[i]=board[j];board[j]=t}
  return board.map((it,idx)=>({...it,found:it.w?!!foundIds[it.id]:!!it.found,_i:idx}));
}

function nightHunt(i){

  }else{NG.score=Math.max(0,NG.score-1);sfx.no();say('این پرمصرف نیست! −۱')}

function nightToPuzzle(){
  NG.stage='puzzle';
  const names=['یخچال','تلویزیون','لپ‌تاپ','کولر','جاروبرقی','مایکروویو','پنکه','اتو'];
  const name=names[nightSeed()%names.length];
  const letters=name.split('');
  const g=mb(nightSeed()+21);
  const order=letters.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=g()*(i+1)|0;const t=order[i];order[i]=order[j];order[j]=t}
  NG.puzzle={target:name,letters:order.map(i=>letters[i]),used:order.map(()=>0),build:'',shown:order.map(i=>letters[i]).join(' ')};
  say('پازل وسیله!');show('nrun');
}
function nightPuzzle(i){
  if(!NG||NG.stage!=='puzzle')return;

  p.used[i]=1;p.build+=p.letters[i];
  if(p.build===p.target){NG.score+=4;sfx.ok();nightToWatt();return}

  say('حدس توان!');show('nrun');
}

async function brdJoinRoom(code,kind){
  code=(code||'').trim().toUpperCase();
  if(code.length<4){say('کد را کامل بنویس');return null}
  let row=await brdLoadRoom(code);
  if(!row||!row.state){
    // آفلاین: اتاق محلی ساختگی
    say('اتاق آنلاین پیدا نشد — حالت محلی');
    return null;
  }
  const st=typeof row.state==='string'?JSON.parse(row.state):row.state;
  if(st.kind!==kind){say('این کد برای این بازی نیست');return null}
  if(st.phase!=='lobby'&&!st.players.some(p=>p.uid===String(uid))){say('بازی شروع شده');return null}
  const my=String(uid||('L'+Date.now()));
  if(!st.players.some(p=>p.uid===my)){
    if(st.players.length>=st.max){say('اتاق پر است');return null}
    st.players.push({uid:my,name:me(),seat:st.players.length});
    await brdSaveRoom(st);
  }
  BRD.room={code:code,host:false};BRD.kind=kind;
  return st;
}
function brdStartPoll(renderFn){
  brdStopPoll();
  if(!BRD.room||!sb())return;
  BRD.poll=setInterval(async()=>{
    const row=await brdLoadRoom(BRD.room.code);
    if(!row)return;
    const st=typeof row.state==='string'?JSON.parse(row.state):row.state;
    renderFn(st);
  },2000);
}

// ----- نقطه‌بازی (Dots and Boxes) -----
function dotsNew(n){
  // n = cells per side (3 => 4x4 dots)
  const H=[],V=[];
  for(let r=0;r<=n;r++){H[r]=[];for(let c=0;c<n;c++)H[r][c]=-1}
  for(let r=0;r<n;r++){V[r]=[];for(let c=0;c<=n;c++)V[r][c]=-1}
  return {n:n,H:H,V:V,box:[],score:[0,0],turn:0,done:0,players:[{name:'بازیکن ۱'},{name:'بازیکن ۲'}]};
}
function dotsBoxes(D){
  const n=D.n;D.box=[];
  for(let r=0;r<n;r++){D.box[r]=[];for(let c=0;c<n;c++){
    const o=[D.H[r][c],D.H[r+1][c],D.V[r][c],D.V[r][c+1]];
    D.box[r][c]=o.every(x=>x>=0)?o[0]:-1; // owner = first edge owner simplified: count later
  }}
}
function dotsClaim(D,type,r,c,p){
  if(type==='H'){if(D.H[r][c]>=0)return 0;D.H[r][c]=p}
  else{if(D.V[r][c]>=0)return 0;D.V[r][c]=p}
  let gained=0;const n=D.n;
  const check=(br,bc)=>{
    if(br<0||bc<0||br>=n||bc>=n)return;
    if(D.H[br][bc]>=0&&D.H[br+1][bc]>=0&&D.V[br][bc]>=0&&D.V[br][bc+1]>=0){
      if(D.box[br]&&D.box[br][bc]>=0)return;
      if(!D.box[br])D.box[br]=[];
      D.box[br][bc]=p;D.score[p]++;gained++;
    }
  };
  if(type==='H'){check(r-1,c);check(r,c)}
  else{check(r,c-1);check(r,c)}
  return gained;
}
function dotsDone(D){const n=D.n;let t=n*n;return D.score[0]+D.score[1]>=t}

function dotsMove(type,r,c){
  const st=BRD.local;if(!st)return;
  const D=st.data||st;
  if(D.done||dotsDone(D))return;
  const turn=st.turn!=null?st.turn:D.turn;
  // online: only my seat
  if(BRD.mode!=='local'&&BRD.room&&uid){
    const meU=String(uid);
    const seat=(st.players||[]).findIndex(p=>p.uid===meU);
    if(seat>=0&&seat!==turn){say('نوبت تو نیست');return}
  }
  if(!D.box.length){D.box=[];for(let i=0;i<D.n;i++)D.box[i]=Array(D.n).fill(-1)}
  const g=dotsClaim(D,type,r,c,turn);
  if(g===0&&((type==='H'&&D.H[r][c]!==turn)||(type==='V'&&D.V[r][c]!==turn)))return;
  if(g===0){
    // already taken
    if(type==='H'&&D.H[r][c]>=0&&D.H[r][c]!==turn)return;
  }
  sfx.tap();
  if(g>0){sfx.ok();say('+'+fa(g));}
  else{st.turn=D.turn=(turn+1)%2}
  if(dotsDone(D)){D.done=1;sfx.win()}
  if(BRD.room)brdSaveRoom(st);
  show('dotsP');
}

const SNAKES={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const LADDERS={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};

function snakesNew(np){return {pos:Array(np).fill(0),turn:0,np:np,dice:0,rolling:0,done:0,winner:-1}}
function snCellCenter(num){
  const row=Math.floor((num-1)/10),idx=(num-1)%10,col=row%2===0?idx:9-idx,topRow=9-row;
  return {r:topRow,c:col,x:(col+0.5)*10,y:(topRow+0.5)*10};
}
function snPathSvg(){
  let s='',si=0;
  Object.keys(LADDERS).forEach(a=>{
    const A=snCellCenter(+a),B=snCellCenter(LADDERS[a]);
    s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#5d4037" stroke-width="1.4" opacity="0.9"/>`;
    s+=`<line x1="${A.x-1.3}" y1="${A.y}" x2="${B.x-1.3}" y2="${B.y}" stroke="#8d6e63" stroke-width="0.4"/>`;
    s+=`<line x1="${A.x+1.3}" y1="${A.y}" x2="${B.x+1.3}" y2="${B.y}" stroke="#8d6e63" stroke-width="0.4"/>`;
    for(let t=0.12;t<0.9;t+=0.16){
      const x1=A.x+(B.x-A.x)*t,y1=A.y+(B.y-A.y)*t;
      const dx=-(B.y-A.y),dy=B.x-A.x;const L=Math.sqrt(dx*dx+dy*dy)||1;
      s+=`<line x1="${x1-dx/L*1.4}" y1="${y1-dy/L*1.4}" x2="${x1+dx/L*1.4}" y2="${y1+dy/L*1.4}" stroke="#6d4c41" stroke-width="0.55"/>`;
    }
  });
  Object.keys(SNAKES).forEach(a=>{
    const A=snCellCenter(+a),B=snCellCenter(SNAKES[a]);
    const col=SNAKE_COLORS[si++%SNAKE_COLORS.length];
    const mx=(A.x+B.x)/2+(si%2?8:-8),my=(A.y+B.y)/2+(si%3-1)*4;
    s+=`<path d="M${A.x},${A.y} Q${mx},${my} ${B.x},${B.y}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>`;
    s+=`<path d="M${A.x},${A.y} Q${mx},${my} ${B.x},${B.y}" fill="none" stroke="#ffffff88" stroke-width="0.7" stroke-dasharray="1.5 1.8"/>`;
    s+=`<circle cx="${A.x}" cy="${A.y}" r="1.8" fill="${col}" stroke="#fff" stroke-width="0.3"/>`;
    s+=`<circle cx="${A.x-0.55}" cy="${A.y-0.45}" r="0.4" fill="#fff"/><circle cx="${A.x+0.55}" cy="${A.y-0.45}" r="0.4" fill="#fff"/>`;
    s+=`<circle cx="${A.x-0.55}" cy="${A.y-0.45}" r="0.18" fill="#111"/><circle cx="${A.x+0.55}" cy="${A.y-0.45}" r="0.18" fill="#111"/>`;
  });
  return s;
}

}

function ludoNew(np){
  const tokens=[];for(let p=0;p<np;p++)tokens.push([0,0,0,0]);
  return {tokens:tokens,np:np,turn:0,dice:0,rolling:0,extra:0,winner:-1,starts:[0,13,26,39]};
}
// مختصات دایره‌های مسیر روی viewBox 0..100 (صلیب)
function ludoBoardSvg(D,names,turn){
  const PC=SN_COL;
  const step=5.6, origin=12.5, R=2.85;
  const xy=(r,c)=>[origin+c*step, origin+r*step];
  let s='<svg viewBox="0 0 100 100" style="width:100%;max-width:290px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 6px 14px #0004)">';
  s+='<rect x="3" y="3" width="94" height="94" rx="8" fill="#e8d5b7" stroke="#5d4037" stroke-width="1.6"/>';
  // yards: TL red, TR yellow, BL blue, BR green
  s+='<rect x="5" y="5" width="33" height="33" rx="5" fill="#e53935" opacity="0.2"/>';
  s+='<rect x="62" y="5" width="33" height="33" rx="5" fill="#fdd835" opacity="0.25"/>';
  s+='<rect x="5" y="62" width="33" height="33" rx="5" fill="#1e88e5" opacity="0.2"/>';
  s+='<rect x="62" y="62" width="33" height="33" rx="5" fill="#43a047" opacity="0.2"/>';
  // path cells on cross (rows/cols 6-8)
  for(let r=0;r<15;r++){
    for(let c=0;c<15;c++){
      if(!((r>=6&&r<=8)||(c>=6&&c<=8)))continue;
      if(r===7&&c===7)continue;
      if((r<6||r>8)&&(c<6||c>8))continue;
      const [x,y]=xy(r,c);
      let fill='#ffffff';
      if(c===7&&r>=8&&r<=12)fill='#1e88e5';
      if(r===7&&c>=2&&c<=6)fill='#e53935';
      if(c===7&&r>=2&&r<=6)fill='#fdd835';
      if(r===7&&c>=8&&c<=12)fill='#43a047';
      s+='<circle cx="'+x+'" cy="'+y+'" r="'+R+'" fill="'+fill+'" stroke="#5d4037" stroke-width="0.65"/>';
    }
  }
  const [cx,cy]=xy(7,7);
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#fff8e1" stroke="#5d4037" stroke-width="0.9"/>';
  s+='<text x="'+cx+'" y="'+(cy+1.6)+'" text-anchor="middle" font-size="5.5" fill="#5d4037">★</text>';
  // path for movement
  if(!window.__LP){
    const seq=[];
    for(let r=13;r>=8;r--)seq.push([r,6]);
    for(let c=5;c>=0;c--)seq.push([8,c]);
    for(let r=7;r>=0;r--)seq.push([r,0]);
    for(let c=1;c<=6;c++)seq.push([0,c]);
    for(let r=1;r<=6;r++)seq.push([r,8]);
    for(let c=9;c<=14;c++)seq.push([6,c]);
    for(let r=7;r<=14;r++)seq.push([r,14]);
    for(let c=13;c>=8;c--)seq.push([14,c]);
    for(let r=13;r>=9;r--)seq.push([r,8]);
    window.__LP=seq.map(([r,c])=>xy(r,c));
    while(window.__LP.length<52)window.__LP.push(window.__LP[window.__LP.length-1]);
    window.__LP=window.__LP.slice(0,52);
  }
  const path=window.__LP;
  const yardSlots=[
    [[18,72],[28,72],[18,82],[28,82]],
    [[18,16],[28,16],[18,26],[28,26]],
    [[72,16],[82,16],[72,26],[82,26]],
    [[72,72],[82,72],[72,82],[82,82]]
  ];
  for(let p=0;p<D.np;p++){
    D.tokens[p].forEach((v,ti)=>{
      let x,y;
      if(v===0){const sl=yardSlots[p][ti];x=sl[0];y=sl[1];}
      else if(v>0&&v<53){const pt=path[(D.starts[p]+v-1)%52];x=pt[0];y=pt[1];}
      else{
        const k=Math.min(5,v-52);
        if(p===0){const q=xy(13-k,7);x=q[0];y=q[1]}
        else if(p===1){const q=xy(7,1+k);x=q[0];y=q[1]}
        else if(p===2){const q=xy(1+k,7);x=q[0];y=q[1]}
        else{const q=xy(7,13-k);x=q[0];y=q[1]}
      }
      const col=PC[p%4];
      s+='<g transform="translate('+x+','+y+')"><circle cx="0" cy="-1.2" r="2.6" fill="'+col+'" stroke="#fff" stroke-width="0.7"/><ellipse cx="0" cy="2.2" rx="2.7" ry="2.2" fill="'+col+'" stroke="#fff" stroke-width="0.55"/></g>';
    });
  }
  s+='</svg>';
  return s;
}

    html+=`<div class="card" style="text-align:center"><div style="font-size:56px">🏆</div><h2 style="color:${SN_COL[D.winner]}">${esc(names[D.winner])}</h2>${BK}</div>`;
    return html;
  }
  // player cards top
  html+=`<div class="player-hud">`;
  for(let p=0;p<D.np;p++){
    const done=D.tokens[p].filter(v=>v>=57).length;
    html+=`<div class="player-card${p===turn?' active':''}" style="background:linear-gradient(135deg,${SN_COL[p]},${SN_COL[p]}cc)">
      <div class="av">🙂</div>
      <div style="flex:1;text-align:right"><b>${esc(names[p])}</b><br><small>خانه: ${fa(done)}/۴</small></div>
      <div style="font-size:11px">⭐</div>
    </div>`;
  }
  html+=`</div>`;
  html+=`<div class="card" style="padding:10px;background:linear-gradient(180deg,#5c6bc0,#3949ab)">
  <div class="board-wrap">${ludoBoardSvg(D,names,turn)}</div>
  <div style="text-align:center;margin:10px 0">${diceHtml(D.dice||1,D.rolling)}</div>
  <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:8px">`;
  D.tokens[turn].forEach((v,ti)=>{
    const label=v===0?'خانه':v>=53?('پایان'):fa(v);
    html+=`<button class="chip" data-a="lt${turn}_${ti}" style="background:#fff3;border:2px solid #fff;color:#fff;padding:6px 10px">مهره ${fa(ti+1)} · ${label}</button>`;
  });
  html+=`</div>
  <button class="btn" data-a="ldRoll" style="--c:#ffca28;color:#333;width:100%;font-size:17px" ${D.rolling?'disabled':''}>🎲 ${D.rolling?'تاس می‌چرخد…':(D.extra?'مهره را انتخاب کن':'تاس بینداز')}</button>
  <p style="font-size:11px;text-align:center;color:#fff9;margin:8px 0 0">با ۶ از خانه خارج شو · مهره حریف را بزن · ۴ مهره را به ★ برسان</p>
  </div>`;
  return html;
};
function ludoRoll(){
  const st=BRD.local;if(!st||!st.data)return;
  const D=st.data;if(D.winner>=0||D.rolling)return;
  const turn=st.turn!=null?st.turn:D.turn;
  if(BRD.mode!=='local'&&BRD.room&&uid){
    const seat=(st.players||[]).findIndex(p=>p.uid===String(uid));
    if(seat>=0&&seat!==turn){say('نوبت تو نیست');return}
  }
  if(D.dice&&D.extra){say('اول مهره را حرکت بده');return}
  D.rolling=1;show('ldP');sfx.tap();
  const dice=1+(Math.random()*6|0);
  setTimeout(()=>{
    if(!BRD.local||!BRD.local.data)return;
    const D2=BRD.local.data;D2.rolling=0;D2.dice=dice;D2.extra=1;
    const moves=[];
    D2.tokens[turn].forEach((v,ti)=>{
      if(v===0&&dice===6)moves.push(ti);
      if(v>0&&v<53&&v+dice<=57)moves.push(ti);
      if(v>=53&&v+dice<=57)moves.push(ti);
    });
    if(!moves.length){D2.dice=0;D2.extra=0;BRD.local.turn=D2.turn=(turn+1)%D2.np;say('حرکت ممکن نیست')}
    else say('تاس: '+fa(dice));
    if(BRD.room)brdSaveRoom(BRD.local);
    show('ldP');
  },900);
}
function ludoTok(p,ti){
  const st=BRD.local;if(!st||!st.data)return;
  const D=st.data;const turn=st.turn!=null?st.turn:D.turn;
  if(p!==turn){say('نوبت این بازیکن نیست');return}
  if(!D.dice||!D.extra||D.rolling){say('اول تاس بزن');return}
  const v=D.tokens[p][ti];
  if(v===0){
    if(D.dice!==6){say('برای خروج ۶ لازم است');return}
    D.tokens[p][ti]=1;
  }else if(v>0&&v<=57){
    const nv=v+D.dice;
    if(nv>57){say('باید دقیق وارد شوی');return}
    D.tokens[p][ti]=nv;
    if(nv<53){
      const abs=(D.starts[p]+nv-1)%52;
      for(let op=0;op<D.np;op++)if(op!==p){
        D.tokens[op].forEach((ov,oi)=>{
          if(ov>0&&ov<53){
            const oabs=(D.starts[op]+ov-1)%52;
            if(oabs===abs){D.tokens[op][oi]=0;say('زد!');sfx.ok()}
          }
        });
      }
    }
  }else return;
  sfx.ok();
  const finished=D.tokens[p].every(x=>x>=57);
  if(finished){D.winner=p;sfx.win()}
  const again=D.dice===6&&!finished;
  D.dice=0;D.extra=0;
  if(!again&&D.winner<0)st.turn=D.turn=(turn+1)%D.np;
  if(BRD.room)brdSaveRoom(st);
  show('ldP');
}
