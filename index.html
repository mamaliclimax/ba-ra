<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>رادیو و تلویزیون</title>
  <script src="https://tapi.bale.ai/miniapp.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    :root {
      --bg0:#07070f; --bg1:#12122a; --card:#16162c; --text:#f4f5ff;
      --muted:#9aa3c0; --line:rgba(255,255,255,.08); --glow:rgba(139,124,255,.45);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--text);min-height:100vh;
      background:
        radial-gradient(1100px 560px at 100% -10%, rgba(139,124,255,.2), transparent 55%),
        radial-gradient(900px 500px at -10% 110%, rgba(0,206,201,.1), transparent 50%),
        linear-gradient(165deg,var(--bg0),var(--bg1) 55%,#0b0b18);
      padding:16px;
    }
    .wrap{max-width:480px;margin:0 auto}
    .screen{display:none;animation:fadeIn .25s ease}
    .screen.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .hero{text-align:center;margin-bottom:16px}
    .hero .badge{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-size:.78rem;margin-bottom:8px}
    .hero h1{font-size:1.55rem;background:linear-gradient(90deg,#fff,#c7c0ff 50%,#7ef0ea);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero p{color:var(--muted);margin-top:6px;font-size:.9rem}
    .home-grid{display:grid;gap:12px}
    .home-card{
      border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;
      background:var(--card);box-shadow:0 14px 36px rgba(0,0,0,.3);text-align:right;color:var(--text);
    }
    .home-card .banner{height:110px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;position:relative}
    .home-card .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,22,.75),transparent 55%)}
    .home-card .body{padding:12px 14px 14px}
    .home-card .name{font-weight:700;font-size:1.05rem}
    .home-card .desc{color:var(--muted);font-size:.82rem;margin-top:4px}
    .b-radio{background:linear-gradient(135deg,#5b4bdb,#00cec9)}
    .b-tv{background:linear-gradient(135deg,#e056fd,#686de0 50%,#ff6b81)}
    .back{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:.85rem;cursor:pointer;margin-bottom:12px}
    .stations{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .station{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);color:var(--text);cursor:pointer;padding:0;box-shadow:0 10px 24px rgba(0,0,0,.25)}
    .station .cover{height:88px;display:flex;align-items:center;justify-content:center;position:relative}
    .station .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,22,.8),transparent 60%)}
    .station .cover .emoji{font-size:2.2rem;position:relative;z-index:1}
    .station .body{padding:10px 12px}
    .station .name{font-weight:700;font-size:.92rem}
    .station .count{color:var(--muted);font-size:.72rem;margin-top:3px}
    .c-old{background:linear-gradient(135deg,#5c3b1e,#c49a6c 45%,#3a2615)}
    .c-happy{background:linear-gradient(135deg,#ff6b6b,#feca57 50%,#ff9ff3)}
    .c-calm{background:linear-gradient(135deg,#3b4a7a,#89a7d6 50%,#c9b6e4)}
    .c-pop{background:linear-gradient(135deg,#e056fd,#686de0 50%,#ff6b81)}
    .c-ai{background:linear-gradient(135deg,#0f2027,#00c9a7 45%,#2c5364)}
    .c-traditional{background:linear-gradient(135deg,#4a1506,#c0392b 40%,#d4a017)}
    .c-birthday{background:linear-gradient(135deg,#ff85a1,#ffd6a5 50%,#b8e0ff)}
    .c-foreign{background:linear-gradient(135deg,#0b3d91,#3d7ea6 50%,#1abc9c)}
    .c-dj{background:linear-gradient(135deg,#12051f,#8e2de2 45%,#00f5d4)}
    .player-card{border-radius:24px;overflow:hidden;border:1px solid var(--line);background:rgba(20,20,40,.8);box-shadow:0 18px 44px rgba(0,0,0,.4);margin-bottom:12px}
    .player-cover{height:190px;position:relative;display:flex;align-items:center;justify-content:center}
    .player-cover .glow{position:absolute;width:150px;height:150px;border-radius:50%;filter:blur(28px);opacity:.5}
    .disc{width:130px;height:130px;border-radius:50%;z-index:1;display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 36px rgba(0,0,0,.45),inset 0 0 0 10px rgba(255,255,255,.08);
      background:repeating-radial-gradient(circle at center,rgba(0,0,0,.35) 0 2px,rgba(255,255,255,.05) 2px 4px)}
    .disc.spin{animation:spin 8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .disc .hole{width:32px;height:32px;border-radius:50%;background:#0b0b16;border:3px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1rem}
    .player-body{padding:14px 16px 18px}
    .now-title{font-size:1.08rem;font-weight:700;text-align:center;min-height:2.4em}
    .now-meta{text-align:center;color:var(--muted);font-size:.82rem;margin-top:4px}
    .progress{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:14px 0 6px;cursor:pointer}
    .progress>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#8b7cff,#00cec9)}
    .times{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
    .controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px}
    .btn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);width:46px;height:46px;border-radius:50%;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .btn.play{width:66px;height:66px;font-size:1.55rem;background:linear-gradient(135deg,#8b7cff,#6c5ce7);border:none;box-shadow:0 10px 26px var(--glow)}
    .status{text-align:center;font-size:.78rem;color:var(--muted);margin-top:10px;min-height:1.2em}
    .status.error{color:#ff7b8a}
    .list{border-radius:18px;border:1px solid var(--line);background:rgba(20,20,40,.55);overflow:hidden}
    .list h2{font-size:.82rem;color:var(--muted);padding:12px 14px 6px}
    .track,.channel{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
    .track.active,.channel.active{background:rgba(139,124,255,.14)}
    .track .num,.channel .num{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted)}
    .track.active .num,.channel.active .num{background:linear-gradient(135deg,#8b7cff,#00cec9);color:#fff}
    .t{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:.9rem}
    /* TV */
    .tv-stage{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#000;margin-bottom:12px;aspect-ratio:16/9;position:relative}
    .tv-stage video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
    .tv-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:.95rem;pointer-events:none}
    .tv-overlay.hide{display:none}
    .tv-title{font-weight:700;font-size:1.05rem;margin-bottom:8px}
    .tv-actions{display:flex;gap:8px;margin-bottom:12px}
    .chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;padding:8px 12px;font-size:.82rem;cursor:pointer}
  </style>
</head>

  <div class="wrap">
    <!-- HOME -->
    <div id="screenHome" class="screen active">
      <div class="hero">
        <div class="badge">● MEDIA CENTER</div>
        <h1>رادیو و تلویزیون</h1>
        <p>یکی را انتخاب کن</p>
      </div>
      <div class="home-grid">
        <button class="home-card" id="goRadio">
          <div class="banner b-radio">📻</div>
          <div class="body"><div class="name">رادیو</div><div class="desc">ایستگاه‌های موسیقی</div></div>
        </button>
        <button class="home-card" id="goTv">
          <div class="banner b-tv">📺</div>
          <div class="body"><div class="name">تلویزیون</div><div class="desc">پخش زنده و آنلاین</div></div>
        </button>
      </div>
    </div>

    <!-- RADIO STATIONS -->
    <div id="screenRadioStations" class="screen">
      <button class="back" id="backHome1">← منوی اصلی</button>
      <div class="hero"><h1>📻 رادیو</h1><p>ایستگاه را انتخاب کنید</p></div>
      <div class="stations" id="stations"></div>
    </div>

    <!-- RADIO PLAYER -->
    <div id="screenRadioPlayer" class="screen">
      <button class="back" id="backStations">← ایستگاه‌ها</button>
      <div class="player-card">
        <div class="player-cover" id="playerCover">
          <div class="glow" id="coverGlow"></div>
          <div class="disc" id="disc"><div class="hole" id="discEmoji">🎵</div></div>
        </div>
        <div class="player-body">
          <div class="now-title" id="title">آماده پخش</div>
          <div class="now-meta" id="meta">—</div>
          <div class="progress" id="progress"><i id="bar"></i></div>
          <div class="times"><span id="cur">۰:۰۰</span><span id="dur">۰:۰۰</span></div>
          <div class="controls">
            <button class="btn" id="btnPrev">⏮</button>
            <button class="btn play" id="btnPlay">▶</button>
            <button class="btn" id="btnNext">⏭</button>
          </div>
          <div class="status" id="status"></div>
        </div>
      </div>
      <div class="list"><h2>لیست این ایستگاه</h2><div id="tracks"></div></div>
    </div>

    <!-- TV -->
    <div id="screenTv" class="screen">
      <button class="back" id="backHome2">← منوی اصلی</button>
      <div class="hero"><h1>📺 تلویزیون</h1><p>کانال را انتخاب و تماشا کن</p></div>
      <div class="tv-title" id="tvTitle">کانالی انتخاب نشده</div>
      <div class="tv-stage">
        <video id="tvVideo" playsinline controls></video>
        <div class="tv-overlay" id="tvOverlay">یک کانال از لیست زیر انتخاب کنید</div>
      </div>
      <div class="tv-actions">
        <button class="chip" id="tvFullscreen">⛶ تمام‌صفحه</button>
        <button class="chip" id="tvStop">⏹ توقف</button>
      </div>
      <div class="list"><h2>کانال‌ها</h2><div id="tvChannels"></div></div>
      <div class="status" id="tvStatus"></div>
    </div>
  </div>

    const THEMES = {
      old:{cls:"c-old",glow:"#c49a6c"}, happy:{cls:"c-happy",glow:"#feca57"},

    function fa(s){return String(s).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d])}
    function fmt(sec){if(!isFinite(sec)||sec<0)return"۰:۰۰";const m=Math.floor(sec/60),s=Math.floor(sec%60);return fa(m+":"+String(s).padStart(2,"0"))}
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
    function show(id){
      ["screenHome","screenRadioStations","screenRadioPlayer","screenTv"].forEach(x=>{
        document.getElementById(x).classList.toggle("active", x===id);
      });
    }

    // ---- RADIO ----
    const audio=document.getElementById("audio");
    try{audio.referrerPolicy="no-referrer"}catch(e){}
    let playlist=[], index=0, running=false, busy=false, gen=0, currentStation=null;
    const titleEl=document.getElementById("title"), metaEl=document.getElementById("meta");
    const statusEl=document.getElementById("status"), barEl=document.getElementById("bar");
    const curEl=document.getElementById("cur"), durEl=document.getElementById("dur");

    const disc=document.getElementById("disc"), discEmoji=document.getElementById("discEmoji");
    const playerCover=document.getElementById("playerCover"), coverGlow=document.getElementById("coverGlow");
    function status(msg,err){statusEl.textContent=msg||"";statusEl.className="status"+(err?" error":"")}
    function themeOf(id){return THEMES[id]||{cls:"c-pop",glow:"#8b7cff"}}

    function renderStations(){
      const box=document.getElementById("stations");
      if(!STATIONS.length){box.innerHTML='<div class="empty">ایستگاهی نیست</div>';return}
      box.innerHTML=STATIONS.map(st=>{
        const th=themeOf(st.id), n=(st.tracks||[]).length;
        return `<button class="station" data-id="${esc(st.id)}">
          <div class="cover ${th.cls}"><span class="emoji">${st.emoji||"📻"}</span></div>
          <div class="body"><div class="name">${esc(st.title)}</div><div class="count">${fa(n)} آهنگ</div></div>
        </button>`;
      }).join("");
      box.querySelectorAll(".station").forEach(b=>b.addEventListener("click",()=>openStation(b.dataset.id)));
    }
    function openStation(id){
      const st=STATIONS.find(x=>x.id===id); if(!st)return;
      currentStation=st; playlist=Array.isArray(st.tracks)?st.tracks.slice():[];
      index=0; running=false; busy=false;
      const th=themeOf(st.id);
      playerCover.className="player-cover "+th.cls;
      coverGlow.style.background=th.glow;
      discEmoji.textContent=st.emoji||"🎵";
      disc.classList.remove("spin");
      try{audio.pause()}catch(e){}
      audio.removeAttribute("src"); btnPlay.textContent="▶";
      status(playlist.length?"برای شروع ▶ را بزنید":"این ایستگاه آهنگی ندارد");
      renderTracks();
      if(playlist.length){titleEl.textContent=playlist[0].title||"آهنگ ۱";metaEl.textContent=(st.emoji||"")+" "+st.title+" · "+fa("1 از "+playlist.length)}
      else{titleEl.textContent="خالی";metaEl.textContent=st.title}
      show("screenRadioPlayer");
    }
    function renderTracks(){
      if(!playlist.length){tracksEl.innerHTML='<div class="empty">آهنگی نیست</div>';return}
      tracksEl.innerHTML=playlist.map((t,i)=>`<div class="track ${i===index?"active":""}" data-i="${i}">
        <div class="num">${fa(i+1)}</div><div class="t">${esc(t.title||("آهنگ "+(i+1)))}</div></div>`).join("");
      tracksEl.querySelectorAll(".track").forEach(el=>el.addEventListener("click",()=>{running=true;goTo(parseInt(el.dataset.i,10))}));
    }
    function goTo(i){
      if(!playlist.length)return;
      busy=true; gen++; const my=gen;
      index=((i%playlist.length)+playlist.length)%playlist.length;
      const track=playlist[index];
      titleEl.textContent=track.title||("آهنگ "+(index+1));
      metaEl.textContent=(currentStation?(currentStation.emoji+" "+currentStation.title+" · "):"")+fa((index+1)+" از "+playlist.length);
      renderTracks(); status("در حال بارگذاری...");
      try{audio.pause()}catch(e){}
      audio.referrerPolicy="no-referrer"; audio.src=track.url; audio.load();
      const tryPlay=()=>{
        if(my!==gen||!running){busy=false;return}
        const p=audio.play();
        if(p&&p.then){
          p.then(()=>{if(my!==gen)return;btnPlay.textContent="⏸";disc.classList.add("spin");status("");busy=false})
           .catch(()=>{if(my!==gen)return;status("پخش نشد؛ بعدی...",true);disc.classList.remove("spin");setTimeout(()=>{if(my===gen&&running)next()},800)});
        }else{btnPlay.textContent="⏸";disc.classList.add("spin");status("");busy=false}
      };
      audio.addEventListener("canplay",tryPlay,{once:true});
      setTimeout(tryPlay,400);
    }
    function next(){if(!busy)goTo(index+1)}
    function prev(){if(!busy)goTo(index-1)}
    audio.addEventListener("ended",()=>{if(running){busy=false;next()}});
    audio.addEventListener("error",()=>{if(!running)return;status("خطا؛ بعدی...",true);disc.classList.remove("spin");setTimeout(()=>{busy=false;next()},700)});
    audio.addEventListener("timeupdate",()=>{
      const d=audio.duration,c=audio.currentTime;
      barEl.style.width=(d&&isFinite(d)?(c/d)*100:0)+"%";
      curEl.textContent=fmt(c); durEl.textContent=fmt(d);
    });
    audio.addEventListener("playing",()=>{btnPlay.textContent="⏸";disc.classList.add("spin");status("");busy=false});
    btnPlay.addEventListener("click",()=>{
      if(!playlist.length){status("لیست خالی است",true);return}
      if(!running){running=true;if(!audio.src)goTo(index);else audio.play().then(()=>{btnPlay.textContent="⏸";disc.classList.add("spin")}).catch(()=>goTo(index))}
      else if(audio.paused){audio.play().then(()=>{btnPlay.textContent="⏸";disc.classList.add("spin")}).catch(()=>{})}
      else{audio.pause();running=false;btnPlay.textContent="▶";disc.classList.remove("spin")}
    });
    document.getElementById("btnNext").addEventListener("click",()=>{running=true;busy=false;next()});
    document.getElementById("btnPrev").addEventListener("click",()=>{running=true;busy=false;prev()});
    document.getElementById("progress").addEventListener("click",(e)=>{
      if(!audio.duration||!isFinite(audio.duration))return;

    }
    function playTv(i){
      if(!TV_CHANNELS.length)return;
      tvIndex=((i%TV_CHANNELS.length)+TV_CHANNELS.length)%TV_CHANNELS.length;
      const ch=TV_CHANNELS[tvIndex];
      tvTitle.textContent="▶ "+(ch.title||"کانال");
      tvOverlay.classList.remove("hide");
      tvOverlay.textContent="در حال اتصال...";
      tvMsg("");
      renderTvChannels();
      destroyHls();
      try{tvVideo.pause()}catch(e){}
      const url=ch.url||"";
      const isHls=/\.m3u8(\?|$)/i.test(url)||url.includes("m3u8");
      if(isHls && window.Hls && Hls.isSupported()){
        hls=new Hls({enableWorker:true, lowLatencyMode:true});
        hls.loadSource(url);
        hls.attachMedia(tvVideo);
        hls.on(Hls.Events.MANIFEST_PARSED,()=>{
          tvVideo.play().then(()=>{tvOverlay.classList.add("hide");tvMsg("")}).catch(()=>{tvMsg("برای پخش روی ویدئو ضربه بزنید",true);tvOverlay.classList.add("hide")});
        });
        hls.on(Hls.Events.ERROR,(_,data)=>{
          if(data && data.fatal){tvMsg("خطا در استریم این کانال",true);tvOverlay.textContent="پخش ممکن نشد";tvOverlay.classList.remove("hide")}
        });
      }else if(isHls && tvVideo.canPlayType("application/vnd.apple.mpegurl")){
        tvVideo.src=url;
        tvVideo.play().then(()=>{tvOverlay.classList.add("hide")}).catch(()=>{tvMsg("برای پخش روی ویدئو ضربه بزنید",true);tvOverlay.classList.add("hide")});
      }else{
        tvVideo.src=url;
        tvVideo.play().then(()=>{tvOverlay.classList.add("hide");tvMsg("")}).catch(()=>{tvMsg("برای پخش روی ویدئو ضربه بزنید",true);tvOverlay.classList.add("hide")});
      }
    }
    function renderTvChannels(){
      if(!TV_CHANNELS.length){tvChannelsEl.innerHTML='<div class="empty">هنوز کانالی اضافه نشده است</div>';return}
      tvChannelsEl.innerHTML=TV_CHANNELS.map((c,i)=>`<div class="channel ${i===tvIndex?"active":""}" data-i="${i}">
        <div class="num">${fa(i+1)}</div><div class="t">${esc(c.title||("کانال "+(i+1)))}</div></div>`).join("");
      tvChannelsEl.querySelectorAll(".channel").forEach(el=>el.addEventListener("click",()=>playTv(parseInt(el.dataset.i,10))));
    }

    document.getElementById("tvFullscreen").addEventListener("click",()=>{
      const el=tvVideo;
      if(el.requestFullscreen) el.requestFullscreen();
      else if(el.webkitEnterFullscreen) el.webkitEnterFullscreen();
    });
    document.getElementById("tvStop").addEventListener("click", stopTv);

    // nav
    document.getElementById("goRadio").addEventListener("click",()=>{
      stopTv(); renderStations(); show("screenRadioStations");
    });
    document.getElementById("goTv").addEventListener("click",()=>{
      try{audio.pause()}catch(e){} running=false; disc.classList.remove("spin");
      renderTvChannels(); show("screenTv");
    });
    document.getElementById("backHome1").addEventListener("click",()=>{try{audio.pause()}catch(e){} running=false; show("screenHome")});
    document.getElementById("backHome2").addEventListener("click",()=>{stopTv(); show("screenHome")});
    document.getElementById("backStations").addEventListener("click",()=>{
      try{audio.pause()}catch(e){} running=false; disc.classList.remove("spin"); show("screenRadioStations");
    });

    renderStations();
    renderTvChannels();
    try{ if(window.Bale&&Bale.WebApp){ Bale.WebApp.ready&&Bale.WebApp.ready(); Bale.WebApp.expand&&Bale.WebApp.expand(); } }catch(e){}
  </script>
</body>
</html>
