<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>رادیو و تلویزیون</title>
  <script src="https://tapi.bale.ai/miniapp.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    :root {
      --bg0:#07070f; --bg1:#12122a; --card:#16162c; --text:#f4f5ff;
      --muted:#9aa3c0; --line:rgba(255,255,255,.08); --glow:rgba(139,124,255,.45);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--text);min-height:100vh;
      background:
        radial-gradient(1100px 560px at 100% -10%, rgba(139,124,255,.2), transparent 55%),
        radial-gradient(900px 500px at -10% 110%, rgba(0,206,201,.1), transparent 50%),
        linear-gradient(165deg,var(--bg0),var(--bg1) 55%,#0b0b18);
      padding:16px;
    }
    .wrap{max-width:480px;margin:0 auto}
    .screen{display:none;animation:fadeIn .25s ease}
    .screen.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .hero{text-align:center;margin-bottom:16px}
    .hero .badge{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-size:.78rem;margin-bottom:8px}
    .hero h1{font-size:1.55rem;background:linear-gradient(90deg,#fff,#c7c0ff 50%,#7ef0ea);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero p{color:var(--muted);margin-top:6px;font-size:.9rem}
    .home-grid{display:grid;gap:12px}
    .home-card{
      border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;
      background:var(--card);box-shadow:0 14px 36px rgba(0,0,0,.3);text-align:right;color:var(--text);
    }
    .home-card .banner{height:110px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;position:relative}
    .home-card .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,22,.75),transparent 55%)}
    .home-card .body{padding:12px 14px 14px}
    .home-card .name{font-weight:700;font-size:1.05rem}
    .home-card .desc{color:var(--muted);font-size:.82rem;margin-top:4px}
    .b-radio{background:linear-gradient(135deg,#5b4bdb,#00cec9)}
    .b-tv{background:linear-gradient(135deg,#e056fd,#686de0 50%,#ff6b81)}
    .back{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:.85rem;cursor:pointer;margin-bottom:12px}
    .stations{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .station{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);color:var(--text);cursor:pointer;padding:0;box-shadow:0 10px 24px rgba(0,0,0,.25)}
    .station .cover{height:88px;display:flex;align-items:center;justify-content:center;position:relative}
    .station .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,22,.8),transparent 60%)}
    .station .cover .emoji{font-size:2.2rem;position:relative;z-index:1}
    .station .body{padding:10px 12px}
    .station .name{font-weight:700;font-size:.92rem}
    .station .count{color:var(--muted);font-size:.72rem;margin-top:3px}
    .c-old{background:linear-gradient(135deg,#5c3b1e,#c49a6c 45%,#3a2615)}
    .c-happy{background:linear-gradient(135deg,#ff6b6b,#feca57 50%,#ff9ff3)}
    .c-calm{background:linear-gradient(135deg,#3b4a7a,#89a7d6 50%,#c9b6e4)}
    .c-pop{background:linear-gradient(135deg,#e056fd,#686de0 50%,#ff6b81)}
    .c-ai{background:linear-gradient(135deg,#0f2027,#00c9a7 45%,#2c5364)}
    .c-traditional{background:linear-gradient(135deg,#4a1506,#c0392b 40%,#d4a017)}
    .c-birthday{background:linear-gradient(135deg,#ff85a1,#ffd6a5 50%,#b8e0ff)}
    .c-foreign{background:linear-gradient(135deg,#0b3d91,#3d7ea6 50%,#1abc9c)}
    .c-dj{background:linear-gradient(135deg,#12051f,#8e2de2 45%,#00f5d4)}
    .c-national{background:linear-gradient(135deg,#0b3d2e,#1b7a4e 40%,#c9a227)}
    .player-card{border-radius:24px;overflow:hidden;border:1px solid var(--line);background:rgba(20,20,40,.8);box-shadow:0 18px 44px rgba(0,0,0,.4);margin-bottom:12px}
    .player-cover{height:190px;position:relative;display:flex;align-items:center;justify-content:center}
    .player-cover .glow{position:absolute;width:150px;height:150px;border-radius:50%;filter:blur(28px);opacity:.5}
    .disc{width:130px;height:130px;border-radius:50%;z-index:1;display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 36px rgba(0,0,0,.45),inset 0 0 0 10px rgba(255,255,255,.08);
      background:repeating-radial-gradient(circle at center,rgba(0,0,0,.35) 0 2px,rgba(255,255,255,.05) 2px 4px)}
    .disc.spin{animation:spin 8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .disc .hole{width:32px;height:32px;border-radius:50%;background:#0b0b16;border:3px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1rem}
    .player-body{padding:14px 16px 18px}
    .now-title{font-size:1.08rem;font-weight:700;text-align:center;min-height:2.4em}
    .now-meta{text-align:center;color:var(--muted);font-size:.82rem;margin-top:4px}
    .progress{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:14px 0 6px;cursor:pointer}
    .progress>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#8b7cff,#00cec9)}
    .times{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
    .controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px}
    .btn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);width:46px;height:46px;border-radius:50%;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .btn.play{width:66px;height:66px;font-size:1.55rem;background:linear-gradient(135deg,#8b7cff,#6c5ce7);border:none;box-shadow:0 10px 26px var(--glow)}
    .status{text-align:center;font-size:.78rem;color:var(--muted);margin-top:10px;min-height:1.2em}
    .status.error{color:#ff7b8a}
    .list{border-radius:18px;border:1px solid var(--line);background:rgba(20,20,40,.55);overflow:hidden}
    .list h2{font-size:.82rem;color:var(--muted);padding:12px 14px 6px}
    .track,.channel{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
    .track.active,.channel.active{background:rgba(139,124,255,.14)}
    .track .num,.channel .num{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted)}
    .track.active .num,.channel.active .num{background:linear-gradient(135deg,#8b7cff,#00cec9);color:#fff}
    .t{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:.9rem}
    /* TV */
    .tv-stage{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#000;margin-bottom:12px;aspect-ratio:16/9;position:relative}
    .tv-stage video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
    .tv-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:.95rem;pointer-events:none}
    .tv-overlay.hide{display:none}
    .tv-title{font-weight:700;font-size:1.05rem;margin-bottom:8px}
    .tv-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
    .chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;padding:8px 12px;font-size:.82rem;cursor:pointer}
    .btn-bg{width:100%;margin-top:12px;border:1px solid rgba(0,206,201,.35);background:linear-gradient(135deg,rgba(0,206,201,.18),rgba(139,124,255,.18));color:var(--text);border-radius:14px;padding:12px 14px;font-size:.9rem;font-weight:700;cursor:pointer}
    .btn-bg small{display:block;font-weight:500;opacity:.75;margin-top:4px;font-size:.72rem}
    .chip.active{background:linear-gradient(135deg,#8b7cff,#6c5ce7);border-color:transparent}
    .quality-wrap .lab{color:var(--muted);font-size:.78rem;margin-left:4px}
  
    .tv-stage{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#000;margin-bottom:12px;aspect-ratio:16/9;position:relative}
    .tv-stage video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
    .tv-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:.95rem;pointer-events:none;z-index:2}
    .tv-overlay.hide{display:none}

  </style>
</head>
<body>
  <div class="wrap">
    <!-- HOME -->
    <div id="screenHome" class="screen active">
      <div class="hero">
        <div class="badge">● MEDIA CENTER</div>
        <h1>رادیو و تلویزیون</h1>
        <p>یکی را انتخاب کن</p>
      </div>
      <div class="home-grid">
        <button class="home-card" id="goRadio">
          <div class="banner b-radio">📻</div>
          <div class="body"><div class="name">رادیو</div><div class="desc">ایستگاه‌های موسیقی</div></div>
        </button>
        <button class="home-card" id="goTv">
          <div class="banner b-tv">📺</div>
          <div class="body"><div class="name">تلویزیون</div><div class="desc">پخش زنده و آنلاین</div></div>
        </button>
        <button class="home-card" id="goGame">
          <div class="banner b-radio" style="background:linear-gradient(135deg,#31c46b,#3aa0e8)">🎮</div>
          <div class="body"><div class="name">مکعب‌لند</div><div class="desc">بازی سه‌بعدی بلوکی</div></div>
        </button>
      </div>
    </div>

    <!-- RADIO STATIONS -->
    <div id="screenRadioStations" class="screen">
      <button class="back" id="backHome1">← منوی اصلی</button>
      <div class="hero"><h1>📻 رادیو</h1><p>ایستگاه را انتخاب کنید</p></div>
      <div class="stations" id="stations"></div>
    </div>

    <!-- RADIO PLAYER -->
    <div id="screenRadioPlayer" class="screen">
      <button class="back" id="backStations">← ایستگاه‌ها</button>
      <div class="player-card">
        <div class="player-cover" id="playerCover">
          <div class="glow" id="coverGlow"></div>
          <div class="disc" id="disc"><div class="hole" id="discEmoji">🎵</div></div>
        </div>
        <div class="player-body">
          <div class="now-title" id="title">آماده پخش</div>
          <div class="now-meta" id="meta">—</div>
          <div class="progress" id="progress"><i id="bar"></i></div>
          <div class="times"><span id="cur">۰:۰۰</span><span id="dur">۰:۰۰</span></div>
          <div class="controls">
            <button class="btn" id="btnPrev">⏮</button>
            <button class="btn play" id="btnPlay">▶</button>
            <button class="btn" id="btnNext">⏭</button>
          </div>
          <div class="status" id="status"></div>
          <button type="button" class="btn-bg" id="btnBgPlay">📲 پخش پایدار در مرورگر گوشی
            <small>برای بک‌گراند و نوتیفیکیشن — مینی‌اپ بله صدا را قطع می‌کند</small>
          </button>
          <div class="status" id="playerVer" style="opacity:.55;font-size:.7rem;margin-top:4px">پلیر رادیو v5</div>
        </div>
      </div>
      <div class="list"><h2>لیست این ایستگاه</h2><div id="tracks"></div></div>
    </div>

    <!-- TV -->
    <div id="screenTv" class="screen">
      <button class="back" id="backHome2">← منوی اصلی</button>
      <div class="hero"><h1>📺 تلویزیون</h1><p>کانال را انتخاب و تماشا کن</p></div>
      <div class="tv-title" id="tvTitle">کانالی انتخاب نشده</div>
      <div class="tv-stage" id="tvStage">
        <video id="tvVideo" playsinline controls preload="auto" referrerpolicy="no-referrer"></video>
        <div class="tv-overlay" id="tvOverlay">یک کانال از لیست زیر انتخاب کنید</div>
      </div>
      <div class="tv-actions">
        <button class="chip" id="tvFullscreen">⛶ تمام‌صفحه</button>
        <button class="chip" id="tvStop">⏹ توقف</button>
      </div>
      <div class="list"><h2>کانال‌ها</h2><div id="tvChannels"></div></div>
      <div class="status" id="tvStatus"></div>
    </div>
  </div>

  <audio id="audio" preload="auto" playsinline webkit-playsinline></audio>
  <script>
    const STATIONS = /*__STATIONS_JSON__*/[];
    const TV_CHANNELS = /*__TV_CHANNELS_JSON__*/[];
    const THEMES = {
      old:{cls:"c-old",glow:"#c49a6c"}, happy:{cls:"c-happy",glow:"#feca57"},
      calm:{cls:"c-calm",glow:"#89a7d6"}, pop:{cls:"c-pop",glow:"#e056fd"},
      ai:{cls:"c-ai",glow:"#00c9a7"}, traditional:{cls:"c-traditional",glow:"#d4a017"},
      birthday:{cls:"c-birthday",glow:"#ff85a1"}, foreign:{cls:"c-foreign",glow:"#3d7ea6"},
      dj:{cls:"c-dj",glow:"#8e2de2"}, national:{cls:"c-national",glow:"#1b7a4e"}
    };

    function fa(s){return String(s).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d])}
    function fmt(sec){if(!isFinite(sec)||sec<0)return"۰:۰۰";const m=Math.floor(sec/60),s=Math.floor(sec%60);return fa(m+":"+String(s).padStart(2,"0"))}
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
    function show(id){
      ["screenHome","screenRadioStations","screenRadioPlayer","screenTv"].forEach(x=>{
        document.getElementById(x).classList.toggle("active", x===id);
      });
    }

    // ---- RADIO ----
    const audio=document.getElementById("audio");
    try{audio.referrerPolicy="no-referrer"}catch(e){}
    let playlist=[], index=0, running=false, busy=false, gen=0, currentStation=null;
    const titleEl=document.getElementById("title"), metaEl=document.getElementById("meta");
    const statusEl=document.getElementById("status"), barEl=document.getElementById("bar");
    const curEl=document.getElementById("cur"), durEl=document.getElementById("dur");
    const tracksEl=document.getElementById("tracks"), btnPlay=document.getElementById("btnPlay");
    const disc=document.getElementById("disc"), discEmoji=document.getElementById("discEmoji");
    const playerCover=document.getElementById("playerCover"), coverGlow=document.getElementById("coverGlow");
    function status(msg,err){statusEl.textContent=msg||"";statusEl.className="status"+(err?" error":"")}
    function themeOf(id){return THEMES[id]||{cls:"c-pop",glow:"#8b7cff"}}

    function renderStations(){
      const box=document.getElementById("stations");
      if(!STATIONS.length){box.innerHTML='<div class="empty">ایستگاهی نیست</div>';return}
      box.innerHTML=STATIONS.map(st=>{
        const th=themeOf(st.id), n=(st.tracks||[]).length;
        return `<button class="station" data-id="${esc(st.id)}">
          <div class="cover ${th.cls}"><span class="emoji">${st.emoji||"📻"}</span></div>
          <div class="body"><div class="name">${esc(st.title)}</div><div class="count">${fa(n)} آهنگ</div></div>
        </button>`;
      }).join("");
      box.querySelectorAll(".station").forEach(b=>b.addEventListener("click",()=>openStation(b.dataset.id)));
    }
    function openStation(id){
      const st=STATIONS.find(x=>x.id===id); if(!st)return;
      currentStation=st; playlist=Array.isArray(st.tracks)?st.tracks.slice():[];
      index=0; running=false; busy=false;
      const th=themeOf(st.id);
      playerCover.className="player-cover "+th.cls;
      coverGlow.style.background=th.glow;
      discEmoji.textContent=st.emoji||"🎵";
      disc.classList.remove("spin");
      try{audio.pause()}catch(e){}
      if(typeof destroyRadioHls==="function")destroyRadioHls();
      audio.removeAttribute("src"); btnPlay.textContent="▶";
      status(playlist.length?"برای شروع ▶ را بزنید":"این ایستگاه آهنگی ندارد");
      renderTracks();
      if(playlist.length){titleEl.textContent=playlist[0].title||"آهنگ ۱";metaEl.textContent=(st.emoji||"")+" "+st.title+" · "+fa("1 از "+playlist.length)}
      else{titleEl.textContent="خالی";metaEl.textContent=st.title}
      show("screenRadioPlayer");
    }
    function renderTracks(){
      if(!playlist.length){tracksEl.innerHTML='<div class="empty">آهنگی نیست</div>';return}
      tracksEl.innerHTML=playlist.map((t,i)=>`<div class="track ${i===index?"active":""}" data-i="${i}">
        <div class="num">${fa(i+1)}</div><div class="t">${esc(t.title||("آهنگ "+(i+1)))}</div></div>`).join("");
      tracksEl.querySelectorAll(".track").forEach(el=>el.addEventListener("click",()=>{running=true;goTo(parseInt(el.dataset.i,10))}));
    }
    let radioHls=null;
    let urlAttempt=0;
    let currentUrlList=[];
    let watchdogTimer=null;
    let bgTimer=null;
    let lastProgressAt=0;
    let lastMediaTime=-1;
    let sessionStartedAt=0;
    let reconnectTries=0;
    let userPaused=false;
    let isLiveTrack=false;
    let currentPlayUrl="";
    const MAX_RECONNECT=6;
    const PLAYER_VER="v5";

    function destroyRadioHls(){if(radioHls){try{radioHls.destroy()}catch(e){} radioHls=null}}
    function clearRadioTimers(){
      if(watchdogTimer){clearInterval(watchdogTimer);watchdogTimer=null}
      if(bgTimer){clearInterval(bgTimer);bgTimer=null}
    }
    function trackUrlList(track){
      const list=[]; const seen={};
      const add=(u)=>{
        u=String(u||"").trim();
        if(!u) return;
        if(location.protocol==="https:" && u.indexOf("http://")===0) return;
        if(seen[u]) return; seen[u]=1; list.push(u);
      };
      if(Array.isArray(track.urls)) track.urls.forEach(add);
      add(track.url);
      if(!list.length && track.url) list.push(String(track.url).trim());
      return list;
    }
    function trackIsLive(track){
      if(!track) return false;
      return [track.url].concat(track.urls||[]).some(u=>/\.m3u8/i.test(String(u||"")));
    }
    function markProgress(){
      lastProgressAt=Date.now();
      try{ if(isFinite(audio.currentTime)) lastMediaTime=audio.currentTime; }catch(e){}
    }
    function setStatus(msg, err){
      statusEl.textContent=msg||"";
      statusEl.className="status"+(err?" error":"");
    }
    function updateMediaSession(){
      try{
        if(!("mediaSession" in navigator)) return;
        const track=playlist[index]||{};
        const st=currentStation||{};
        navigator.mediaSession.metadata=new MediaMetadata({
          title: String(track.title||"رادیو زنده"),
          artist: ((st.emoji?st.emoji+" ":"")+(st.title||"رادیو ملی")).trim(),
          album: "Hamdeli Radio "+PLAYER_VER
        });
        navigator.mediaSession.playbackState = (running && !audio.paused) ? "playing" : "paused";
        try{
          if(isLiveTrack){
            navigator.mediaSession.setPositionState({
              duration: Number.POSITIVE_INFINITY,
              playbackRate: 1,
              position: Math.max(0, (Date.now()-(sessionStartedAt||Date.now()))/1000)
            });
          }
        }catch(e){}
        const bind=(action, fn)=>{ try{ navigator.mediaSession.setActionHandler(action, fn); }catch(e){} };
        bind("play", function(){
          userPaused=false; running=true;
          resumeOrPlay("ms-play");
        });
        bind("pause", function(){
          userPaused=true; running=false; clearRadioTimers();
          try{audio.pause()}catch(e){}
          btnPlay.textContent="▶"; disc.classList.remove("spin");
          setStatus("متوقف شد");
          updateMediaSession();
        });
        bind("previoustrack", function(){ userPaused=false; running=true; busy=false; reconnectTries=0; prev(); });
        bind("nexttrack", function(){ userPaused=false; running=true; busy=false; reconnectTries=0; next(); });
        bind("stop", function(){
          userPaused=true; running=false; clearRadioTimers();
          try{audio.pause()}catch(e){}
          destroyRadioHls();
          btnPlay.textContent="▶"; disc.classList.remove("spin");
          updateMediaSession();
        });
      }catch(e){}
    }
    // ادامه پخش بدون نابود کردن HLS (مهم برای بک‌گراند)
    function resumeOrPlay(why){
      if(!running || userPaused) return;
      try{
        if(radioHls){
          try{ radioHls.startLoad(); }catch(e){}
        }
        if(audio.paused){
          const p=audio.play();
          if(p&&p.then){
            p.then(function(){
              btnPlay.textContent="⏸"; disc.classList.add("spin");
              setStatus(isLiveTrack?"● پخش زنده":"");
              markProgress(); updateMediaSession();
            }).catch(function(){
              // فقط اگر src مرده باشد، از نو وصل کن
              if(!audio.src && !radioHls) softReconnect("no-src");
            });
          }
        } else {
          markProgress(); updateMediaSession();
        }
      }catch(e){}
    }
    function isActuallyStuck(){
      if(!running || userPaused || busy) return false;
      // حداقل ۴۵ ثانیه هیچ پیشرفت رسانه‌ای نباشد
      if(Date.now()-lastProgressAt < 45000) return false;
      if(!audio.paused && audio.readyState>=3){ markProgress(); return false; }
      return true;
    }
    function softReconnect(reason){
      if(!running || userPaused || !playlist.length) return;
      if(busy) return;
      if(reason!=="manual" && reason!=="fatal" && reason!=="ended" && reason!=="audio-error" && reason!=="urls" && reason!=="no-src"){
        if(!isActuallyStuck()) return;
      }
      reconnectTries++;
      if(reconnectTries>MAX_RECONNECT){
        setStatus("قطع شد. از نوتیفیکیشن یا ▶ دوباره پخش کنید.", true);
        disc.classList.remove("spin"); btnPlay.textContent="▶";
        running=false; clearRadioTimers(); updateMediaSession();
        return;
      }
      setStatus("وصل مجدد…", true);
      const track=playlist[index];
      currentUrlList=trackUrlList(track);
      urlAttempt=0; busy=true; gen++;
      const my=gen;
      if(!currentUrlList.length){ busy=false; return; }
      playUrl(my, currentUrlList[0], currentUrlList.length===1);
    }
    function startWatchdog(){
      if(watchdogTimer) clearInterval(watchdogTimer);
      lastProgressAt=Date.now();
      watchdogTimer=setInterval(function(){
        if(!running || userPaused) return;
        if(isLiveTrack && sessionStartedAt){
          curEl.textContent=fmt((Date.now()-sessionStartedAt)/1000);
          durEl.textContent="زنده";
          barEl.style.width="100%";
        }
        try{ updateMediaSession(); }catch(e){}
        // در پس‌زمینه فقط resume ملایم — ریست نکن
        if(document.visibilityState==="hidden"){
          resumeOrPlay("bg-watch");
          return;
        }
        if(isActuallyStuck()) softReconnect("watchdog");
        else if(audio.paused) resumeOrPlay("wd-pause");
      }, 6000);
    }
    function startBgTimer(){
      if(bgTimer) clearInterval(bgTimer);
      bgTimer=setInterval(function(){
        if(!running || userPaused) return;
        // فقط نگه داشتن پخش / لود؛ destroy نکن
        resumeOrPlay("keep");
        try{ if(radioHls) radioHls.startLoad(); }catch(e){}
      }, 10000);
    }
    function playUrl(my, url, isLast){
      destroyRadioHls();
      currentPlayUrl=url;
      audio.removeAttribute("src");
      try{audio.load()}catch(e){}
      if(location.protocol==="https:" && url.indexOf("http://")===0){
        setStatus("لینک HTTP روی HTTPS مسدود است", true);
        if(!isLast) setTimeout(()=>{if(my===gen) tryNextUrl(my)}, 300);
        else { busy=false; running=false; btnPlay.textContent="▶"; disc.classList.remove("spin"); }
        return;
      }
      const isHls=/\.m3u8(\?|$)/i.test(url) || /m3u8/i.test(url);
      isLiveTrack=isHls;
      setStatus("اتصال"+(currentUrlList.length>1?(" "+fa(urlAttempt+1)+"/"+fa(currentUrlList.length)): "")+"…");

      const onOk=()=>{
        if(my!==gen)return;
        btnPlay.textContent="⏸"; disc.classList.add("spin");
        setStatus(isHls?"● پخش زنده — از نوتیفیکیشن کنترل کنید":"");
        busy=false;
        if(!sessionStartedAt) sessionStartedAt=Date.now();
        markProgress(); reconnectTries=0;
        startWatchdog(); startBgTimer(); updateMediaSession();
      };
      const onFail=(reason)=>{
        if(my!==gen)return;
        destroyRadioHls();
        if(!isLast){
          setStatus("لینک بعدی…", true);
          setTimeout(()=>{if(my===gen) tryNextUrl(my)}, 350);
          return;
        }
        if(running && !userPaused && reconnectTries<MAX_RECONNECT){
          busy=false;
          setTimeout(()=>{ if(my===gen && running && !userPaused) softReconnect("fatal"); }, 2500);
          return;
        }
        setStatus("قطع شد. ▶ را بزنید.", true);
        disc.classList.remove("spin"); btnPlay.textContent="▶";
        running=false; busy=false; clearRadioTimers(); updateMediaSession();
      };
      const tryPlayNative=()=>{
        if(my!==gen||!running||userPaused){busy=false;return}
        const p=audio.play();
        if(p&&p.then) p.then(onOk).catch(()=>onFail("play"));
        else onOk();
      };

      function setupHls(){
        if(!(window.Hls && Hls.isSupported())){
          try{ audio.removeAttribute("crossorigin"); }catch(e){}
          audio.src=url; audio.load();
          audio.addEventListener("canplay", tryPlayNative, {once:true});
          audio.addEventListener("error", ()=>onFail("err"), {once:true});
          setTimeout(()=>{ if(my===gen && running && audio.readyState<2) onFail("timeout"); }, 15000);
          return;
        }
        radioHls=new Hls({
          enableWorker:true,
          lowLatencyMode:false,
          backBufferLength:30,
          maxBufferLength:60,
          maxMaxBufferLength:120,
          maxBufferSize:60*1000*1000,
          maxBufferHole:2,
          highBufferWatchdogPeriod:5,
          nudgeMaxRetry:15,
          liveSyncDurationCount:7,
          liveMaxLatencyDurationCount:20,
          liveDurationInfinity:true,
          manifestLoadingTimeOut:25000,
          manifestLoadingMaxRetry:5,
          levelLoadingTimeOut:25000,
          levelLoadingMaxRetry:5,
          fragLoadingTimeOut:30000,
          fragLoadingMaxRetry:8,
          fragLoadingRetryDelay:1200,
          startFragPrefetch:true,
          testBandwidth:false,
          xhrSetup:function(xhr){ try{ xhr.withCredentials=false; }catch(e){} }
        });
        radioHls.loadSource(url);
        radioHls.attachMedia(audio);
        radioHls.on(Hls.Events.MANIFEST_PARSED, function(){ if(my===gen) tryPlayNative(); });
        radioHls.on(Hls.Events.FRAG_LOADED, function(){ markProgress(); });
        radioHls.on(Hls.Events.FRAG_BUFFERED, function(){ markProgress(); });
        radioHls.on(Hls.Events.ERROR, function(_, data){
          if(!data||my!==gen) return;
          if(!data.fatal){
            // بافر/شبکه کوتاه: فقط recover ملایم — از صفر شروع نکن
            try{
              if(data.type===Hls.ErrorTypes.MEDIA_ERROR) radioHls.recoverMediaError();
            }catch(e){}
            return;
          }
          try{
            if(data.type===Hls.ErrorTypes.MEDIA_ERROR){ radioHls.recoverMediaError(); return; }
            if(data.type===Hls.ErrorTypes.NETWORK_ERROR){ radioHls.startLoad(); return; }
          }catch(e){}
          onFail(data.details||"hls");
        });
      }

      if(isHls && audio.canPlayType && (audio.canPlayType("application/vnd.apple.mpegurl")||audio.canPlayType("application/x-mpegURL"))){
        try{ audio.removeAttribute("crossorigin"); }catch(e){}
        audio.src=url; audio.load();
        audio.addEventListener("canplay", tryPlayNative, {once:true});
        audio.addEventListener("error", function(){ if(my===gen) setupHls(); }, {once:true});
        setTimeout(()=>{ if(my===gen && audio.readyState<2 && running) tryPlayNative(); }, 2000);
        return;
      }
      if(isHls){ setupHls(); return; }
      try{ audio.removeAttribute("crossorigin"); }catch(e){}
      audio.src=url; audio.load();
      audio.addEventListener("canplay", tryPlayNative, {once:true});
      audio.addEventListener("error", ()=>onFail("err"), {once:true});
    }
    function tryNextUrl(my){
      urlAttempt++;
      if(urlAttempt>=currentUrlList.length){
        busy=false;
        if(running && !userPaused) setTimeout(()=>{ if(my===gen) softReconnect("urls"); }, 2000);
        return;
      }
      playUrl(my, currentUrlList[urlAttempt], urlAttempt===currentUrlList.length-1);
    }
    function goTo(i){
      if(!playlist.length)return;
      userPaused=false; busy=true; gen++; const my=gen;
      reconnectTries=0; sessionStartedAt=0; lastMediaTime=-1;
      clearRadioTimers();
      index=((i%playlist.length)+playlist.length)%playlist.length;
      const track=playlist[index];
      isLiveTrack=trackIsLive(track);
      titleEl.textContent=track.title||("آهنگ "+(index+1));
      metaEl.textContent=(currentStation?(currentStation.emoji+" "+currentStation.title+" · "):"")+fa((index+1)+" از "+playlist.length);
      renderTracks();
      try{audio.pause()}catch(e){}
      destroyRadioHls();
      currentUrlList=trackUrlList(track); urlAttempt=0;
      if(!currentUrlList.length){ setStatus("لینک نیست", true); busy=false; running=false; return; }
      if(!running) running=true;
      updateMediaSession();
      playUrl(my, currentUrlList[0], currentUrlList.length===1);
    }
    function next(){if(!busy)goTo(index+1)}
    function prev(){if(!busy)goTo(index-1)}

    audio.addEventListener("ended",()=>{
      if(!running||userPaused) return;
      if(isLiveTrack) softReconnect("ended");
      else { busy=false; next(); }
    });
    audio.addEventListener("error",()=>{
      if(!running||userPaused) return;
      // تلاش برای ادامه همان stream بدون ریست فوری
      try{ if(radioHls){ radioHls.startLoad(); audio.play().catch(function(){}); return; } }catch(e){}
      softReconnect("audio-error");
    });
    audio.addEventListener("waiting",()=>{
      if(!running||userPaused) return;
      // فقط پیام — ریست ممنوع (همان باگ ۱۵ثانیه)
      if(document.visibilityState==="hidden") setStatus("● بک‌گراند · بافر…");
      else setStatus("● بافر…");
      try{ if(radioHls) radioHls.startLoad(); }catch(e){}
    });
    audio.addEventListener("playing",()=>{
      btnPlay.textContent="⏸"; disc.classList.add("spin");
      setStatus(isLiveTrack?"● پخش زنده — کنترل از نوتیفیکیشن":"");
      busy=false; markProgress();
      if(!sessionStartedAt) sessionStartedAt=Date.now();
      reconnectTries=0;
      startWatchdog(); startBgTimer(); updateMediaSession();
    });
    audio.addEventListener("timeupdate",()=>{
      try{
        if(isFinite(audio.currentTime) && audio.currentTime > lastMediaTime + 0.15) markProgress();
      }catch(e){}
      if(isLiveTrack){
        if(!sessionStartedAt) sessionStartedAt=Date.now();
        curEl.textContent=fmt((Date.now()-sessionStartedAt)/1000);
        durEl.textContent="زنده"; barEl.style.width="100%";
      } else {
        const d=audio.duration,c=audio.currentTime;
        if(d&&isFinite(d)&&d>0){ barEl.style.width=((c/d)*100)+"%"; durEl.textContent=fmt(d); }
        curEl.textContent=fmt(c);
      }
    });
    audio.addEventListener("pause",()=>{
      updateMediaSession();
      if(!running || userPaused) return;
      // سیستم pause کرده — بدون destroy فقط play
      setTimeout(function(){ resumeOrPlay("sys-pause"); }, 300);
    });

    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState==="hidden"){
        // رفتن به بک‌گراند: پخش را نکش؛ بافر را پر کن
        if(running && !userPaused){
          try{ if(radioHls){ radioHls.startLoad(); } }catch(e){}
          resumeOrPlay("hide");
          updateMediaSession();

        return;
      }
      // برگشت: فقط resume — از صفر شروع نکن
      if(!running||userPaused) return;
      setStatus("● بازگشت · ادامه پخش…");
      setTimeout(function(){
        if(!running||userPaused) return;

        // ریست فقط اگر ۴۵ثانیه واقعاً مرده باشد

    btnPlay.addEventListener("click",()=>{

    document.getElementById("btnNext").addEventListener("click",()=>{userPaused=false;running=true;busy=false;reconnectTries=0;next()});
    document.getElementById("btnPrev").addEventListener("click",()=>{userPaused=false;running=true;busy=false;reconnectTries=0;prev()});
    document.getElementById("progress").addEventListener("click",(e)=>{
      if(isLiveTrack) return;
      if(!audio.duration||!isFinite(audio.duration))return;
      const r=e.currentTarget.getBoundingClientRect();
      audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration;
    });


    
    // پخش پایدار: باز کردن همین صفحه در مرورگر سیستم (Chrome/Safari)
    // WebView بله با خروج از مینی‌اپ صدا را می‌کشد؛ مرورگر سیستم مثل رادیوی گوشی در بک‌گراند می‌ماند.
    function openSystemBrowserPlayer(){
      try{
        const track=playlist[index]||{};
        const st=currentStation||{};
        const params=new URLSearchParams();
        params.set("mode","radio");
        params.set("bg","1");
        params.set("autostart","1");
        if(st.id) params.set("station", st.id);
        if(track.url) params.set("src", track.url);
        if(track.title) params.set("title", track.title);
        const base=location.href.split("#")[0].split("?")[0];
        const target=base+"?"+params.toString();
        const wa=(window.Bale&&Bale.WebApp)||(window.Telegram&&Telegram.WebApp);
        if(wa && wa.openLink){
          wa.openLink(target);
          setStatus("در مرورگر باز شد — آنجا پخش کنید تا در بک‌گراند بماند");
          return;
        }
        const w=window.open(target, "_blank", "noopener,noreferrer");
        if(!w){
          // کپی لینک
          try{
            if(navigator.clipboard && navigator.clipboard.writeText){
              navigator.clipboard.writeText(target);
              setStatus("لینک کپی شد؛ در Chrome/Safari باز کنید", true);
            } else {
              setStatus("این لینک را در مرورگر باز کنید:\n"+target, true);
            }
          }catch(e){
            setStatus("مرورگر را دستی باز کنید: "+target, true);
          }
        } else {
          setStatus("در مرورگر باز شد — پخش را آنجا شروع کنید");
        }
      }catch(e){
        setStatus("باز کردن مرورگر ممکن نشد", true);
      }
    }
    const btnBg=document.getElementById("btnBgPlay");
    if(btnBg) btnBg.addEventListener("click", openSystemBrowserPlayer);

    // اگر با ?bg=1&autostart=1 از مرورگر سیستم آمده
    (function bootBgMode(){
      try{
        const q=new URLSearchParams(location.search||"");
        if(q.get("bg")!=="1") return;
        // UI ساده‌تر برای حالت مرورگر
        try{
          const ver=document.getElementById("playerVer");
          if(ver) ver.textContent="پلیر پایدار v5 · مرورگر سیستم";
        }catch(e){}
        const stId=q.get("station")||"";
        const src=q.get("src")||"";
        const title=q.get("title")||"";
        if(stId && typeof openStation==="function"){
          // کمی صبر تا STATIONS لود شده باشد
          setTimeout(function(){
            try{ openStation(stId); }catch(e){}
            if(q.get("autostart")==="1"){
              setTimeout(function(){
                running=true; userPaused=false;
                if(src){
                  // پخش مستقیم همان src
                  const fake={title:title||"رادیو", url:src, urls:[src]};
                  // اگر در پلی‌لیست بود index را پیدا کن
                  let found=-1;
                  for(let i=0;i<playlist.length;i++){
                    if(playlist[i].url===src || (playlist[i].urls||[]).indexOf(src)>=0) found=i;
                  }
                  if(found>=0) goTo(found);
                  else {
                    playlist=playlist.length?playlist:[fake];
                    if(!playlist.some(t=>t.url===src)) playlist.unshift(fake);
                    goTo(0);
                  }
                } else if(playlist.length){
                  goTo(0);
                }
              }, 500);
            }
          }, 300);
        } else if(src){
          setTimeout(function(){
            running=true; userPaused=false;
            playlist=[{title:title||"رادیو زنده", url:src, urls:[src]}];
            currentStation={id:"national", title:"رادیو", emoji:"🇮🇷"};
            show("screenRadioPlayer");
            goTo(0);
          }, 400);
        }
      }catch(e){}
    })();


    // ---- TV ----
    const tvVideo=document.getElementById("tvVideo");
    const tvOverlay=document.getElementById("tvOverlay");
    const tvTitle=document.getElementById("tvTitle");
    const tvStatus=document.getElementById("tvStatus");
    const tvChannelsEl=document.getElementById("tvChannels");
    let hls=null, tvIndex=-1;

    function tvMsg(msg,err){tvStatus.textContent=msg||"";tvStatus.className="status"+(err?" error":"")}
    function destroyHls(){if(hls){try{hls.destroy()}catch(e){} hls=null}}

    function stopTv(){
      destroyHls();
      try{tvVideo.pause()}catch(e){}
      tvVideo.removeAttribute("src");
      try{tvVideo.load()}catch(e){}
      tvOverlay.classList.remove("hide");
      tvOverlay.textContent="پخش متوقف شد — کانال را انتخاب کنید";
    }

    function playTv(i){
      if(!TV_CHANNELS.length)return;
      tvIndex=((i%TV_CHANNELS.length)+TV_CHANNELS.length)%TV_CHANNELS.length;
      const ch=TV_CHANNELS[tvIndex];
      tvTitle.textContent="▶ "+(ch.title||"کانال");
      tvOverlay.classList.remove("hide");
      tvOverlay.textContent="در حال اتصال...";
      tvMsg("");
      renderTvChannels();
      destroyHls();
      try{tvVideo.pause()}catch(e){}
      try{tvVideo.removeAttribute("src"); tvVideo.load()}catch(e){}

      let url=(ch.url||"").trim();
      if(location.protocol==="https:" && url.indexOf("http://")===0){
        tvMsg("این کانال با HTTP است و روی مینی‌اپ HTTPS بلاک می‌شود.", true);
        tvOverlay.textContent="لینک ناامن (HTTP)";
        return;
      }

      try{
        tvVideo.setAttribute("referrerpolicy","no-referrer");
        tvVideo.referrerPolicy="no-referrer";
        tvVideo.removeAttribute("crossorigin");
      }catch(e){}

      const isHls=/\.m3u8(\?|$)/i.test(url) || url.toLowerCase().indexOf("m3u8")!==-1;

      function onPlaying(){ tvOverlay.classList.add("hide"); tvMsg(""); }
      function onNeedTap(){ tvOverlay.classList.add("hide"); tvMsg("برای شروع پخش، یک‌بار روی تصویر ضربه بزنید.", true); }
      function fail(msg){
        tvMsg(msg||"پخش این کانال ممکن نشد.", true);
        tvOverlay.textContent="خطای استریم";
        tvOverlay.classList.remove("hide");
      }

      if(isHls && window.Hls && Hls.isSupported()){
        hls=new Hls({
          enableWorker:true,
          lowLatencyMode:false,
          maxBufferLength:40,
          xhrSetup:function(xhr){ try{ xhr.withCredentials=false; }catch(e){} }
        });
        hls.loadSource(url);
        hls.attachMedia(tvVideo);
        hls.on(Hls.Events.MANIFEST_PARSED, function(){
          var p=tvVideo.play();
          if(p&&p.then){ p.then(onPlaying).catch(onNeedTap); } else onPlaying();
        });
        hls.on(Hls.Events.ERROR, function(_, data){
          if(!data||!data.fatal) return;
          try{ destroyHls(); }catch(e){}
          tvVideo.src=url;
          tvVideo.play().then(onPlaying).catch(function(){
            var detail="خطا در استریم";
            if(data.details) detail+=" ("+data.details+")";
            fail(detail);
          });
        });
        return;
      }

      if(isHls && tvVideo.canPlayType && (tvVideo.canPlayType("application/vnd.apple.mpegurl")||tvVideo.canPlayType("application/x-mpegURL"))){
        tvVideo.src=url;
        var p=tvVideo.play();
        if(p&&p.then){ p.then(onPlaying).catch(onNeedTap); } else onPlaying();
        return;
      }

      tvVideo.src=url;
      var p2=tvVideo.play();
      if(p2&&p2.then){ p2.then(onPlaying).catch(onNeedTap); } else onPlaying();
      tvVideo.onerror=function(){ fail("خطا در بارگذاری ویدئو"); };
    }

    renderTvChannels();

    // ورود مستقیم از ربات: ?mode=tv یا ?mode=radio
    (function bootFromQuery(){
      try {
        const q = new URLSearchParams(location.search || "");
        let mode = (q.get("mode") || q.get("section") || "").toLowerCase();
        if (!mode && location.hash) {
          mode = location.hash.replace("#", "").toLowerCase();
        }
        if (mode === "tv" || mode === "television" || mode === "live") {
          try { audio.pause(); } catch (e) {}
          running = false;
          renderTvChannels();
          show("screenTv");
        } else if (mode === "radio") {
          stopTv();
          renderStations();
          show("screenRadioStations");
        }
      } catch (e) {}
    })();

    try{ if(window.Bale&&Bale.WebApp){ Bale.WebApp.ready&&Bale.WebApp.ready(); Bale.WebApp.expand&&Bale.WebApp.expand(); } }catch(e){}
  </script>
</body>
</html>
