<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>رادیو ربات</title>
  <script src="https://tapi.bale.ai/miniapp.js"></script>
  <style>
    :root {
      --bg: #0f1220;
      --card: #1a1f35;
      --accent: #6c5ce7;
      --accent2: #00cec9;
      --text: #f5f6fa;
      --muted: #a4b0be;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(160deg, #0f1220 0%, #1b1a3a 50%, #0f1220 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 8px;
    }
    header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
    .player {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      margin-bottom: 16px;
    }
    .cover {
      width: 100%;
      aspect-ratio: 1;
      max-width: 220px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      box-shadow: 0 8px 24px rgba(108,92,231,.35);
    }
    .now-playing {
      text-align: center;
      margin-bottom: 14px;
      min-height: 52px;
    }
    .now-playing .title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .now-playing .meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .progress-wrap { margin: 12px 0 6px; }
    .progress {
      height: 6px;
      background: rgba(255,255,255,.12);
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width .15s linear;
    }
    .times {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 14px;
    }
    .btn {
      border: none;
      background: rgba(255,255,255,.08);
      color: var(--text);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s, background .15s;
    }
    .btn:active { transform: scale(.92); }
    .btn.play {
      width: 64px;
      height: 64px;
      font-size: 1.6rem;
      background: linear-gradient(135deg, var(--accent), #a29bfe);
      box-shadow: 0 6px 20px rgba(108,92,231,.4);
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .list {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
    }
    .list h2 {
      font-size: 0.95rem;
      padding: 14px 16px 8px;
      color: var(--muted);
      font-weight: 600;
    }
    .track {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,.06);
      cursor: pointer;
      transition: background .15s;
    }
    .track:active { background: rgba(255,255,255,.05); }
    .track.active {
      background: rgba(108,92,231,.18);
    }
    .track .num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .track.active .num {
      background: var(--accent);
      color: #fff;
    }
    .track .info { flex: 1; min-width: 0; }
    .track .info .t {
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .status {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 12px;
      min-height: 1.2em;
    }
    .status.error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📻 رادیو</h1>
      <p>پخش پشت‌سرهم آهنگ‌ها</p>
    </header>

    <div class="player">
      <div class="cover" id="cover">🎵</div>
      <div class="now-playing">
        <div class="title" id="title">آماده پخش</div>
        <div class="meta" id="meta">—</div>
      </div>
      <div class="progress-wrap">
        <div class="progress" id="progress"><i id="bar"></i></div>
        <div class="times">
          <span id="cur">۰:۰۰</span>
          <span id="dur">۰:۰۰</span>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="btnPrev" title="قبلی">⏮</button>
        <button class="btn play" id="btnPlay" title="پخش / توقف">▶</button>
        <button class="btn" id="btnNext" title="بعدی">⏭</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="list">
      <h2>لیست پخش</h2>
      <div id="tracks"></div>
    </div>
  </div>

  <audio id="audio" preload="metadata" playsinline></audio>

  <script>
    // ============================================================
    // پلی‌لیست — این آرایه توسط ربات هنگام تولید فایل پر می‌شود.
    // ============================================================
    const PLAYLIST = [{"id": "b8c57a4cdd", "title": "بدون عنوان", "url": "https://irsv.upmusics.com/singletracks/2026/10/Ghasem%20Taghizadeh%20-%20Maftoon%20UpMusics.mp3"}, {"id": "7da333053e", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/serv11/Jahan%20-%20Farda%20Baz%20Dobare%20Paeeiz%20Mishe%20[SevilMusic].mp3"}, {"id": "d4189ba80f", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/serv11/Touraj%20Shabankhani%20-%20Hanozam%20Cheshmay%20To%20[SevilMusic].mp3"}, {"id": "a00a8dc53b", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvru/Ahange%20Mahshari%20Hanoz%20[SevilMusic].mp3"}, {"id": "fbed423f81", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvry/Ahange%20Behesh%20Begin%20Sabzezare%20[SevilMusic].mp3"}, {"id": "2927378f1f", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvrx/Ahange%20Mikhastam%20To%20Begi%20[SevilMusic].mp3"}, {"id": "cee3451017", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvrf/Ahange%20Naleh%20Saz%20Miad%20[SevilMusic].mp3"}, {"id": "bb2660dbb8", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvrf/Ahange%20Ghado%20Balaye%20To%20Rana%20[SevilMusic].mp3"}, {"id": "bad9319c5e", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/svx/Ahange%20Zange%20Tafrih%20[SevilMusic].mp3"}, {"id": "5b5f477d66", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvrv/Ey%20Sabze%20Negar%20Bia%20Be%20Balinam%20[SevilMusic].mp3"}, {"id": "9346aa17a1", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvre/Ahange%20Zane%20Ziba%20[SevilMusic].mp3"}, {"id": "e9e0ffb231", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvrt/Ahange%20Ahoo%20Khanom%20[SevilMusic].mp3"}, {"id": "9a54ba5798", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvrw/Ahange%20Harfet%20Harfe%20Man%20[SevilMusic].mp3"}, {"id": "04846b71c0", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvrw/Ahange%20Geleh%20Hey%20[SevilMusic].mp3"}, {"id": "57e124399f", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvru/Ahange%20Parande%20Ghashangam%20[SevilMusic].mp3"}, {"id": "17de7ac72c", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvru/Mehrdad%20Asemani%20-%20Maryam%20Gole%20Naze%20Mane%20[SevilMusic].mp3"}, {"id": "a53d173534", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvru/Ahange%20Bordi%20Az%20Yadam%20[SevilMusic].mp3"}, {"id": "133ce6848c", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvru/Saman%20-%20Esmesh%20Bahar%20Bod%20[SevilMusic].mp3"}, {"id": "5a4f54a2cb", "title": "بدون عنوان", "url": "https://dl.sevilmusics.com/cdn/music/srvrs/Hooshmand%20Aghili%20-%20Darya%20[SevilMusic].mp3"}];

    const titleEl = document.getElementById("title");
    const metaEl = document.getElementById("meta");
    const statusEl = document.getElementById("status");
    const barEl = document.getElementById("bar");
    const curEl = document.getElementById("cur");
    const durEl = document.getElementById("dur");
    const tracksEl = document.getElementById("tracks");
    const btnPlay = document.getElementById("btnPlay");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const progressEl = document.getElementById("progress");
    const audio = document.getElementById("audio");

    let index = 0;
    let wantPlay = false;
    let advancing = false;
    let playToken = 0; // برای باطل کردن playهای قدیمی
    let lastCur = 0;
    let stuck = 0;
    let startedAt = 0;

    function toFaDigits(str) {
      return String(str).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
    }
    function fmt(sec) {
      if (!isFinite(sec) || sec < 0) return "۰:۰۰";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return toFaDigits(m + ":" + String(s).padStart(2, "0"));
    }
    function setStatus(msg, isError) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (isError ? " error" : "");
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderList() {
      if (!PLAYLIST.length) {
        tracksEl.innerHTML = '<div class="empty">هنوز آهنگی اضافه نشده است.</div>';
        return;
      }
      tracksEl.innerHTML = PLAYLIST.map((t, i) => `
        <div class="track ${i === index ? "active" : ""}" data-i="${i}">
          <div class="num">${toFaDigits(i + 1)}</div>
          <div class="info"><div class="t">${escapeHtml(t.title || ("آهنگ " + (i + 1)))}</div></div>
        </div>
      `).join("");
      tracksEl.querySelectorAll(".track").forEach(el => {
        el.addEventListener("click", () => {
          wantPlay = true;
          loadTrack(parseInt(el.dataset.i, 10), true);
        });
      });
    }

    // تلاش چندباره برای play — بدون setTimeout طولانی تا gesture از دست نرود
    function forcePlay(token) {
      if (token !== playToken) return Promise.resolve(false);
      const p = audio.play();
      if (!p || typeof p.then !== "function") {
        wantPlay = true;
        btnPlay.textContent = "⏸";
        setStatus("");
        return Promise.resolve(true);
      }
      return p.then(() => {
        if (token !== playToken) return false;
        wantPlay = true;
        btnPlay.textContent = "⏸";
        setStatus("");
        startedAt = Date.now();
        stuck = 0;
        return true;
      }).catch((err) => {
        if (token !== playToken) return false;
        console.warn("play()", err);
        // بلافاصله دوباره روی canplay تلاش می‌شود
        return false;
      });
    }

    function loadTrack(i, autoplay) {
      if (!PLAYLIST.length) return;
      advancing = false;
      stuck = 0;
      lastCur = 0;
      index = ((i % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
      const track = PLAYLIST[index];
      titleEl.textContent = track.title || ("آهنگ " + (index + 1));
      metaEl.textContent = toFaDigits((index + 1) + " از " + PLAYLIST.length);
      renderList();

      playToken += 1;
      const token = playToken;

      // مهم: pause نکن و src را خالی نکن — فقط عوض کن تا session پخش حفظ شود
      audio.src = track.url;
      try { audio.load(); } catch (e) {}

      if (autoplay || wantPlay) {
        setStatus("در حال پخش...");
        // تلاش فوری (هم‌زمان با event در صورت امکان)
        forcePlay(token);
        // و وقتی آماده شد دوباره
        const onReady = () => {
          if (token !== playToken) return;
          if (audio.paused && wantPlay) forcePlay(token);
        };
        audio.addEventListener("loadeddata", onReady, { once: true });
        audio.addEventListener("canplay", onReady, { once: true });
        audio.addEventListener("canplaythrough", onReady, { once: true });
      } else {
        btnPlay.textContent = "▶";
        setStatus("");
      }
    }

    function playNext() {
      if (advancing || !PLAYLIST.length) return;
      advancing = true;
      wantPlay = true; // حتماً حالت پخش بماند
      setStatus("آهنگ بعدی...");
      const next = index + 1;
      // بدون تأخیر — تأخیر باعث از دست رفتن اجازه پخش در وب‌ویو می‌شود
      loadTrack(next, true);
      advancing = false;
    }

    function togglePlay() {
      if (!PLAYLIST.length) {
        setStatus("لیست پخش خالی است.", true);
        return;
      }
      if (!audio.src) {
        wantPlay = true;
        loadTrack(index, true);
        return;
      }
      if (audio.paused) {
        wantPlay = true;
        forcePlay(playToken);
      } else {
        audio.pause();
        wantPlay = false;
        btnPlay.textContent = "▶";
      }
    }

    audio.addEventListener("ended", () => {
      if (!wantPlay) return;
      playNext();
    });

    audio.addEventListener("error", () => {
      setStatus("خطا در آهنگ؛ بعدی...", true);
      if (wantPlay) {
        // خطای شبکه — یک تأخیر کوتاه لازم است
        const t = playToken;
        setTimeout(() => {
          if (wantPlay && playToken === t) playNext();
        }, 400);
      }
    });

    audio.addEventListener("timeupdate", () => {
      const dur = audio.duration;
      const cur = audio.currentTime;
      barEl.style.width = (dur && isFinite(dur) ? (cur / dur) * 100 : 0) + "%";
      curEl.textContent = fmt(cur);
      durEl.textContent = fmt(dur);
      lastCur = cur;
    });

    audio.addEventListener("playing", () => {
      btnPlay.textContent = "⏸";
      setStatus("");
      stuck = 0;
    });

    // نگهبان انتها / گیر کردن
    setInterval(() => {
      if (!wantPlay || !PLAYLIST.length) return;
      if (audio.ended) {
        playNext();
        return;
      }
      const dur = audio.duration;
      const cur = audio.currentTime;
      if (isFinite(dur) && dur > 1 && cur >= dur - 0.35) {
        playNext();
        return;
      }
      // اگر paused شده ولی هنوز wantPlay و نزدیک انتها
      if (audio.paused && isFinite(dur) && dur > 1 && cur > 1 && cur >= dur - 1.2) {
        playNext();
        return;
      }
      // اگر پخش باید باشد ولی pause است و از شروع > 2s گذشته → دوباره play
      if (audio.paused && wantPlay && !advancing && Date.now() - startedAt > 2000 && cur < 0.5) {
        forcePlay(playToken);
      }
      if (!audio.paused) {
        if (Math.abs(cur - lastCur) < 0.01) stuck++;
        else stuck = 0;
        if (stuck > 20 && Date.now() - startedAt > 6000) {
          setStatus("گیر کرد؛ بعدی...", true);
          playNext();
        }
      }
    }, 400);

    btnPlay.addEventListener("click", togglePlay);
    btnPrev.addEventListener("click", () => { wantPlay = true; loadTrack(index - 1, true); });
    btnNext.addEventListener("click", () => { wantPlay = true; playNext(); });

    progressEl.addEventListener("click", (e) => {
      if (!audio.duration || !isFinite(audio.duration)) return;
      const rect = progressEl.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
    });

    renderList();
    if (PLAYLIST.length) loadTrack(0, false);

    try {
      if (window.Bale && Bale.WebApp) {
        Bale.WebApp.ready && Bale.WebApp.ready();
        if (Bale.WebApp.expand) Bale.WebApp.expand();
      }
    } catch (e) {}
  </script>
</body>
</html>
