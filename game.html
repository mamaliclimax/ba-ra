<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#191B1D">
<title>Roblox Style 3D · دنیای همدلی</title>
<style>
:root {
  --rbx-bg: #191B1D;
  --rbx-panel: rgba(25, 27, 29, 0.85);
  --rbx-red: #E2231A;
  --rbx-text: #FFFFFF;
  --rbx-border: rgba(255, 255, 255, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--rbx-bg); color: var(--rbx-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#world { position: fixed; inset: 0; }
#world canvas { display: block; width: 100%; height: 100%; outline: none; }

/* صفحه ورود شبیه روبلاکس */
#roblox-loading {
  position: fixed; inset: 0; background: #191B1D; z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; transition: opacity 0.5s ease;
}
.rbx-logo {
  width: 72px; height: 72px; background: #E2231A; border-radius: 14px;
  transform: rotate(-15deg); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 25px rgba(226, 35, 26, 0.4);
}
.rbx-logo-inner {
  width: 24px; height: 24px; background: #191B1D; border-radius: 4px;
}
.rbx-loader-bar {
  width: 220px; height: 8px; background: rgba(255, 255, 255, 0.1);
  border-radius: 10px; overflow: hidden; margin-top: 15px;
}
.rbx-loader-progress {
  width: 0%; height: 100%; background: #E2231A; transition: width 0.2s;
}

/* نوار بالای صفحه روبلاکس */
.topbar {
  position: fixed; top: 10px; left: 10px; right: 10px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none; z-index: 50;
}
.rbx-menu-btn {
  pointer-events: auto; width: 44px; height: 44px;
  background: var(--rbx-panel); border: 1px solid var(--rbx-border);
  border-radius: 12px; display: flex; flex-direction: column;
  justify-content: center; align-items: center; gap: 4px; cursor: pointer;
}
.rbx-menu-btn span { width: 20px; height: 2px; background: white; border-radius: 2px; }
.stats-badge {
  background: var(--rbx-panel); border: 1px solid var(--rbx-border);
  padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px;
  display: flex; gap: 8px; align-items: center; pointer-events: auto;
}

/* لیدربورد بالا سمت راست شبیه سرورهای روبلاکس */
.leaderboard {
  position: fixed; top: 62px; right: 10px;
  background: var(--rbx-panel); border: 1px solid var(--rbx-border);
  border-radius: 10px; padding: 8px; font-size: 11px; z-index: 40;
  min-width: 130px; pointer-events: none;
}
.leaderboard div { margin: 3px 0; display: flex; justify-content: space-between; gap: 10px; }

/* چت باکس روبلاکس */
.chat-box {
  position: fixed; top: 62px; left: 10px; width: 220px;
  background: rgba(25, 27, 29, 0.7); border-radius: 8px;
  padding: 8px; font-size: 11px; z-index: 40; pointer-events: none;
  max-height: 120px; overflow-y: hidden;
}
.chat-line { margin-bottom: 4px; text-shadow: 1px 1px 2px #000; }
.chat-line b { color: #55b2ff; }

/* کنترل‌های لمسی روبلاکس - پایین صفحه */
.controls-bottom {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 160px; pointer-events: none; z-index: 60;
}
/* جوی‌استیک دینامیک */
.joystick-zone {
  position: absolute; left: 24px; bottom: 30px;
  width: 110px; height: 110px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: 2px solid rgba(255, 255, 255, 0.35);
  pointer-events: auto; touch-action: none;
}
.joystick-thumb {
  position: absolute; width: 48px; height: 48px;
  left: 31px; top: 31px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffffff, #cfcfcf);
  box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none;
}
/* دکمه پرش روبلاکس (گرد با علامت فلش) */
.jump-btn {
  position: absolute; right: 28px; bottom: 38px;
  width: 72px; height: 72px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.18);
  border: 2px solid rgba(255, 255, 255, 0.45);
  pointer-events: auto; cursor: pointer; display: flex;
  align-items: center; justify-content: center; outline: none;
}
.jump-btn svg { width: 32px; height: 32px; fill: white; }
.jump-btn:active { background: rgba(255, 255, 255, 0.4); }

/* نوار ابزار پایین روبلاکس (Backpack Hotbar) */
.rbx-hotbar {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; z-index: 60; pointer-events: auto;
}
.rbx-slot {
  width: 50px; height: 50px; background: var(--rbx-panel);
  border: 1px solid var(--rbx-border); border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; position: relative;
}
.rbx-slot.active { border: 2px solid #55b2ff; background: rgba(85, 178, 255, 0.2); }
.rbx-slot span { position: absolute; top: 2px; right: 4px; font-size: 9px; opacity: 0.7; }
</style>
</head>
<body>

<div id="roblox-loading">
  <div class="rbx-logo"><div class="rbx-logo-inner"></div></div>
  <h2 style="font-size: 18px; font-weight: 700; letter-spacing: 0.5px;">در حال اتصال به سرور…</h2>
  <div class="rbx-loader-bar"><div class="rbx-loader-progress" id="load-progress"></div></div>
  <p id="load-status" style="font-size: 12px; color: #888;">بارگذاری دارایی‌های R6 و Baseplate…</p>
</div>

<div id="world"></div>

<div class="topbar">
  <div class="rbx-menu-btn" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
  <div class="stats-badge">
    <span>🪙 <span id="coins">250</span></span>
    <span>👥 آنلاین: <span id="online-count">4</span></span>
  </div>
</div>

<div class="leaderboard">
  <div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px; font-weight: bold;">بازیکنان</div>
  <div><span>🧑 شما</span><b id="my-score">10</b></div>
  <div><span>👧 سارا (Girl R6)</span><b>8</b></div>
  <div><span>👦 آرین (Boy R6)</span><b>5</b></div>
  <div><span>👧 نیلوفر</span><b>12</b></div>
</div>

<div class="chat-box" id="chat-box">
  <div class="chat-line"><b>سیستم:</b> به سرور خوش آمدید!</div>
</div>

<div class="controls-bottom">
  <!-- جوی‌استیک پایین سمت چپ -->
  <div class="joystick-zone" id="joystick-zone">
    <div class="joystick-thumb" id="joystick-thumb"></div>
  </div>
  <!-- دکمه پرش استاندارد روبلاکس پایین سمت راست -->
  <button class="jump-btn" id="jump-btn">
    <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
  </button>
</div>

<div class="rbx-hotbar">
  <div class="rbx-slot active" data-type="brick"><span>1</span>🧱</div>
  <div class="rbx-slot" data-type="wood"><span>2</span>🪵</div>
  <div class="rbx-slot" data-type="glass"><span>3</span>💠</div>
  <div class="rbx-slot" data-type="spawn"><span>4</span>⛳</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);

let scene, camera, renderer, clock;
let avatarRoot, playerModel;
let bots = [];
let keys = {};
let moveX = 0, moveZ = 0;
let camYaw = 0, pitch = 0.25;
let velX = 0, velZ = 0, jumpV = 0, onGround = true;
let walkTime = 0;
let selectedBlock = 'brick';
let placedBlocks = [];

/* بافت صورت روبلاکس با Canvas */
function createRobloxFace(isGirl) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FED59D'; // رنگ پوست صورت
  ctx.fillRect(0,0,128,128);

  // چشم‌های بیضی روبلاکس
  ctx.fillStyle = '#111';
  if(isGirl) {
    // مژه‌ها و چشم دخترانه روبلاکس
    ctx.beginPath(); ctx.ellipse(40, 52, 9, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(88, 52, 9, 13, 0, 0, Math.PI*2); ctx.fill();
    // مژه
    ctx.lineWidth = 3; ctx.strokeStyle = '#111';
    ctx.beginPath(); ctx.moveTo(32, 42); ctx.lineTo(24, 34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(96, 42); ctx.lineTo(104, 34); ctx.stroke();
    // لبخند لطیف
    ctx.beginPath(); ctx.arc(64, 76, 16, 0.2, Math.PI - 0.2); ctx.stroke();
  } else {
    // چشم و لبخند کلاسیک روبلاکس
    ctx.beginPath(); ctx.arc(42, 54, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(86, 54, 8, 0, Math.PI*2); ctx.fill();
    // لبخند معروف روبلاکس
    ctx.lineWidth = 4; ctx.strokeStyle = '#111';
    ctx.beginPath(); ctx.arc(64, 74, 22, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}

/* ساخت آواتار R6 استاندارد روبلاکس */
function buildRobloxR6(colorConfig, isGirl) {
  const root = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xFED59D, roughness: 0.6 });
  const torsoMat = new THREE.MeshStandardMaterial({ color: colorConfig.torso, roughness: 0.5 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: colorConfig.pants, roughness: 0.5 });
  
  // صورت روبلاکس
  const faceTexture = createRobloxFace(isGirl);
  const headMaterials = [
    skinMat, skinMat, skinMat, skinMat,
    new THREE.MeshStandardMaterial({ map: faceTexture, roughness: 0.6 }), // جلو
    skinMat
  ];

  // Head (سر مکعبی روبلاکس با لبه‌های نرم)
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.0), headMaterials);
  head.position.y = 2.0; head.castShadow = true; root.add(head);

  // موی دختر یا پسر
  if(isGirl) {
    const hairMat = new THREE.MeshStandardMaterial({ color: colorConfig.hair, roughness: 0.7 });
    const hair = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.5, 1.15), hairMat);
    hair.position.set(0, 2.35, 0); root.add(hair);
    // دم اسبی یا موی بلند پشت
    const ponytail = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.4), hairMat);
    ponytail.position.set(0, 1.8, -0.6); root.add(ponytail);
  } else {
    // کلاه یا موی کوتاه پسرانه
    const capMat = new THREE.MeshStandardMaterial({ color: colorConfig.hair, roughness: 0.6 });
    const cap = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.35, 1.1), capMat);
    cap.position.set(0, 2.4, 0); root.add(cap);
    const brim = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.1, 0.4), capMat);
    brim.position.set(0, 2.25, 0.65); root.add(brim);
  }

  // Torso (بالاتنه کلاسیک 2x2x1)
  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 0.8), torsoMat);
  torso.position.y = 0.9; torso.castShadow = true; root.add(torso);

  // دست‌ها و پاها
  const armGeo = new THREE.BoxGeometry(0.7, 1.5, 0.7);
  const legGeo = new THREE.BoxGeometry(0.75, 1.5, 0.75);

  const armL = new THREE.Mesh(armGeo, skinMat);
  armL.position.set(-1.25, 0.95, 0); armL.castShadow = true; root.add(armL);

  const armR = new THREE.Mesh(armGeo, skinMat);
  armR.position.set(1.25, 0.95, 0); armR.castShadow = true; root.add(armR);

  const legL = new THREE.Mesh(legGeo, pantsMat);
  legL.position.set(-0.42, -0.5, 0); legL.castShadow = true; root.add(legL);

  const legR = new THREE.Mesh(legGeo, pantsMat);
  legR.position.set(0.42, -0.5, 0); legR.castShadow = true; root.add(legR);

  return { root, armL, armR, legL, legR };
}

/* ساخت مپ Baseplate روبلاکس */
function buildBaseplate() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB); // آسمان کلاسیک روبلاکس
  scene.fog = new THREE.Fog(0x87CEEB, 40, 160);

  camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $('world').appendChild(renderer.domElement);

  // نورپردازی بازی
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
  dirLight.position.set(30, 60, 40);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  scene.add(dirLight);

  // بیس‌پلیت اصلی (Baseplate 200x200 با رنگ سبز خاکستری روبلاکس)
  const groundGeo = new THREE.PlaneGeometry(250, 250);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x4D6542, roughness: 0.9, metalness: 0.1
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1.25;
  ground.receiveShadow = true;
  scene.add(ground);

  // اسپاون پوینت روبلاکس (SpawnLocation)
  const spawnMesh = new THREE.Mesh(
    new THREE.BoxGeometry(6, 0.3, 6),
    new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.4 })
  );
  spawnMesh.position.set(0, -1.1, 0);
  scene.add(spawnMesh);

  // موانع شبیه مپ‌های Obby روبلاکس
  for (let i = 0; i < 7; i++) {
    const obbyBlock = new THREE.Mesh(
      new THREE.BoxGeometry(3, 0.6, 3),
      new THREE.MeshStandardMaterial({ color: 0xE2231A, roughness: 0.3 })
    );
    obbyBlock.position.set(0, -0.9 + i * 0.8, -10 - i * 4);
    scene.add(obbyBlock);
  }

  // کاراکتر پلیر اصلی
  avatarRoot = new THREE.Group();
  playerModel = buildRobloxR6({ torso: 0x00A2FF, pants: 0x1B2A35, hair: 0x332211 }, false);
  avatarRoot.add(playerModel.root);
  scene.add(avatarRoot);

  // ربات‌های آنلاین در سرور (سارا دختر و آرین پسر)
  addBot('سارا', { torso: 0xFF69B4, pants: 0xEFEFEF, hair: 0xFFA500 }, true, 6, -4);
  addBot('آرین', { torso: 0x2ECC71, pants: 0x2C3E50, hair: 0x111111 }, false, -6, -6);
  addBot('نیلوفر', { torso: 0x9B59B6, pants: 0x34495E, hair: 0x4A2E1B }, true, -2, -12);

  clock = new THREE.Clock();
}

function addBot(name, colors, isGirl, x, z) {
  const model = buildRobloxR6(colors, isGirl);
  model.root.position.set(x, 0, z);
  scene.add(model.root);
  bots.push({ name, model, targetX: x, targetZ: z, walkTime: 0, timer: 5 + Math.random()*10 });
}

/* کنترل و حرکت کاراکتر (اصلاح کامل جهت‌ها و جوی‌استیک) */
function updateControls(dt) {
  let mX = moveX;
  let mZ = moveZ;

  if (keys.KeyW || keys.ArrowUp) mZ = -1;
  if (keys.KeyS || keys.ArrowDown) mZ = 1;
  if (keys.KeyA || keys.ArrowLeft) mX = -1;
  if (keys.KeyD || keys.ArrowRight) mX = 1;

  // همگام‌سازی بردارها نسبت به زاویه دوربین
  const sin = Math.sin(camYaw);
  const cos = Math.cos(camYaw);

  const forwardX = sin, forwardZ = -cos;
  const rightX = cos, rightZ = sin;

  // با حرکت استیک رو به بالا (-mZ)، کاراکتر مستقیم به جلو حرکت می‌کند
  const dirX = forwardX * (-mZ) + rightX * mX;
  const dirZ = forwardZ * (-mZ) + rightZ * mX;

  const len = Math.hypot(dirX, dirZ);
  const isMoving = len > 0.05;

  const speed = 7.5;
  if (isMoving) {
    velX = (dirX / len) * speed;
    velZ = (dirZ / len) * speed;
    // چرخش دقیق کاراکتر روبلاکس به سمت مسیر حرکت
    avatarRoot.rotation.y = Math.atan2(velX, -velZ);
  } else {
    velX *= 0.8; velZ *= 0.8;
  }

  avatarRoot.position.x += velX * dt;
  avatarRoot.position.z += velZ * dt;

  // پرش (Jump)
  if (!onGround) {
    jumpV -= 28 * dt; // جاذبه
    avatarRoot.position.y += jumpV * dt;
    if (avatarRoot.position.y <= 0) {
      avatarRoot.position.y = 0;
      jumpV = 0;
      onGround = true;
    }
  }

  // انیمیشن حرکت دست و پا شبیه راه رفتن روبلاکس
  if (playerModel) {
    if (isMoving) {
      walkTime += dt * 10;
      const angle = Math.sin(walkTime) * 0.7;
      playerModel.legL.rotation.x = angle;
      playerModel.legR.rotation.x = -angle;
      playerModel.armL.rotation.x = -angle;
      playerModel.armR.rotation.x = angle;
    } else {
      playerModel.legL.rotation.x *= 0.8;
      playerModel.legR.rotation.x *= 0.8;
      playerModel.armL.rotation.x *= 0.8;
      playerModel.armR.rotation.x *= 0.8;
    }
  }
}

/* هوش مصنوعی ربات‌ها (شبیه‌ساز مولتی‌پلیر آنلاین روبلاکس) */
function updateBots(dt) {
  for (const bot of bots) {
    if (Math.hypot(bot.model.root.position.x - bot.targetX, bot.model.root.position.z - bot.targetZ) < 1) {
      bot.targetX = (Math.random() - 0.5) * 30;
      bot.targetZ = (Math.random() - 0.5) * 30;
    }
    const dx = bot.targetX - bot.model.root.position.x;
    const dz = bot.targetZ - bot.model.root.position.z;
    const dLen = Math.hypot(dx, dz) || 1;
    bot.model.root.position.x += (dx / dLen) * 3 * dt;
    bot.model.root.position.z += (dz / dLen) * 3 * dt;
    bot.model.root.rotation.y = Math.atan2(dx, dz);

    bot.walkTime += dt * 8;
    bot.model.legL.rotation.x = Math.sin(bot.walkTime) * 0.5;
    bot.model.legR.rotation.x = -Math.sin(bot.walkTime) * 0.5;

    // چت خودکار در سرور
    bot.timer -= dt;
    if(bot.timer <= 0) {
      bot.timer = 15 + Math.random() * 20;
      const msgs = ['کسی با من بلوک می‌سازه؟', 'بریم مرحله Obby رو رد کنیم!', 'سلام به سرور!'];
      addChatMessage(bot.name, msgs[Math.floor(Math.random()*msgs.length)]);
    }
  }
}

function addChatMessage(user, msg) {
  const box = $('chat-box');
  const d = document.createElement('div');
  d.className = 'chat-line';
  d.innerHTML = `<b>${user}:</b> ${msg}`;
  box.appendChild(d);
  if(box.children.length > 5) box.removeChild(box.firstChild);
}

/* دوربین سوم شخص روبلاکس */
function updateCamera(dt) {
  const targetPos = avatarRoot.position;
  const dist = 9.0;
  const height = 4.0;

  const cx = targetPos.x + Math.sin(camYaw) * dist;
  const cz = targetPos.z + Math.cos(camYaw) * dist;
  const cy = targetPos.y + height + pitch * 4.0;

  camera.position.set(cx, cy, cz);
  camera.lookAt(targetPos.x, targetPos.y + 1.2, targetPos.z);
}

/* سیستم رویدادها، جوی‌استیک پایین صفحه و لمس */
function setupInput() {
  const joyZone = $('joystick-zone');
  const joyThumb = $('joystick-thumb');
  let joyId = null;

  function handleJoy(e) {
    const rect = joyZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const maxR = rect.width * 0.35;
    const dist = Math.hypot(dx, dy);

    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    joyThumb.style.transform = `translate(${dx}px, ${dy}px)`;
    moveX = dx / maxR;
    moveZ = dy / maxR;
  }

  joyZone.addEventListener('pointerdown', e => {
    joyId = e.pointerId;
    handleJoy(e);
  });

  window.addEventListener('pointermove', e => {
    if (e.pointerId === joyId) handleJoy(e);
  });

  function stopJoy(e) {
    if (e.pointerId === joyId) {
      joyId = null;
      moveX = 0; moveZ = 0;
      joyThumb.style.transform = 'translate(0,0)';
    }
  }
  window.addEventListener('pointerup', stopJoy);
  window.addEventListener('pointercancel', stopJoy);

  // دکمه پرش
  $('jump-btn').addEventListener('pointerdown', () => {
    if (onGround) { jumpV = 10.5; onGround = false; }
  });

  // کنترل چرخش دوربین در محیط لمسی (سمت راست صفحه)
  let camDrag = null;
  window.addEventListener('pointerdown', e => {
    if (e.clientX > window.innerWidth / 3 && e.clientY < window.innerHeight - 100) {
      camDrag = { x: e.clientX, y: e.clientY, id: e.pointerId };
    }
  });

  window.addEventListener('pointermove', e => {
    if (camDrag && e.pointerId === camDrag.id) {
      const dx = e.clientX - camDrag.x;
      const dy = e.clientY - camDrag.y;
      camYaw -= dx * 0.006;
      pitch = Math.max(-0.2, Math.min(0.65, pitch + dy * 0.003));
      camDrag.x = e.clientX; camDrag.y = e.clientY;
    }
  });

  window.addEventListener('pointerup', e => {
    if (camDrag && e.pointerId === camDrag.id) camDrag = null;
  });

  // کلیدهای کیبورد کامپیوتر
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' && onGround) { jumpV = 10.5; onGround = false; }
  });
  window.addEventListener('keyup', e => keys[e.code] = false);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updateControls(dt);
  updateBots(dt);
  updateCamera(dt);

  renderer.render(scene, camera);
}

function start() {
  let progress = 0;
  const bar = $('load-progress');
  const timer = setInterval(() => {
    progress += 25;
    bar.style.width = progress + '%';
    if (progress >= 100) {
      clearInterval(timer);
      setTimeout(() => {
        $('roblox-loading').style.opacity = '0';
        setTimeout(() => $('roblox-loading').style.display = 'none', 500);
      }, 400);
    }
  }, 180);

  buildBaseplate();
  setupInput();
  animate();
}

window.onload = start;
})();
</script>
</body>
