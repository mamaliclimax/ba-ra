<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>تماس زنده با منشی</title>
<script src="https://tapi.bale.ai/miniapp.js"></script>
<style>
:root{--bg:#0b1220;--card:#151d2e;--text:#f2f5ff;--muted:#9aa6c2;--accent:#3ee0a3;--danger:#ff4d6d;--line:rgba(255,255,255,.1);--ctrl-h:140px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100%}
.top{padding:10px 12px 4px;text-align:center;flex-shrink:0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:11px;margin-bottom:4px}
h1{font-size:1.05rem}
#status{color:var(--muted);font-size:.8rem;min-height:1.1em;margin-top:2px}
#status.live{color:var(--accent)}#status.err{color:var(--danger)}
#chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px;padding-bottom:calc(var(--ctrl-h) + 24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;min-height:0}
.b{max-width:90%;padding:8px 11px;border-radius:14px;line-height:1.7;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.user{align-self:flex-end;background:#2a6bff}
.meta{font-size:.65rem;opacity:.65;margin-bottom:2px}
.ctrl{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,18,32,.97);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:center}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);border-radius:999px;height:34px;min-width:34px;padding:0 10px;font-size:13px;cursor:pointer}
.btn.main{background:var(--accent);color:#042214;font-weight:800;border:none;height:44px;padding:0 20px;font-size:15px}
.btn.hang{background:var(--danger);border:none;color:#fff;width:40px;height:40px}
.btn.mic.on{outline:2px solid rgba(62,224,163,.45)}
.row2{display:flex;width:100%;max-width:420px;gap:6px}
.row2 input{flex:1;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:9px 10px;font-size:.88rem;outline:none}
.row2 button{border:none;border-radius:12px;background:var(--accent);color:#042214;font-weight:700;padding:0 12px;font-size:13px}
.hint{font-size:11px;color:var(--muted);text-align:center;max-width:420px}
#gate{position:fixed;inset:0;background:rgba(5,10,20,.96);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#gate.hid{display:none}
#gate p{color:var(--muted);max-width:300px;line-height:1.7;font-size:.88rem}
</style>
</head>
<body>
<div id="gate">
  <div class="badge">تماس زنده</div>
  <h2>منشی روابط عمومی</h2>
  <p>برای شروع گفتگو دکمه را بزنید. می‌توانید تایپ کنید یا از میکروفون استفاده کنید.</p>
  <button class="btn main" id="go">📞 شروع تماس</button>
</div>
<div class="top">
  <div class="badge">● تماس زنده</div>
  <h1>منشی روابط عمومی</h1>
  <div id="status">منتظر شروع…</div>
</div>
<div id="chat"></div>
<div class="ctrl" id="ctrl">
  <div class="row">
    <button class="btn" id="spk">🔊</button>
    <button class="btn hang" id="hang">☎</button>
    <button class="btn mic" id="mic">🎤</button>
    <button class="btn" id="rep">▶️</button>
  </div>
  <div class="row2">
    <input id="txt" placeholder="پیام خود را بنویسید…" autocomplete="off" />
    <button id="send">ارسال</button>
  </div>
  <div class="hint" id="hint">تایپ همیشه کار می‌کند</div>
</div>
<script>
(function(){
  /**
   * جریان گفتگو:
   * welcome → problem → more_detail → ai_reply → phone → address → done
   */
  let on=false, ended=false, listening=false, speaking=false, mute=false, saving=false;
  let lastBot="", rec=null, stream=null, voice=null;
  let step = "welcome"; // problem | more | phone | address | done
  const data = { problem:"", more:"", phone:"", address:"", ai_reply:"", history:[] };
  const $ = id => document.getElementById(id);

  function measure(){
    const h=($("ctrl")&&$("ctrl").offsetHeight)||140;
    document.documentElement.style.setProperty("--ctrl-h", h+"px");
    const c=$("chat"); if(c) c.scrollTop=c.scrollHeight;
  }
  function st(t,c){ const e=$("status"); e.textContent=t; e.className=c||""; }
  function bubble(role,text){
    const d=document.createElement("div");
    d.className="b "+(role==="bot"?"bot":"user");
    d.innerHTML='<div class="meta">'+(role==="bot"?"منشی":"شما")+"</div>"+String(text||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
    $("chat").appendChild(d); measure();
  }

  function pickVoice(){
    try{
      const vs=speechSynthesis.getVoices()||[];
      const score=v=>{
        let s=0; const n=((v.name||"")+" "+(v.lang||"")).toLowerCase();
        if(/fa/.test(v.lang||"")) s+=50;
        if(/female|woman|girl|zira|susan|samantha|karen|moira|helena|dilara|sara/.test(n)) s+=45;
        if(/male|man|david|mark|farid|ravi|daniel/.test(n)) s-=40;
        return s;
      };
      voice=vs.slice().sort((a,b)=>score(b)-score(a))[0]||null;
    }catch(e){ voice=null; }
  }

  async function unlock(){
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC){ const c=new AC(); if(c.state==="suspended") await c.resume(); } }catch(e){}
    try{ await new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=").play(); }catch(e){}
  }
  async function micPerm(){
    try{
      if(stream) return true;
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return true;
      stream=await navigator.mediaDevices.getUserMedia({audio:true}); return true;
    }catch(e){ st("میکروفون مجاز نیست — تایپ کنید","err"); return false; }
  }

  function speak(text){
    return new Promise(resolve=>{
      lastBot=String(text||"");
      if(mute||!lastBot||!window.speechSynthesis){ resolve(); return; }
      speaking=true; st("منشی صحبت می‌کند…","live");
      try{ speechSynthesis.cancel(); }catch(e){}
      pickVoice();
      const u=new SpeechSynthesisUtterance(lastBot);
      u.lang="fa-IR"; u.rate=0.95; u.pitch=1.25; u.volume=1;
      if(voice) u.voice=voice;
      let done=false;
      const end=()=>{ if(done)return; done=true; speaking=false; if(!ended) st("آماده","live"); resolve(); };
      u.onend=end; u.onerror=end;
      try{ speechSynthesis.speak(u); }catch(e){ end(); }
      setTimeout(end, Math.min(22000, 1600+lastBot.length*85));
    });
  }

  async function say(text){
    data.history.push({role:"bot", text});
    bubble("bot", text);
    await speak(text);
  }

  function toEn(s){
    return String(s||"").replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c))
      .replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c));
  }
  function normPhone(raw){
    let d=toEn(raw).replace(/[^\d+]/g,"");
    if(d.startsWith("0098")) d="+98"+d.slice(4);
    else if(d.startsWith("98")&&d.length>=12) d="+"+d.slice(0,12);
    else if(/^09\d{9}$/.test(d)) d="+98"+d.slice(1);
    else if(/^9\d{9}$/.test(d)) d="+98"+d;
    return d;
  }
  function validPhone(p){ return /^\+98\d{10}$/.test(normPhone(p)); }

  /** پاسخ همدلانه کوتاه بر اساس موضوع (بدون نیاز به سرور) */
  function smartReply(problem, more){
    const t=(problem+" "+(more||"")).toLowerCase();
    let base="ممنون از توضیحات‌تان. موضوع را یادداشت کردم تا همکاران روابط عمومی پیگیری کنند.";
    if(/قطع|برق|خاموش|فلک/.test(t)) base="متأسفم بابت مشکل برق. مورد را ثبت می‌کنم تا در اسرع وقت بررسی شود.";
    else if(/قبض|هزینه|مبلغ|پرداخت|بدهی/.test(t)) base="در مورد مسائل مربوط به قبض و پرداخت، همکاران پیگیری می‌کنند.";
    else if(/انشعاب|کنتور|تأسیسات|سیم/.test(t)) base="موضوع انشعاب/تأسیسات ثبت شد و برای واحد مربوطه ارسال می‌شود.";
    else if(/شکایت|اعتراض|ناراضی/.test(t)) base="از نارضایتی‌تان متأسفیم. شکایت شما با جدیت پیگیری خواهد شد.";
    else if(/تشکر|مرسی|ممنون/.test(t)) base="خواهش می‌کنم. در خدمتم.";
    return base+" اگر توضیح بیشتری ندارید، در مرحله بعد شماره تماس و آدرس را می‌گیرم.";
  }

  function summary(){
    return [
      data.problem ? ("موضوع: "+data.problem) : "",
      data.more ? ("توضیح بیشتر: "+data.more) : "",
      data.phone ? ("تلفن: "+data.phone) : "",
      data.address ? ("آدرس: "+data.address) : ""
    ].filter(Boolean).join(" | ");
  }

  function saveToBot(){
    if(saving) return;
    saving=true;
    const payload={
      type:"pr_voice_ticket",
      id:"prweb-"+Date.now(),
      problem: data.problem,
      more: data.more,
      phone: data.phone,
      address: data.address,
      ai_reply: data.ai_reply,
      summary: summary(),
      conversation_summary: summary(),
      history: data.history.slice(-30),
      first_name: "",
      last_name: ""
    };
    try{
      const k="pr_voice_tickets_v2";
      const a=JSON.parse(localStorage.getItem(k)||"[]");
      a.push({...payload, at:new Date().toISOString()});
      localStorage.setItem(k, JSON.stringify(a.slice(-200)));
    }catch(e){}
    try{
      if(window.Bale && Bale.WebApp && Bale.WebApp.sendData){
        Bale.WebApp.sendData(JSON.stringify(payload));
        return true;
      }
    }catch(e){ console.warn(e); }
    return false;
  }

  async function onUser(text){
    text=(text||"").trim();
    if(!text || !on || ended || speaking) return;
    stopMic();
    data.history.push({role:"user", text});
    bubble("user", text);

    if(step==="problem"){
      data.problem = text;
      step="more";
      await say("اگر توضیح بیشتری دارید بفرمایید؛ در غیر این صورت بنویسید «ندارم».");
      return;
    }
    if(step==="more"){
      if(!/^(ندارم|نه|خیر|تمام|همینه|خیر ممنون)$/i.test(text)) data.more=text;
      data.ai_reply = smartReply(data.problem, data.more);
      step="phone";
      await say(data.ai_reply);
      await say("لطفاً شماره تماس خود را بفرستید (مثال: 0912…).");
      return;
    }
    if(step==="phone"){
      const p=normPhone(text);
      if(!validPhone(p)){
        await say("شماره معتبر به نظر نمی‌رسد. لطفاً مثل 09121234567 بفرستید.");
        return;
      }
      data.phone=p;
      step="address";
      await say("ممنون. حالا آدرس یا محل مورد نظر را بنویسید.");
      return;
    }
    if(step==="address"){
      if(text.length<5){
        await say("لطفاً آدرس را کمی کامل‌تر بنویسید.");
        return;
      }
      data.address=text;
      step="done";
      ended=true;
      await say("ثبت شد. از تماس شما سپاسگزاریم. همکاران روابط عمومی پیگیری می‌کنند.");
      const sent = saveToBot();
      st(sent ? "ثبت و ارسال به ربات شد" : "ثبت محلی شد — از داخل بله باز کنید تا به سرور برود","live");
      $("hint").textContent = sent ? "می‌توانید تماس را ببندید" : "برای ذخیره در اکسل، مینی‌اپ را از داخل بله باز کنید";
      return;
    }
  }

  function initRec(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return null;
    const r=new SR(); r.lang="fa-IR"; r.continuous=false; r.interimResults=false;
    r.onstart=()=>{ listening=true; $("mic").classList.add("on"); st("گوش می‌دهم…","live"); };
    r.onresult=ev=>{
      let t=""; for(let i=ev.resultIndex;i<ev.results.length;i++) if(ev.results[i].isFinal) t+=ev.results[i][0].transcript;
      listening=false; $("mic").classList.remove("on"); t=(t||"").trim();
      if(t) onUser(t); else st("چیزی نشنیدم — تایپ کنید","err");
    };
    r.onerror=()=>{ listening=false; $("mic").classList.remove("on"); st("میکروفون خطا — تایپ کنید","err"); };
    r.onend=()=>{ listening=false; $("mic").classList.remove("on"); };
    return r;
  }
  function stopMic(){ listening=false; $("mic").classList.remove("on"); try{ if(rec) rec.abort(); }catch(e){} }
  async function startMic(){
    if(!on||ended||speaking||listening) return;
    if(!(await micPerm())) return;
    if(!rec) rec=initRec();
    if(!rec){ st("تشخیص گفتار نیست — تایپ کنید","err"); return; }
    try{ rec.start(); }catch(e){ st("میکروفون شروع نشد — تایپ کنید","err"); }
  }

  $("go").onclick=async ()=>{
    await unlock(); await micPerm(); pickVoice();
    $("gate").classList.add("hid"); on=true; measure();
    step="problem";
    await say("سلام، وقت بخیر. من منشی روابط عمومی هستم. بفرمایید مشکل یا درخواست‌تان چیست؟");
    st("آماده — تایپ یا میکروفون","live");
  };
  $("mic").onclick=()=>{ if(listening) stopMic(); else startMic(); };
  $("rep").onclick=()=>{ if(lastBot){ unlock(); speak(lastBot); } };
  $("spk").onclick=()=>{ mute=!mute; $("spk").textContent=mute?"🔇":"🔊"; if(mute) try{ speechSynthesis.cancel(); }catch(e){} };
  $("hang").onclick=()=>{
    if(!ended && data.problem) saveToBot();
    ended=true; stopMic(); try{ speechSynthesis.cancel(); }catch(e){}
    st("قطع شد");
    try{ if(window.Bale&&Bale.WebApp&&Bale.WebApp.close) Bale.WebApp.close(); }catch(e){}
  };
  $("send").onclick=()=>{ const v=$("txt").value; $("txt").value=""; onUser(v); };
  $("txt").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const v=$("txt").value; $("txt").value=""; onUser(v); }});

  window.addEventListener("resize", measure);
  try{ if(window.Bale&&Bale.WebApp){ Bale.WebApp.ready(); try{ Bale.WebApp.expand(); }catch(e){} } }catch(e){}
  try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
  measure();
})();
</script>
</body>
</html>
