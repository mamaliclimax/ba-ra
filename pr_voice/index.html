
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>منشی زنده روابط عمومی</title>
<script src="https://tapi.bale.ai/miniapp.js"></script>

<style>
:root{
 --bg:#0b1220;
 --card:#151d2e;
 --text:#f2f5ff;
 --muted:#9aa6c2;
 --accent:#3ee0a3;
 --danger:#ff4d6d;
 --line:rgba(255,255,255,.1);
 --ctrl-h:140px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
 font-family:Tahoma,sans-serif;
 background:var(--bg);
 color:var(--text);
 display:flex;
 flex-direction:column;
 height:100dvh;
}
button,input{font-family:inherit}
.top{
 padding:10px 12px 5px;
 text-align:center;
 flex-shrink:0;
}
.badge{
 display:inline-block;
 padding:3px 10px;
 border-radius:999px;
 border:1px solid var(--line);
 color:var(--muted);
 font-size:11px;
 margin-bottom:4px;
}
h1{font-size:1.05rem}
#status{
 color:var(--muted);
 font-size:.8rem;
 min-height:1.4em;
 margin-top:4px;
}
#status.live{color:var(--accent)}
#status.err{color:var(--danger)}
#chat{
 flex:1;
 overflow-y:auto;
 -webkit-overflow-scrolling:touch;
 padding:8px 12px;
 padding-bottom:calc(var(--ctrl-h) + 15px);
 display:flex;
 flex-direction:column;
 gap:9px;
 min-height:0;
}
.b{
 max-width:90%;
 padding:9px 12px;
 border-radius:14px;
 line-height:1.8;
 font-size:.9rem;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.bot{
 align-self:flex-start;
 background:var(--card);
 border:1px solid var(--line);
}
.user{
 align-self:flex-end;
 background:#2a6bff;
}
.meta{
 font-size:.65rem;
 opacity:.65;
 margin-bottom:3px;
}
.ctrl{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 padding:9px 10px calc(10px + env(safe-area-inset-bottom,0px));
 background:rgba(11,18,32,.98);
 border-top:1px solid var(--line);
 display:flex;
 flex-direction:column;
 gap:8px;
 align-items:center;
}
.row{
 display:flex;
 gap:10px;
 align-items:center;
 justify-content:center;
}
.btn{
 border:1px solid var(--line);
 background:rgba(255,255,255,.07);
 color:var(--text);
 border-radius:999px;
 height:38px;
 min-width:38px;
 padding:0 12px;
 font-size:14px;
 cursor:pointer;
}
.btn.main{
 background:var(--accent);
 color:#042214;
 font-weight:800;
 border:none;
 height:46px;
 padding:0 22px;
 font-size:15px;
}
.btn.hang{
 background:var(--danger);
 border:none;
 color:white;
 width:43px;
 height:43px;
}
.btn.mic.on{
 background:var(--accent);
 color:#042214;
 outline:3px solid rgba(62,224,163,.2);
}
.btn:disabled{opacity:.4}
.row2{
 display:flex;
 width:100%;
 max-width:440px;
 gap:7px;
}
.row2 input{
 flex:1;
 min-width:0;
 border-radius:12px;
 border:1px solid var(--line);
 background:rgba(255,255,255,.06);
 color:var(--text);
 padding:10px;
 font-size:16px;
 outline:none;
}
.row2 button{
 border:none;
 border-radius:12px;
 background:var(--accent);
 color:#042214;
 font-weight:700;
 padding:0 15px;
 font-size:13px;
}
.hint{
 font-size:11px;
 color:var(--muted);
 text-align:center;
}
#gate{
 position:fixed;
 inset:0;
 background:rgba(5,10,20,.97);
 z-index:50;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:14px;
 padding:24px;
 text-align:center;
}
#gate.hid{display:none}
#gate p{
 color:var(--muted);
 max-width:320px;
 line-height:1.9;
 font-size:.88rem;
}
#micInfo{
 font-size:11px;
 color:var(--muted);
}
</style>
</head>

<body>

<div id="gate">
 <div class="badge">تماس هوشمند · Gemini</div>
 <h2>منشی روابط عمومی</h2>
 <p>
 برای شروع تماس، اجازه استفاده از میکروفن را بدهید.
 منشی پس از پاسخ‌گویی به‌صورت خودکار دوباره گوش می‌دهد.
 </p>
 <button class="btn main" id="go">📞 شروع تماس</button>
 <div id="micInfo">آماده برقراری ارتباط</div>
</div>

<div class="top">
 <div class="badge">● منشی هوشمند روابط عمومی</div>
 <h1>تماس زنده با منشی</h1>
 <div id="status">منتظر شروع تماس…</div>
</div>

<div id="chat"></div>

<div class="ctrl" id="ctrl">

 <div class="row">
  <button class="btn" id="spk" title="قطع صدا">🔊</button>
  <button class="btn hang" id="hang" title="پایان تماس">☎</button>
  <button class="btn mic" id="mic" title="میکروفن">🎤</button>
  <button class="btn" id="rep" title="تکرار پاسخ">▶️</button>
 </div>

 <div class="row2">
  <input id="txt"
   placeholder="پیام خود را بنویسید…"
   autocomplete="off">
  <button id="send">ارسال</button>
 </div>

 <div class="hint" id="hint">
  میکروفن هوشمند · پاسخ سریع Gemini
 </div>
</div>

<script>
(function(){

"use strict";

// ======================================
// CONFIG
// ======================================

const SUPABASE_FUNCTION_URL =
"https://bfzreeyyhmygpnfzczwn.supabase.co/functions/v1/pr-live";

// کلید عمومی anon پروژه Supabase را اینجا قرار بده.
// هرگز service_role key را در HTML قرار نده.
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const VOICE = "Kore";
const MAX_HISTORY = 8;
const CHAT_TIMEOUT = 18000;
const TTS_TIMEOUT = 25000;

// ======================================
// STATE
// ======================================

let on = false;
let ended = false;
let listening = false;
let speaking = false;
let busy = false;
let mute = false;
let autoListen = false;
let micGranted = false;
let intentionalStop = false;

let recognition = null;
let lastBot = "";
let lastAudioUrl = null;
let listenTimer = null;

let chatController = null;
let ttsController = null;

const history = [];

const audioEl = new Audio();
audioEl.preload = "auto";

const $ = id => document.getElementById(id);

// ======================================
// UI
// ======================================

function status(text, cls=""){
 $("status").textContent = text;
 $("status").className = cls;
}

function measure(){
 const h = $("ctrl").offsetHeight || 140;

 document.documentElement.style
  .setProperty("--ctrl-h", h+"px");

 const chat = $("chat");

 requestAnimationFrame(()=>{
  chat.scrollTop = chat.scrollHeight;
 });
}

function bubble(role,text){

 const d = document.createElement("div");

 d.className = "b " +
  (role === "bot" ? "bot" : "user");

 const meta = document.createElement("div");

 meta.className = "meta";

 meta.textContent =
  role === "bot" ? "منشی روابط عمومی" : "شما";

 const content = document.createElement("div");

 // نمایش امن؛ بدون innerHTML
 content.textContent = String(text || "");

 d.appendChild(meta);
 d.appendChild(content);

 $("chat").appendChild(d);

 measure();
}

function addHistory(role,text){

 history.push({
  role,
  text
 });

 while(history.length > MAX_HISTORY){
  history.shift();
 }
}

// ======================================
// AUDIO UNLOCK
// ======================================

async function unlockAudio(){

 try{

  const AC =
   window.AudioContext ||
   window.webkitAudioContext;

  if(AC){

   const ctx = new AC();

   if(ctx.state === "suspended"){
    await ctx.resume();
   }

   const buffer = ctx.createBuffer(1,1,24000);

   const source = ctx.createBufferSource();

   source.buffer = buffer;
   source.connect(ctx.destination);
   source.start(0);

   setTimeout(()=>ctx.close().catch(()=>{}),1000);
  }

 }catch(e){
  console.warn("Audio unlock:",e);
 }

}

// ======================================
// SUPABASE REQUEST
// ======================================

async function callApi(payload,timeout=CHAT_TIMEOUT){

 const controller = new AbortController();

 if(payload.action === "chat"){
  chatController = controller;
 }else if(payload.action === "speak"){
  ttsController = controller;
 }

 const timer = setTimeout(()=>{
  controller.abort();
 },timeout);

 try{

  const headers = {
   "Content-Type":"application/json",
   "apikey":SUPABASE_ANON_KEY
  };

  if(SUPABASE_ANON_KEY &&
     SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY"){

   headers.Authorization =
    "Bearer " + SUPABASE_ANON_KEY;
  }

  const response = await fetch(
   SUPABASE_FUNCTION_URL,
   {
    method:"POST",
    headers,
    body:JSON.stringify(payload),
    signal:controller.signal
   }
  );

  const data = await response.json().catch(()=>({}));

  if(!response.ok){

   throw new Error(
    data.error ||
    data.message ||
    "HTTP " + response.status
   );
  }

  return data;

 }catch(e){

  if(e.name === "AbortError"){
   throw new Error("زمان پاسخ سرور تمام شد.");
  }

  throw e;

 }finally{

  clearTimeout(timer);

  if(chatController === controller){
   chatController = null;
  }

  if(ttsController === controller){
   ttsController = null;
  }

 }

}

// ======================================
// AUDIO PLAYBACK
// ======================================

function stopAudio(){

 try{
  audioEl.pause();
  audioEl.currentTime = 0;
 }catch(e){}
}

function playBase64(base64,mime){

 return new Promise(resolve=>{

  if(!base64 || mute){
   resolve(false);
   return;
  }

  let settled = false;

  function finish(ok){

   if(settled) return;

   settled = true;

   audioEl.onended = null;
   audioEl.onerror = null;

   resolve(ok);
  }

  try{

   const binary = atob(base64);

   const bytes = new Uint8Array(binary.length);

   for(let i=0;i<binary.length;i++){
    bytes[i] = binary.charCodeAt(i);
   }

   const type =
    mime && mime.startsWith("audio/")
     ? mime
     : "audio/wav";

   const blob = new Blob([bytes],{type});

   const newUrl = URL.createObjectURL(blob);

   if(lastAudioUrl){
    URL.revokeObjectURL(lastAudioUrl);
   }

   lastAudioUrl = newUrl;

   audioEl.onended = ()=>finish(true);

   audioEl.onerror = ()=>finish(false);

   audioEl.src = newUrl;

   audioEl.play().then(()=>{
    status("منشی صحبت می‌کند…","live");
   }).catch(e=>{
    console.error("Audio play:",e);
    finish(false);
   });

  }catch(e){

   console.error("Audio decode:",e);
   finish(false);

  }

 });
}

// ======================================
// TEXT FIRST, AUDIO SECOND
// ======================================

async function speakReply(text){

 if(!text || ended) return false;

 lastBot = text;

 if(mute){
  return false;
 }

 speaking = true;

 status("در حال آماده‌سازی صدای منشی…","live");

 try{

  const data = await callApi({
   action:"speak",
   text,
   voice:VOICE
  },TTS_TIMEOUT);

  if(ended) return false;

  if(!data.audio_base64){
   throw new Error("صدای پاسخ دریافت نشد");
  }

  return await playBase64(
   data.audio_base64,
   data.mime || "audio/wav"
  );

 }catch(e){

  console.error("TTS error:",e);

  status("پاسخ متنی آماده است؛ صوت در دسترس نیست","err");

  return false;

 }finally{

  speaking = false;

 }

}

// ======================================
// MICROPHONE PERMISSION
// ======================================

async function requestMicPermission(){

 if(micGranted) return true;

 if(!navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia){

  throw new Error("مرورگر اجازه دسترسی به میکروفن ندارد");
 }

 const stream = await navigator.mediaDevices.getUserMedia({
  audio:{
   echoCancellation:true,
   noiseSuppression:true,
   autoGainControl:true
  }
 });

 // فقط برای دریافت مجوز؛ تشخیص گفتار را
 // خود SpeechRecognition انجام می‌دهد.
 stream.getTracks().forEach(track=>track.stop());

 micGranted = true;

 return true;
}

// ======================================
// SPEECH RECOGNITION
// ======================================

function initRecognition(){

 const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SR) return null;

 const r = new SR();

 r.lang = "fa-IR";

 r.continuous = false;

 r.interimResults = true;

 r.maxAlternatives = 1;

 r.onstart = ()=>{

  listening = true;

  intentionalStop = false;

  $("mic").classList.add("on");

  status("🎤 گوش می‌دهم؛ صحبت کنید…","live");

 };

 r.onresult = event=>{

  let finalText = "";

  let interimText = "";

  for(let i=event.resultIndex;i<event.results.length;i++){

   const result = event.results[i];

   if(result.isFinal){
    finalText += result[0].transcript;
   }else{
    interimText += result[0].transcript;
   }

  }

  if(interimText && !finalText){
   status("شنیدن: " + interimText,"live");
  }

  if(finalText.trim()){

   intentionalStop = true;

   try{
    r.stop();
   }catch(e){}

   handleUser(finalText.trim());

  }

 };

 r.onerror = event=>{

  listening = false;

  $("mic").classList.remove("on");

  const error = event.error;

  console.warn("Speech recognition:",error);

  if(error === "aborted" && intentionalStop){
   return;
  }

  if(error === "no-speech"){

   status("صدایی دریافت نشد؛ دوباره گوش می‌دهم","live");

   return;
  }

  if(error === "not-allowed" ||
     error === "service-not-allowed"){

   autoListen = false;

   status("مجوز میکروفن یا سرویس تشخیص گفتار مسدود است","err");

   return;
  }

  if(error === "network"){

   status("ارتباط سرویس تشخیص گفتار قطع شد؛ تایپ کنید","err");

   return;
  }

  if(error === "aborted"){
   return;
  }

  status("خطای میکروفن: " + error,"err");

 };

 r.onend = ()=>{

  listening = false;

  $("mic").classList.remove("on");

 };

 return r;
}

// ======================================
// START / STOP MICROPHONE
// ======================================

async function startMic(){

 if(!on || ended || busy || speaking || listening){
  return;
 }

 if(!recognition){

  recognition = initRecognition();

 }

 if(!recognition){

  autoListen = false;

  status("این مرورگر از تشخیص گفتار فارسی پشتیبانی نمی‌کند","err");

  return;
 }

 try{

  await requestMicPermission();

  if(!on || ended || busy) return;

  intentionalStop = false;

  recognition.start();

 }catch(e){

  console.error("Mic start:",e);

  autoListen = false;

  status("میکروفن شروع نشد: " + e.message,"err");

 }

}

function stopMic(){

 intentionalStop = true;

 listening = false;

 $("mic").classList.remove("on");

 try{

  if(recognition){
   recognition.abort();
  }

 }catch(e){}

}

function scheduleListen(){

 clearTimeout(listenTimer);

 if(!on || ended || !autoListen || busy || speaking){
  return;
 }

 listenTimer = setTimeout(()=>{

  if(on && !ended && autoListen && !busy && !speaking){
   startMic();
  }

 },700);

}

// ======================================
// HANDLE USER MESSAGE
// ======================================

async function handleUser(text){

 text = (text || "").trim();

 if(!text || !on || ended || busy){
  return;
 }

 stopMic();

 busy = true;

 bubble("user",text);

 const previousHistory = history.slice();

 addHistory("user",text);

 status("در حال دریافت پاسخ از Gemini…","live");

 try{

  // مرحله اول: فقط متن
  const data = await callApi({
   action:"chat",
   message:text,
   history:previousHistory,
   voice:VOICE,
   include_audio:false
  },CHAT_TIMEOUT);

  if(ended) return;

  if(!data.reply){
   throw new Error("پاسخ متنی از Gemini دریافت نشد");
  }

  // نمایش فوری پاسخ
  bubble("bot",data.reply);

  addHistory("bot",data.reply);

  // مرحله دوم: تولید و پخش صدا
  await speakReply(data.reply);

 }catch(e){

  console.error("Chat error:",e);

  if(!ended){

   bubble("bot","متأسفم، در ارتباط با سامانه مشکلی پیش آمد. لطفاً دوباره تلاش کنید.");

   status("خطا: " + e.message,"err");

  }

 }finally{

  busy = false;

  if(!ended){

   if(autoListen){

    scheduleListen();

   }else if(!speaking){

    status("آماده دریافت پیام بعدی","live");

   }

  }

 }

}

// ======================================
// START CALL
// ======================================

$("go").onclick = async ()=>{

 if(on || busy) return;

 $("go").disabled = true;

 try{

  // فعال‌سازی صدا در همان تعامل کاربر
  await unlockAudio();

  if(!SUPABASE_FUNCTION_URL){
   throw new Error("آدرس Supabase تنظیم نشده است");
  }

  on = true;
  ended = false;
  autoListen = true;

  $("gate").classList.add("hid");

  measure();

  // دریافت مجوز میکروفن
  try{

   await requestMicPermission();

   $("micInfo").textContent = "میکروفن آماده است";

  }catch(e){

   console.warn(e);

   autoListen = false;

   $("micInfo").textContent =
    "میکروفن فعال نشد؛ می‌توانید تایپ کنید";

  }

  busy = true;

  status("در حال برقراری تماس…","live");

  // خوشامدگویی متنی
  const data = await callApi({
   action:"greet",
   voice:VOICE,
   include_audio:false
  });

  if(ended) return;

  const reply = data.reply ||
   "سلام، وقت بخیر. منشی روابط عمومی هستم. بفرمایید چه مشکلی دارید؟";

  bubble("bot",reply);

  addHistory("bot",reply);

  // تولید جداگانه صدای خوشامدگویی
  await speakReply(reply);

 }catch(e){

  console.error("Start call:",e);

  status("خطا در برقراری تماس: " + e.message,"err");

  autoListen = false;

 }finally{

  busy = false;

  $("go").disabled = false;

  if(on && !ended){

   if(autoListen){
    scheduleListen();
   }else{
    status("برای صحبت، دکمه میکروفن را بزنید","live");
   }

  }

 }

};

// ======================================
// MICROPHONE BUTTON
// ======================================

$("mic").onclick = async ()=>{

 if(!on || ended) return;

 if(autoListen || listening){

  autoListen = false;

  clearTimeout(listenTimer);

  stopMic();

  status("میکروفن متوقف شد","live");

 }else{

  autoListen = true;

  await startMic();

 }

};

// ======================================
// REPEAT LAST AUDIO
// ======================================

$("rep").onclick = async ()=>{

 if(!lastAudioUrl || mute || ended || busy || speaking){
  return;
 }

 try{

  stopMic();

  speaking = true;

  audioEl.src = lastAudioUrl;

  status("در حال تکرار پاسخ…","live");

  await audioEl.play();

  await new Promise(resolve=>{
   audioEl.onended = resolve;
   audioEl.onerror = resolve;
  });

 }catch(e){

  console.warn(e);

 }finally{

  speaking = false;

  if(autoListen) scheduleListen();

 }

};

// ======================================
// MUTE
// ======================================

$("spk").onclick = ()=>{

 mute = !mute;

 $("spk").textContent = mute ? "🔇" : "🔊";

 if(mute){
  stopAudio();
 }

 if(!mute && on && !ended){
  status("صدای منشی فعال شد","live");
 }

};

// ======================================
// TEXT MESSAGE
// ======================================

function sendText(){

 const input = $("txt");

 const value = input.value.trim();

 if(!value || busy || !on || ended) return;

 input.value = "";

 handleUser(value);

}

$("send").onclick = sendText;

$("txt").addEventListener("keydown",event=>{

 if(event.key === "Enter"){

  event.preventDefault();

  sendText();

 }

});

// ======================================
// HANG UP
// ======================================

$("hang").onclick = ()=>{

 ended = true;

 on = false;

 autoListen = false;

 busy = false;

 clearTimeout(listenTimer);

 stopMic();

 stopAudio();

 try{

  if(chatController) chatController.abort();

  if(ttsController) ttsController.abort();

 }catch(e){}

 if(lastAudioUrl){

  URL.revokeObjectURL(lastAudioUrl);

  lastAudioUrl = null;

 }

 status("تماس پایان یافت");

 try{

  if(window.Bale &&
     window.Bale.WebApp &&
     window.Bale.WebApp.close){

   window.Bale.WebApp.close();

  }

 }catch(e){}

};

// ======================================
// CLEANUP
// ======================================

window.addEventListener("resize",measure);

window.addEventListener("pagehide",()=>{

 ended = true;

 autoListen = false;

 clearTimeout(listenTimer);

 stopMic();

 stopAudio();

 if(lastAudioUrl){
  URL.revokeObjectURL(lastAudioUrl);
 }

});

try{

 if(window.Bale && window.Bale.WebApp){

  window.Bale.WebApp.ready();

  if(window.Bale.WebApp.expand){
   window.Bale.WebApp.expand();
  }

 }

}catch(e){}

measure();

})();
</script>
</body>
</html>
