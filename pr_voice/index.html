
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>منشی هوشمند روابط عمومی</title>
<script src="https://tapi.bale.ai/miniapp.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f2f6f4;color:#183b2d;
 font-family:Tahoma,Arial,sans-serif
}
.app{max-width:600px;margin:auto;min-height:100vh;padding:15px}
.header{
 background:linear-gradient(135deg,#145b40,#23865c);
 color:white;padding:22px;border-radius:18px;text-align:center
}
.header h2{margin:0 0 8px;font-size:20px}
.header p{margin:0;font-size:13px}
.status{font-size:12px;margin-top:12px;color:#d7f7e6}
.chat{
 background:white;border-radius:16px;padding:14px;
 margin-top:15px;min-height:320px;max-height:55vh;
 overflow-y:auto
}
.msg{padding:12px 14px;border-radius:14px;margin:9px 0;
 line-height:2;font-size:14px;white-space:pre-wrap}
.bot{background:#edf6f0;margin-left:25px}
.user{background:#dcefe5;margin-right:25px}
.controls{display:flex;gap:9px;margin-top:12px}
button{
 border:0;border-radius:12px;padding:13px;
 font-size:14px;font-family:inherit;cursor:pointer
}
.mic{background:#16734c;color:white;flex:1}
.stop{background:#f1e4e4;color:#8b2727}
.send{background:#16734c;color:white;width:100%;margin-top:8px}
input{
 width:100%;padding:13px;border:1px solid #d8e2dc;
 border-radius:10px;font-family:inherit;font-size:14px;
 margin-top:9px
}
.form{
 background:white;padding:15px;border-radius:15px;margin-top:14px
}
.form h3{margin:0 0 8px;font-size:16px}
.small{font-size:11px;color:#6b7b72;line-height:1.8;margin-top:12px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">

<div class="header">
 <h2>منشی هوشمند روابط عمومی</h2>
 <p>سامانه پاسخ‌گویی صوتی و ثبت درخواست شهروندان</p>
 <div class="status" id="status">در حال آماده‌سازی...</div>
</div>

<div class="chat" id="chat">
 <div class="msg bot">
سلام، وقت شما بخیر 🌷
منشی هوشمند روابط عمومی شرکت توزیع نیروی برق استان سیستان و بلوچستان هستم.
لطفاً درخواست خود را بیان کنید.
 </div>
</div>

<div class="controls">
 <button class="mic" id="micBtn" onclick="startRecording()">🎙 شروع صحبت</button>
 <button class="stop" onclick="stopRecording()">توقف</button>
</div>

<div class="form">
 <h3>ثبت اطلاعات تماس</h3>
 <input id="name" placeholder="نام و نام خانوادگی">
 <input id="phone" type="tel" placeholder="شماره تماس">
 <input id="problem" placeholder="موضوع درخواست یا مشکل">
 <button class="send" onclick="submitTicket()">ثبت درخواست</button>
 <div class="small">
اطلاعات پس از ارسال موفق به سرور ثبت می‌شوند.
 </div>
</div>
</div>

<audio id="audio" playsinline></audio>

<script>
const API_URL = "/api/voice-assistant";

let mediaRecorder = null;
let audioChunks = [];
let micStream = null;
let busy = false;

const chat = document.getElementById("chat");
const statusBox = document.getElementById("status");
const micBtn = document.getElementById("micBtn");
const audioPlayer = document.getElementById("audio");

function status(text){
 statusBox.textContent = text;
}

function addMessage(text,type="bot"){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

async function startRecording(){
 if(busy)return;

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw new Error("مرورگر امکان دسترسی به میکروفون را ندارد.");
  }

  micStream=await navigator.mediaDevices.getUserMedia({
   audio:{
    channelCount:1,
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:true
   }
  });

  let mimeType="";
  if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus")){
   mimeType="audio/webm;codecs=opus";
  }else if(MediaRecorder.isTypeSupported("audio/webm")){
   mimeType="audio/webm";
  }

  mediaRecorder=new MediaRecorder(
   micStream,
   mimeType?{mimeType}:{}
  );

  audioChunks=[];

  mediaRecorder.ondataavailable=e=>{
   if(e.data && e.data.size>0)audioChunks.push(e.data);
  };

  mediaRecorder.onstop=sendAudio;

  mediaRecorder.start();
  micBtn.disabled=true;
  status("در حال شنیدن صدای شما...");
  addMessage("در حال گوش دادن هستم، لطفاً صحبت کنید.","bot");

 }catch(e){
  status("خطا در میکروفون: "+e.message);
  releaseMic();
 }
}

function stopRecording(){
 if(mediaRecorder && mediaRecorder.state==="recording"){
  mediaRecorder.stop();
  status("در حال ارسال صدا به Gemini...");
 }
}

function releaseMic(){
 if(micStream){
  micStream.getTracks().forEach(t=>t.stop());
  micStream=null;
 }
 micBtn.disabled=false;
}

async function sendAudio(){
 releaseMic();

 const blob=new Blob(audioChunks,{
  type:audioChunks[0]?.type || "audio/webm"
 });

 if(!blob.size){
  status("صدایی دریافت نشد.");
  return;
 }

 await sendToGemini(blob);
}

async function sendToGemini(blob){
 if(busy)return;
 busy=true;
 micBtn.disabled=true;
 status("در حال پردازش گفتار و تولید پاسخ صوتی...");

 try{
  const form=new FormData();
  form.append("audio",blob,"voice.webm");
  form.append("language","fa-IR");
  form.append("voice","female");
  form.append("tts","gemini");

  const response=await fetch(API_URL,{
   method:"POST",
   body:form
  });

  if(!response.ok){
   const errorText=await response.text();
   throw new Error("خطای سرور "+response.status+": "+errorText);
  }

  const result=await response.json();

  if(!result.text){
   throw new Error("متن پاسخ از سرور دریافت نشد.");
  }

  addMessage(result.text,"bot");

  if(!result.audio_url && !result.audio_base64){
   throw new Error("فایل صوتی Gemini در پاسخ سرور وجود ندارد.");
  }

  if(result.audio_base64){
   const binary=atob(result.audio_base64);
   const bytes=new Uint8Array(binary.length);
   for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);

   const audioBlob=new Blob([bytes],{
    type:result.mime_type || "audio/wav"
   });
   audioPlayer.src=URL.createObjectURL(audioBlob);
  }else{
   audioPlayer.src=result.audio_url;
  }

  await audioPlayer.play();
  status("پاسخ صوتی آماده است.");

  if(result.name)document.getElementById("name").value=result.name;
  if(result.phone)document.getElementById("phone").value=result.phone;
  if(result.problem)document.getElementById("problem").value=result.problem;

 }catch(e){
  addMessage("متأسفانه در دریافت پاسخ صوتی خطایی رخ داد: "+e.message,"bot");
  status("خطا در ارتباط با سرور Gemini");
 }finally{
  busy=false;
  micBtn.disabled=false;
 }
}

async function submitTicket(){
 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const problem=document.getElementById("problem").value.trim();

 if(!name || !phone || !problem){
  alert("لطفاً نام، شماره تماس و موضوع درخواست را تکمیل کنید.");
  return;
 }

 try{
  status("در حال ثبت درخواست...");
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    action:"create_ticket",
    name,phone,problem
   })
  });

  const result=await response.json();

  if(!response.ok || !result.success){
   throw new Error(result.error || "ثبت درخواست ناموفق بود.");
  }

  addMessage("درخواست شما با موفقیت ثبت شد. کد پیگیری: "+
   (result.ticket_id || "ثبت‌شده"),"bot");

  status("درخواست با موفقیت ثبت شد.");

 }catch(e){
  status("خطا در ثبت درخواست: "+e.message);
 }
}
</script>
</body>
</html>
