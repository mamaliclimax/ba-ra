
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>منشی زنده روابط عمومی</title>
<script src="https://tapi.bale.ai/miniapp.js"></script>

<style>
:root{
  --bg:#0b1220;
  --card:#151d2e;
  --text:#f2f5ff;
  --muted:#9aa6c2;
  --accent:#3ee0a3;
  --danger:#ff4d6d;
  --line:rgba(255,255,255,.1);
  --ctrl-h:145px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  overflow:hidden;
}
body{
  font-family:Tahoma,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  height:100dvh;
}
button,input{font-family:inherit}
.top{
  padding:10px 12px 5px;
  text-align:center;
  flex-shrink:0;
}
.badge{
  display:inline-block;
  padding:4px 11px;
  border-radius:999px;
  border:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}
h1{font-size:1.05rem}
#status{
  color:var(--muted);
  font-size:.8rem;
  min-height:20px;
  margin-top:4px;
}
#status.live{color:var(--accent)}
#status.err{color:var(--danger)}
#chat{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:10px 12px;
  padding-bottom:calc(var(--ctrl-h) + 20px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  gap:9px;
  min-height:0;
}
.b{
  max-width:90%;
  padding:9px 12px;
  border-radius:14px;
  line-height:1.8;
  font-size:.9rem;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.bot{
  align-self:flex-start;
  background:var(--card);
  border:1px solid var(--line);
}
.user{
  align-self:flex-end;
  background:#285fc4;
}
.meta{
  font-size:.65rem;
  opacity:.65;
  margin-bottom:3px;
}
.ctrl{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  padding:9px 10px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(11,18,32,.98);
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:center;
}
.row{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
}
.btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.07);
  color:var(--text);
  border-radius:999px;
  height:38px;
  min-width:38px;
  padding:0 12px;
  font-size:14px;
  cursor:pointer;
}
.btn.main{
  background:var(--accent);
  color:#042214;
  font-weight:800;
  border:none;
  height:46px;
  padding:0 24px;
  font-size:15px;
}
.btn.hang{
  background:var(--danger);
  border:none;
  color:#fff;
  width:43px;
  height:43px;
}
.btn.mic{
  width:48px;
  height:48px;
  font-size:20px;
}
.btn.mic.on{
  background:var(--accent);
  color:#042214;
  outline:3px solid rgba(62,224,163,.2);
}
.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}
.row2{
  display:flex;
  width:100%;
  max-width:440px;
  gap:7px;
}
.row2 input{
  flex:1;
  min-width:0;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
  padding:11px;
  font-size:.9rem;
  outline:none;
}
.row2 button{
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:#042214;
  font-weight:700;
  padding:0 15px;
  font-size:13px;
}
.hint{
  font-size:11px;
  color:var(--muted);
  text-align:center;
}
#gate{
  position:fixed;
  inset:0;
  background:rgba(5,10,20,.97);
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:24px;
  text-align:center;
}
#gate.hid{display:none}
#gate p{
  color:var(--muted);
  max-width:320px;
  line-height:1.9;
  font-size:.88rem;
}
#gate .btn{margin-top:8px}
</style>
</head>

<body>

<div id="gate">
  <div class="badge">تماس هوشمند · Gemini</div>
  <h2>منشی روابط عمومی</h2>
  <p>
    برای شروع مکالمه دکمه زیر را بزنید.
    پس از شروع، منشی به صحبت‌های شما گوش می‌دهد و پاسخ می‌دهد.
  </p>
  <button class="btn main" id="go">📞 شروع تماس</button>
</div>

<div class="top">
  <div class="badge">● تماس زنده</div>
  <h1>منشی روابط عمومی</h1>
  <div id="status">منتظر شروع تماس…</div>
</div>

<div id="chat"></div>

<div class="ctrl" id="ctrl">
  <div class="row">
    <button class="btn" id="spk" title="قطع و وصل صدا">🔊</button>
    <button class="btn hang" id="hang" title="پایان تماس">☎</button>
    <button class="btn mic" id="mic" title="میکروفن">🎤</button>
    <button class="btn" id="rep" title="تکرار پاسخ">▶️</button>
  </div>

  <div class="row2">
    <input id="txt" placeholder="پیام خود را بنویسید…" autocomplete="off">
    <button id="send">ارسال</button>
  </div>

  <div class="hint" id="hint">
    میکروفن آماده · مکالمه فارسی
  </div>
</div>

<script>
(function(){

"use strict";

// ==========================================
// CONFIG
// ==========================================

const DEFAULT_API =
"https://bfzreeyyhmygpnfzczwn.supabase.co/functions/v1/pr-live";

// اگر تابع Supabase شما JWT verification دارد،
// کلید عمومی anon را اینجا قرار دهید.
// این کلید نباید service_role باشد.
const SUPABASE_ANON_KEY = "";

const VOICE = "Kore";

const CHAT_TIMEOUT = 25000;
const TTS_TIMEOUT = 35000;
const AUTO_LISTEN = true;

// ==========================================
// STATE
// ==========================================

let on = false;
let ended = false;
let listening = false;
let speaking = false;
let busy = false;
let mute = false;
let intentionalStop = false;
let recognitionBlocked = false;

let rec = null;
let lastBot = "";
let lastAudioUrl = null;
let restartTimer = null;
let speechSession = 0;

const history = [];
const audioEl = new Audio();

audioEl.preload = "auto";

const $ = id => document.getElementById(id);

// ==========================================
// API URL
// ==========================================

function getApiUrl(){

  try{
    const params = new URL(location.href);
    const custom = params.searchParams.get("api");

    if(custom) return custom.replace(/\/$/,"");

    const saved = localStorage.getItem("pr_live_api");

    if(saved) return saved.replace(/\/$/,"");

  }catch(e){}

  return DEFAULT_API.replace(/\/$/,"");
}

// ==========================================
// UI
// ==========================================

function status(text, type){

  $("status").textContent = text;
  $("status").className = type || "";

}

function measure(){

  const h = $("ctrl").offsetHeight || 145;

  document.documentElement.style.setProperty(
    "--ctrl-h",
    h + "px"
  );

}

function scrollChat(){

  const c = $("chat");

  c.scrollTop = c.scrollHeight;

}

function bubble(role,text){

  const d = document.createElement("div");

  d.className = "b " + (role === "bot" ? "bot" : "user");

  const meta = document.createElement("div");

  meta.className = "meta";

  meta.textContent =
    role === "bot" ? "منشی روابط عمومی" : "شما";

  const content = document.createElement("div");

  // امن: متن کاربر هرگز به صورت HTML اجرا نمی‌شود.
  content.textContent = String(text || "");

  d.appendChild(meta);
  d.appendChild(content);

  $("chat").appendChild(d);

  scrollChat();

}

// ==========================================
// HISTORY
// ==========================================

function saveHistory(role,text){

  history.push({
    role,
    text
  });

  // فقط ۱۲ پیام آخر در حافظه نگهداری شود.
  while(history.length > 12){
    history.shift();
  }

}

// ==========================================
// AUDIO UNLOCK
// ==========================================

async function unlockAudio(){

  try{

    audioEl.src =
      "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";

    await audioEl.play();

    audioEl.pause();
    audioEl.currentTime = 0;

  }catch(e){

    console.log("Audio unlock:",e);

  }

}

// ==========================================
// API REQUEST
// ==========================================

async function callApi(payload,timeout){

  const api = getApiUrl();

  if(!api){
    throw new Error("آدرس سرور تنظیم نشده است.");
  }

  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    timeout || CHAT_TIMEOUT
  );

  try{

    const headers = {
      "Content-Type":"application/json"
    };

    if(SUPABASE_ANON_KEY){

      headers.apikey = SUPABASE_ANON_KEY;

      headers.Authorization =
        "Bearer " + SUPABASE_ANON_KEY;

    }

    const response = await fetch(api,{

      method:"POST",
      headers,
      body:JSON.stringify(payload),
      signal:controller.signal

    });

    const data = await response.json().catch(()=>({}));

    if(!response.ok){

      throw new Error(
        data.error || ("HTTP " + response.status)
      );

    }

    if(data.error){

      throw new Error(data.error);

    }

    return data;

  }catch(e){

    if(e.name === "AbortError"){

      throw new Error("پاسخ سرور بیش از حد طول کشید.");

    }

    throw e;

  }finally{

    clearTimeout(timer);

  }

}

// ==========================================
// AUDIO PLAYBACK
// ==========================================

function playBase64(base64,mime){

  return new Promise(resolve=>{

    if(!base64 || mute){

      resolve(false);
      return;

    }

    try{

      const binary = atob(base64);

      const bytes = new Uint8Array(binary.length);

      for(let i=0;i<binary.length;i++){

        bytes[i] = binary.charCodeAt(i);

      }

      const type =
        mime && mime.includes("mpeg")
        ? "audio/mpeg"
        : (mime || "audio/wav");

      const blob = new Blob(
        [bytes],
        {type}
      );

      const newUrl = URL.createObjectURL(blob);

      if(lastAudioUrl){

        URL.revokeObjectURL(lastAudioUrl);

      }

      lastAudioUrl = newUrl;

      let finished = false;

      const done = value => {

        if(finished) return;

        finished = true;
        resolve(value);

      };

      audioEl.onended = () => done(true);

      audioEl.onerror = () => done(false);

      audioEl.src = newUrl;

      const result = audioEl.play();

      if(result && result.catch){

        result.catch(error=>{

          console.error("Audio play error:",error);

          done(false);

        });

      }

    }catch(e){

      console.error("Audio error:",e);

      resolve(false);

    }

  });

}

// ==========================================
// STOP AUDIO
// ==========================================

function stopAudio(){

  try{

    audioEl.pause();
    audioEl.currentTime = 0;

  }catch(e){}

}

// ==========================================
// MICROPHONE / SPEECH RECOGNITION
// ==========================================

function initRecognition(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    recognitionBlocked = true;

    $("hint").textContent =
      "تشخیص گفتار در این مرورگر پشتیبانی نمی‌شود.";

    return null;

  }

  const r = new SR();

  r.lang = "fa-IR";

  r.continuous = false;

  r.interimResults = true;

  r.maxAlternatives = 1;

  r.onstart = function(){

    listening = true;

    intentionalStop = false;

    $("mic").classList.add("on");

    status("🎤 گوش می‌دهم…","live");

    $("hint").textContent =
      "صحبت کنید؛ پس از پایان صحبت، پاسخ داده می‌شود.";

  };

  r.onresult = function(event){

    let finalText = "";

    for(
      let i=event.resultIndex;
      i<event.results.length;
      i++
    ){

      const result = event.results[i];

      if(result.isFinal){

        finalText += result[0].transcript;

      }

    }

    finalText = finalText.trim();

    if(finalText){

      // جلوگیری از شروع مجدد تا پردازش پیام
      intentionalStop = true;

      stopMic();

      onUser(finalText);

    }

  };

  r.onerror = function(event){

    listening = false;

    $("mic").classList.remove("on");

    console.error(
      "Speech recognition error:",
      event.error
    );

    if(
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ){

      recognitionBlocked = true;

      status("دسترسی میکروفن مسدود است.","err");

      $("hint").textContent =
        "مجوز میکروفن مرورگر را فعال کنید.";

      return;

    }

    if(event.error === "no-speech"){

      status("صدایی دریافت نشد؛ دوباره صحبت کنید.","err");

    }else if(event.error === "aborted"){

      // لغو عمدی خطای واقعی نیست.

      return;

    }else{

      status("خطای تشخیص گفتار: " + event.error,"err");

    }

  };

  r.onend = function(){

    listening = false;

    $("mic").classList.remove("on");

    // اگر تماس فعال است، پس از پایان پاسخ
    // دوباره شنیدن به صورت خودکار آغاز می‌شود.

    if(
      AUTO_LISTEN &&
      on &&
      !ended &&
      !busy &&
      !speaking &&
      !intentionalStop &&
      !recognitionBlocked
    ){

      scheduleListen(700);

    }

  };

  return r;

}

// ==========================================
// AUTO RESTART MICROPHONE
// ==========================================

function scheduleListen(delay){

  clearTimeout(restartTimer);

  restartTimer = setTimeout(()=>{

    if(
      on &&
      !ended &&
      !busy &&
      !speaking &&
      !listening &&
      !intentionalStop &&
      !recognitionBlocked
    ){

      startMic();

    }

  },delay);

}

// ==========================================
// START MICROPHONE
// ==========================================

function startMic(){

  if(
    !on ||
    ended ||
    busy ||
    speaking ||
    listening
  ){

    return;

  }

  clearTimeout(restartTimer);

  if(!rec){

    rec = initRecognition();

  }

  if(!rec){

    status(
      "تشخیص گفتار در این محیط فعال نیست.",
      "err"
    );

    return;

  }

  intentionalStop = false;

  try{

    rec.start();

  }catch(e){

    console.warn("Recognition start:",e);

    scheduleListen(1000);

  }

}

// ==========================================
// STOP MICROPHONE
// ==========================================

function stopMic(){

  clearTimeout(restartTimer);

  listening = false;

  $("mic").classList.remove("on");

  try{

    if(rec){

      rec.abort();

    }

  }catch(e){}

}

// ==========================================
// BOT SPEAK
// ==========================================

async function botSpeak(reply,audioData){

  if(!reply) return;

  lastBot = reply;

  bubble("bot",reply);

  saveHistory("bot",reply);

  speaking = true;

  const session = ++speechSession;

  status("منشی پاسخ می‌دهد…","live");

  let audio = audioData;

  try{

    // اگر صوت قبلاً در پاسخ سرور نبود،
    // از اکشن مستقل speak درخواست می‌شود.

    if(!audio || !audio.audio_base64){

      const sound = await callApi({

        action:"speak",
        text:reply,
        voice:VOICE

      },TTS_TIMEOUT);

      audio = sound;

    }

    if(
      session !== speechSession ||
      ended
    ){

      return;

    }

    let played = false;

    if(audio && audio.audio_base64){

      played = await playBase64(
        audio.audio_base64,
        audio.mime
      );

    }

    if(session !== speechSession) return;

    speaking = false;

    if(!played){

      status(
        "پاسخ متنی آماده است؛ صوت در دسترس نبود.",
        "err"
      );

    }else{

      status("آماده شنیدن صحبت شما","live");

    }

  }catch(e){

    speaking = false;

    console.error("TTS error:",e);

    status("پاسخ متنی آماده است؛ تولید صدا ناموفق بود.","err");

  }

  if(
    AUTO_LISTEN &&
    on &&
    !ended &&
    !busy &&
    !recognitionBlocked
  ){

    intentionalStop = false;

    scheduleListen(800);

  }

}

// ==========================================
// USER MESSAGE
// ==========================================

async function onUser(text){

  text = String(text || "").trim();

  if(
    !text ||
    !on ||
    ended ||
    busy
  ){

    return;

  }

  stopMic();

  stopAudio();

  speaking = false;

  busy = true;

  bubble("user",text);

  saveHistory("user",text);

  status("در حال پردازش درخواست…","live");

  try{

    // اول فقط متن را دریافت کن
    // تا کاربر منتظر تولید صوت نماند.

    const data = await callApi({

      action:"chat",

      message:text,

      history:history.slice(0,-1).slice(-8),

      voice:VOICE,

      audio:false

    },CHAT_TIMEOUT);

    if(!data.reply){

      throw new Error("پاسخ متنی از سرور دریافت نشد.");

    }

    busy = false;

    await botSpeak(data.reply,null);

  }catch(e){

    console.error("Chat error:",e);

    busy = false;

    bubble(
      "bot",
      "متأسفانه ارتباط با سرور برقرار نشد. لطفاً دوباره تلاش کنید."
    );

    status("خطا در ارتباط با سرور","err");

    if(AUTO_LISTEN && on && !ended){

      scheduleListen(1200);

    }

  }

}

// ==========================================
// START CALL
// ==========================================

$("go").onclick = async function(){

  if(on) return;

  await unlockAudio();

  if(!getApiUrl()){

    status("آدرس API تنظیم نشده است.","err");

    return;

  }

  $("gate").classList.add("hid");

  on = true;

  ended = false;

  busy = true;

  status("در حال برقراری تماس…","live");

  // تشخیص گفتار را قبل از درخواست سرور آماده کن.

  rec = initRecognition();

  try{

    const data = await callApi({

      action:"greet",
      voice:VOICE

    },TTS_TIMEOUT);

    busy = false;

    await botSpeak(
      data.reply,
      data.audio_base64
        ? data
        : null
    );

  }catch(e){

    console.error("Greeting error:",e);

    busy = false;

    const fallback =
      "سلام، وقت بخیر. من منشی روابط عمومی هستم. بفرمایید، چطور می‌توانم کمکتان کنم؟";

    await botSpeak(fallback,null);

  }

};

// ==========================================
// MICROPHONE BUTTON
// ==========================================

$("mic").onclick = function(){

  if(!on || ended) return;

  if(listening){

    intentionalStop = true;

    stopMic();

    status("میکروفن متوقف شد.","");

  }else{

    if(speaking){

      speechSession++;

      stopAudio();

      speaking = false;

    }

    startMic();

  }

};

// ==========================================
// REPEAT AUDIO
// ==========================================

$("rep").onclick = async function(){

  if(!lastAudioUrl || mute || ended) return;

  stopMic();

  stopAudio();

  speaking = true;

  status("در حال پخش مجدد…","live");

  try{

    audioEl.src = lastAudioUrl;

    await audioEl.play();

  }catch(e){

    speaking = false;

    status("پخش مجدد ممکن نیست.","err");

  }

};

// ==========================================
// MUTE
// ==========================================

$("spk").onclick = function(){

  mute = !mute;

  $("spk").textContent =
    mute ? "🔇" : "🔊";

  if(mute){

    speechSession++;

    stopAudio();

    speaking = false;

    if(AUTO_LISTEN && on && !ended && !busy){

      scheduleListen(500);

    }

  }

};

// ==========================================
// SEND TEXT
// ==========================================

function sendText(){

  const input = $("txt");

  const value = input.value.trim();

  if(!value || busy) return;

  input.value = "";

  onUser(value);

}

$("send").onclick = sendText;

$("txt").addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      sendText();

    }

  }
);

// ==========================================
// HANG UP
// ==========================================

$("hang").onclick = function(){

  ended = true;

  on = false;

  busy = false;

  speaking = false;

  speechSession++;

  intentionalStop = true;

  stopMic();

  stopAudio();

  clearTimeout(restartTimer);

  status("تماس پایان یافت.","");

  $("hint").textContent = "تماس قطع شده است.";

  try{

    if(
      window.Bale &&
      Bale.WebApp &&
      Bale.WebApp.close
    ){

      Bale.WebApp.close();

    }

  }catch(e){}

};

// ==========================================
// INIT
// ==========================================

window.addEventListener("resize",measure);

window.addEventListener("orientationchange",measure);

document.addEventListener(
  "visibilitychange",
  function(){

    if(document.hidden){

      stopMic();

    }else if(
      on &&
      !ended &&
      AUTO_LISTEN &&
      !busy &&
      !speaking &&
      !recognitionBlocked
    ){

      scheduleListen(1000);

    }

  }
);

try{

  if(window.Bale && Bale.WebApp){

    Bale.WebApp.ready();

    if(Bale.WebApp.expand){

      Bale.WebApp.expand();

    }

  }

}catch(e){}

measure();

})();
</script>
