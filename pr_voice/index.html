<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>تماس زنده با منشی</title>
<script src="https://tapi.bale.ai/miniapp.js"></script>
<style>
:root{--bg:#0b1220;--card:#151d2e;--text:#f2f5ff;--muted:#9aa6c2;--accent:#3ee0a3;--danger:#ff4d6d;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100%}
.top{padding:14px;text-align:center}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px;margin-bottom:6px}
h1{font-size:1.15rem}
#status{color:var(--muted);font-size:.85rem;min-height:1.2em;margin-top:4px}
#status.live{color:var(--accent)}#status.err{color:var(--danger)}
#chat{flex:1;overflow-y:auto;padding:10px 12px 200px;display:flex;flex-direction:column;gap:8px}
.b{max-width:92%;padding:10px 12px;border-radius:14px;line-height:1.7;font-size:.92rem;white-space:pre-wrap}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.user{align-self:flex-end;background:#2a6bff}
.meta{font-size:.7rem;opacity:.65;margin-bottom:3px}
.ctrl{position:fixed;bottom:0;left:0;right:0;padding:10px 12px 16px;background:#0b1220;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:10px 14px;font-size:14px;cursor:pointer}
.btn.main{background:var(--accent);color:#042214;font-weight:800;border:none;padding:12px 22px}
.btn.hang{background:var(--danger);border:none}
.btn.mic.on{outline:3px solid rgba(62,224,163,.35)}
.row2{display:flex;width:100%;max-width:440px;gap:8px}
.row2 input{flex:1;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:10px}
.row2 button{border:none;border-radius:12px;background:var(--accent);color:#042214;font-weight:700;padding:0 14px}
.hint{font-size:12px;color:var(--muted);text-align:center}
#gate{position:fixed;inset:0;background:rgba(5,10,20,.94);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#gate.hid{display:none}
#gate p{color:var(--muted);max-width:300px;line-height:1.7;font-size:.9rem}
</style>
</head>
<body>
<div id="gate">
  <div class="badge">تماس زنده</div>
  <h2>منشی روابط عمومی</h2>
  <p>برای شروع تماس این دکمه را بزنید تا صدا و میکروفون فعال شود.</p>
  <button class="btn main" id="go">📞 شروع تماس زنده</button>
</div>
<div class="top">
  <div class="badge">● تماس زنده</div>
  <h1>منشی روابط عمومی</h1>
  <div id="status">منتظر شروع…</div>
</div>
<div id="chat"></div>
<div class="ctrl">
  <div class="row">
    <button class="btn" id="spk">🔊</button>
    <button class="btn hang" id="hang">قطع</button>
    <button class="btn mic" id="mic">🎤 میکروفون</button>
    <button class="btn" id="rep">▶️ پخش دوباره</button>
  </div>
  <div class="row2">
    <input id="txt" placeholder="اینجا بنویسید…" />
    <button id="send">ارسال</button>
  </div>
  <div class="hint" id="hint">بعد از شروع، میکروفون یا تایپ</div>
</div>
<script>
(function(){
  let on=false, ended=false, listening=false, speaking=false, mute=false;
  let lastBot="", turns=0, rec=null, stream=null, voice=null;
  const data={first_name:"",last_name:"",phone:"",problem:""};
  const $ = id => document.getElementById(id);
  function st(t,c){ const e=$("status"); e.textContent=t; e.className=c||""; }
  function bubble(role,text){
    const d=document.createElement("div");
    d.className="b "+(role==="bot"?"bot":"user");
    d.innerHTML='<div class="meta">'+(role==="bot"?"منشی":"شما")+"</div>"+String(text||"").replace(/</g,"&lt;");
    $("chat").appendChild(d); $("chat").scrollTop=1e9;
  }
  function pickVoice(){
    try{
      const vs=speechSynthesis.getVoices()||[];
      const score=v=>{
        let s=0; const n=(v.name||"")+" "+(v.lang||"");
        if(/fa/i.test(v.lang)) s+=40;
        if(/female|woman|girl|dilara|sara|zira|susan|samantha|helena|moira|veena|karen/i.test(n)) s+=35;
        if(/male|man|david|mark|farid|ravi|daniel/i.test(n)) s-=30;
        return s;
      };
      voice=vs.slice().sort((a,b)=>score(b)-score(a))[0]||null;
    }catch(e){ voice=null; }
  }
  async function unlock(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){ const c=new AC(); if(c.state==="suspended") await c.resume(); }
    }catch(e){}
    try{ await new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=").play(); }catch(e){}
  }
  async function micOn(){
    try{
      if(stream) return true;
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return true;
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      return true;
    }catch(e){ st("مجوز میکروفون نیست — تایپ کنید","err"); return false; }
  }
  function speak(text){
    return new Promise(res=>{
      lastBot=String(text||"");
      if(mute||!lastBot||!window.speechSynthesis){ res(); return; }
      speaking=true; st("منشی صحبت می‌کند…","live");
      try{ speechSynthesis.cancel(); }catch(e){}
      pickVoice();
      const u=new SpeechSynthesisUtterance(lastBot);
      u.lang="fa-IR"; u.rate=0.95; u.pitch=1.2; u.volume=1;
      if(voice) u.voice=voice;
      const done=()=>{ speaking=false; if(!ended) st("آماده","live"); res(); };
      u.onend=done; u.onerror=done;
      try{ speechSynthesis.speak(u); }catch(e){ done(); }
      setTimeout(done, Math.min(20000, 1500+lastBot.length*80));
    });
  }
  function extract(t){
    const lat=t.replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c));
    const m=lat.match(/(?:\+98|0)?9\d{9}/);
    if(m){ let d=m[0].replace(/\D/g,""); if(d.startsWith("0")) d="+98"+d.slice(1); else if(d.length===10) d="+98"+d; else if(d.startsWith("98")) d="+"+d; data.phone=d; }
    let mm=t.match(/من\s+([آ-یء‌]{2,15})\s+هستم/)||t.match(/(?:اسمم|نامم)\s+([آ-یء‌]{2,15})/);
    if(mm) data.first_name=mm[1];
    if(!data.first_name&&/^[آ-یء‌]{2,15}$/.test(t)) data.first_name=t;
    mm=t.match(/(?:فامیلم|نام خانوادگیم)\s+([آ-یء‌]{2,20})/);
    if(mm) data.last_name=mm[1];
    if(t.length>=12&&!/^(سلام|درود)/.test(t)) data.problem=t.slice(0,2000);
  }
  function reply(t){
    turns++; extract(t);
    const miss=[];
    if(!data.first_name) miss.push("نام");
    if(!data.phone) miss.push("شماره");
    if(!data.problem||data.problem.length<8) miss.push("موضوع");
    if(/^(تمام|پایان|مرسی|ممنون)/.test(t.trim())){
      if(!miss.length){ try{ const k="pr_voice_tickets_v2"; const a=JSON.parse(localStorage.getItem(k)||"[]"); a.push({...data,at:new Date().toISOString()}); localStorage.setItem(k,JSON.stringify(a.slice(-200))); }catch(e){} return {r:"درخواست ثبت شد. روز خوبی داشته باشید.",d:1}; }
      return {r:"لطفاً "+miss.join(" و ")+" را هم بفرمایید.",d:0};
    }
    if(turns===1) return {r: data.first_name?(data.first_name+" عزیز، بفرمایید چه کمکی می‌توانم بکنم؟"):"خوشحالم از تماس. نام‌تان را بگویید و موضوع را راحت بفرمایید.",d:0};
    if(!miss.length) return {r:"خلاصه ثبت شد. اگر تمام است بگویید تمام.",d:0};
    if(miss.indexOf("شماره")>=0&&!data.phone) return {r:"یک شماره تماس هم بفرمایید لطفاً.",d:0};
    if(miss.indexOf("نام")>=0&&!data.first_name) return {r:"نام‌تان را هم بفرمایید.",d:0};
    return {r:"متوجه شدم. ادامه بدهید یا جزئیات بیشتری بگویید.",d:0};
  }
  async function onUser(t){
    t=(t||"").trim(); if(!t||!on||ended||speaking) return;
    stopMic(); bubble("user",t);
    const x=reply(t); bubble("bot",x.r); await speak(x.r);
    if(x.d){ ended=true; st("پایان تماس","live"); }
  }
  function initRec(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return null;
    const r=new SR(); r.lang="fa-IR"; r.continuous=false; r.interimResults=false;
    r.onstart=()=>{ listening=true; $("mic").classList.add("on"); st("گوش می‌دهم…","live"); };
    r.onresult=ev=>{
      let t=""; for(let i=ev.resultIndex;i<ev.results.length;i++) if(ev.results[i].isFinal) t+=ev.results[i][0].transcript;
      listening=false; $("mic").classList.remove("on"); t=(t||"").trim();
      if(t) onUser(t); else st("چیزی نشنیدم","err");
    };
    r.onerror=()=>{ listening=false; $("mic").classList.remove("on"); st("میکروفون خطا — تایپ کنید","err"); };
    r.onend=()=>{ listening=false; $("mic").classList.remove("on"); };
    return r;
  }
  function stopMic(){ listening=false; $("mic").classList.remove("on"); try{ if(rec) rec.abort(); }catch(e){} }
  async function startMic(){
    if(!on||ended||speaking||listening) return;
    if(!(await micOn())) return;
    if(!rec) rec=initRec();
    if(!rec){ st("تشخیص گفتار نیست — تایپ کنید","err"); return; }
    try{ rec.start(); }catch(e){ st("میکروفون شروع نشد — تایپ کنید","err"); }
  }
  $("go").onclick=async ()=>{
    await unlock(); await micOn(); pickVoice();
    $("gate").classList.add("hid"); on=true;
    const hello="سلام، وقت بخیر. من منشی روابط عمومی هستم. راحت بفرمایید چه کمکی از دستم برمی‌آید.";
    bubble("bot", hello); await speak(hello);
    st("آماده — میکروفون یا تایپ","live");
    $("hint").textContent="اگر صدا نیامد «پخش دوباره» را بزنید. تایپ همیشه کار می‌کند.";
  };
  $("mic").onclick=()=>{ if(listening) stopMic(); else startMic(); };
  $("rep").onclick=()=>{ if(lastBot) speak(lastBot); };
  $("spk").onclick=()=>{ mute=!mute; $("spk").textContent=mute?"🔇":"🔊"; if(mute) try{ speechSynthesis.cancel(); }catch(e){} };
  $("hang").onclick=()=>{ ended=true; stopMic(); try{ speechSynthesis.cancel(); }catch(e){} st("قطع شد"); try{ Bale.WebApp.close(); }catch(e){} };
  $("send").onclick=()=>{ const v=$("txt").value; $("txt").value=""; onUser(v); };
  $("txt").onkeydown=e=>{ if(e.key==="Enter"){ const v=$("txt").value; $("txt").value=""; onUser(v); } };
  try{ if(window.Bale&&Bale.WebApp){ Bale.WebApp.ready(); try{ Bale.WebApp.expand(); }catch(e){} } }catch(e){}
  try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
})();
</script>
</body>
</html>
