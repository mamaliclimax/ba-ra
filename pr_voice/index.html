<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>تماس زنده با منشی</title>
<script src="https://tapi.bale.ai/miniapp.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b1220;--card:#151d2e;--text:#f2f5ff;--muted:#9aa6c2;--accent:#3ee0a3;--danger:#ff4d6d;--line:rgba(255,255,255,.1);--ctrl-h:150px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100%}
.top{padding:10px 12px 4px;text-align:center;flex-shrink:0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:11px;margin-bottom:4px}
h1{font-size:1.05rem}
#status{color:var(--muted);font-size:.8rem;min-height:1.1em;margin-top:2px}
#status.live{color:var(--accent)}#status.err{color:var(--danger)}
#chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px;padding-bottom:calc(var(--ctrl-h) + 24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;min-height:0}
.b{max-width:90%;padding:8px 11px;border-radius:14px;line-height:1.7;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.user{align-self:flex-end;background:#2a6bff}
.meta{font-size:.65rem;opacity:.65;margin-bottom:2px}
.ctrl{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,18,32,.97);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:center}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);border-radius:999px;height:34px;min-width:34px;padding:0 10px;font-size:13px;cursor:pointer}
.btn.main{background:var(--accent);color:#042214;font-weight:800;border:none;height:44px;padding:0 20px;font-size:15px}
.btn.hang{background:var(--danger);border:none;color:#fff;width:40px;height:40px}
.btn.mic.on{outline:2px solid rgba(62,224,163,.45);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(62,224,163,.55)}50%{box-shadow:0 0 0 9px rgba(62,224,163,0)}}
.row2{display:flex;width:100%;max-width:420px;gap:6px}
.row2 input{flex:1;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:9px 10px;font-size:.88rem;outline:none}
.row2 button{border:none;border-radius:12px;background:var(--accent);color:#042214;font-weight:700;padding:0 12px;font-size:13px}
.hint{font-size:11px;color:var(--muted);text-align:center;max-width:420px}
#gate{position:fixed;inset:0;background:rgba(5,10,20,.96);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#gate.hid{display:none}
#gate p{color:var(--muted);max-width:300px;line-height:1.7;font-size:.88rem}
</style>
</head>
<body>
<div id="gate">
  <div class="badge">تماس زنده</div>
  <h2>منشی روابط عمومی</h2>
  <p>برای شروع گفتگو دکمه را بزنید. می‌توانید صحبت کنید یا تایپ کنید.</p>
  <button class="btn main" id="go">📞 شروع تماس</button>
</div>
<div class="top">
  <div class="badge">● تماس زنده</div>
  <h1>منشی روابط عمومی</h1>
  <div id="status">منتظر شروع…</div>
</div>
<div id="chat"></div>
<div class="ctrl" id="ctrl">
  <div class="row">
    <button class="btn" id="spk" title="قطع صدا">🔊</button>
    <button class="btn hang" id="hang" title="پایان">☎</button>
    <button class="btn mic" id="mic" title="میکروفون">🎤</button>
    <button class="btn" id="rep" title="تکرار">▶️</button>
  </div>
  <div class="row2">
    <input id="txt" placeholder="پیام خود را بنویسید…" autocomplete="off" />
    <button id="send">ارسال</button>
  </div>
  <div class="hint" id="hint">صحبت کنید یا تایپ کنید — منشی خودکار گوش می‌دهد</div>
</div>

<script>
(function(){
  /* ============================================================
     ⚙️  تنظیمات — اینجا را ویرایش کن
     ============================================================ */
  const CONFIG = {
    // آدرس Edge Function یا سرور TTS خودت. اگر پیش‌فرض بماند، speechSynthesis استفاده می‌شود.
    TTS_ENDPOINT: 'https://YOUR-PROJECT.supabase.co/functions/v1/tts',
    TTS_VOICE: 'nova',        // nova | shimmer = زنانه، alloy | echo = خنثی
    TTS_MODEL: 'tts-1',       // tts-1 سریع | tts-1-hd بهتر

    SUPABASE_URL: 'https://YOUR-PROJECT.supabase.co',
    SUPABASE_ANON_KEY: 'YOUR_ANON_KEY_HERE',
    SUPABASE_TABLE: 'pr_voice_tickets',

    AUTO_LISTEN: true,        // بعد از هر صحبت منشی، میکروفون خودکار روشن شود
    TTS_CHUNK_MAX: 220,       // طول هر قطعه برای TTS
  };
  /* ============================================================ */

  let on=false, ended=false, listening=false, speaking=false, mute=false, saving=false;
  let lastBot="", rec=null, stream=null, voice=null, unlocked=false;
  let step = "welcome";
  const data = { problem:"", more:"", phone:"", address:"", ai_reply:"", history:[] };
  const $ = id => document.getElementById(id);
  const sb = (CONFIG.SUPABASE_URL && !CONFIG.SUPABASE_URL.includes('YOUR-PROJECT') && window.supabase)
    ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY)
    : null;

  function measure(){
    const h=($("ctrl")&&$("ctrl").offsetHeight)||150;
    document.documentElement.style.setProperty("--ctrl-h", h+"px");
    const c=$("chat"); if(c) c.scrollTop=c.scrollHeight;
  }
  function st(t,c){ const e=$("status"); if(!e)return; e.textContent=t; e.className=c||""; }
  function bubble(role,text){
    const d=document.createElement("div");
    d.className="b "+(role==="bot"?"bot":"user");
    d.innerHTML='<div class="meta">'+(role==="bot"?"منشی":"شما")+"</div>"+String(text||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
    $("chat").appendChild(d); measure();
  }

  /* ---------- Unlock audio (باید داخل gesture کاربر باشد) ---------- */
  const audioEl = new Audio();
  audioEl.preload = 'auto';

  async function unlockAudio(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { const ctx = new AC(); if (ctx.state === 'suspended') await ctx.resume(); }
    }catch(e){}
    try{
      audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
      await audioEl.play();
      unlocked = true;
    }catch(e){}
  }

  /* ---------- انتخاب صدای فارسی برای fallback ---------- */
  function pickVoice(){
    try{
      const vs = speechSynthesis.getVoices() || [];
      const score = v => {
        let s=0; const n=((v.name||"")+" "+(v.lang||"")).toLowerCase();
        if(/fa/.test(v.lang||"")) s+=50;
        if(/female|woman|girl|zira|susan|samantha|karen|moira|helena|dilara|sara|nova/.test(n)) s+=45;
        if(/male|man|david|mark|farid|ravi|daniel/.test(n)) s-=40;
        return s;
      };
      voice = vs.slice().sort((a,b)=>score(b)-score(a))[0] || null;
    }catch(e){ voice=null; }
  }

  /* ---------- میکروفون ---------- */
  async function micPerm(){
    try{
      if(stream) return true;
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
      return true;
    }catch(e){ st("میکروفون مجاز نیست — تایپ کنید","err"); return false; }
  }

  /* ---------- Chunking متن ---------- */
  function splitText(text, max){
    const parts = String(text||"").split(/(?<=[.!?؟\n])\s+/).filter(Boolean);
    const out = [];
    let buf = "";
    for(const p of parts){
      if((buf + " " + p).trim().length > max && buf){ out.push(buf.trim()); buf = p; }
      else buf = (buf + " " + p).trim();
    }
    if(buf) out.push(buf.trim());
    return out.length ? out : [String(text||"")];
  }

  /* ---------- TTS از endpoint ---------- */
  async function ttsFetch(text){
    const res = await fetch(CONFIG.TTS_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text, voice: CONFIG.TTS_VOICE, model: CONFIG.TTS_MODEL })
    });
    if(!res.ok){
      const msg = await res.text().catch(()=>'');
      throw new Error('TTS ' + res.status + ' ' + msg.slice(0,120));
    }
    return await res.blob();
  }

  function playBlob(blob){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      audioEl.onended = () => { URL.revokeObjectURL(url); resolve(); };
      audioEl.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      audioEl.src = url;
      audioEl.play().catch(reject);
    });
  }

  function playViaSpeechSynth(text){
    return new Promise((resolve) => {
      if(!window.speechSynthesis){ resolve(false); return; }
      try{ speechSynthesis.cancel(); }catch(e){}
      pickVoice();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fa-IR"; u.rate = 0.95; u.pitch = 1.25; u.volume = 1;
      if(voice) u.voice = voice;
      let done=false;
      const end=()=>{ if(done)return; done=true; resolve(true); };
      u.onend=end; u.onerror=()=>{ if(done)return; done=true; resolve(false); };
      try{ speechSynthesis.speak(u); }catch(e){ resolve(false); return; }
      setTimeout(end, Math.min(20000, 1500 + text.length*80));
    });
  }

  /* ---------- تابع اصلی صحبت ---------- */
  async function speak(text){
    lastBot = String(text||"");
    if(mute || !lastBot) return;
    stopMic();
    speaking = true;
    st("منشی صحبت می‌کند…","live");

    const useEndpoint = CONFIG.TTS_ENDPOINT && !CONFIG.TTS_ENDPOINT.includes('YOUR-PROJECT');
    let ok = false;

    if(useEndpoint){
      const chunks = splitText(lastBot, CONFIG.TTS_CHUNK_MAX);
      ok = true;
      for(const c of chunks){
        try{
          const blob = await ttsFetch(c);
          await playBlob(blob);
        }catch(e){
          console.warn('TTS endpoint failed:', e);
          ok = false; break;
        }
      }
    }

    if(!ok){
      // fallback به speechSynthesis
      ok = await playViaSpeechSynth(lastBot);
    }

    speaking = false;
    if(!ok){
      st("صدا پخش نشد — متن را بخوانید یا ▶️ بزنید","err");
    } else if(!ended){
      st("آماده — صحبت کنید یا تایپ کنید","live");
    }

    // بعد از صحبت، میکروفون خودکار
    if(CONFIG.AUTO_LISTEN && on && !ended && !mute){
      setTimeout(() => {
        if(!ended && !speaking && !listening && document.activeElement !== $("txt")){
          startMic();
        }
      }, 400);
    }
  }

  async function say(text){
    data.history.push({role:"bot", text});
    bubble("bot", text);
    await speak(text);
  }

  /* ---------- تبدیل و اعتبارسنجی ---------- */
  function toEn(s){
    return String(s||"").replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c))
      .replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c));
  }
  function normPhone(raw){
    let d = toEn(raw).replace(/[^\d+]/g,"");
    if(d.startsWith("0098")) d = "+98"+d.slice(4);
    else if(d.startsWith("98") && d.length>=12) d = "+"+d.slice(0,12);
    else if(/^09\d{9}$/.test(d)) d = "+98"+d.slice(1);
    else if(/^9\d{9}$/.test(d)) d = "+98"+d;
    return d;
  }
  function validPhone(p){ return /^\+98\d{10}$/.test(normPhone(p)); }

  function smartReply(problem, more){
    const t = (problem+" "+(more||"")).toLowerCase();
    let base = "ممنون از توضیحات‌تان. موضوع را یادداشت کردم تا همکاران روابط عمومی پیگیری کنند.";
    if(/قطع|برق|خاموش|فلک/.test(t)) base = "متأسفم بابت مشکل برق. مورد را ثبت می‌کنم تا در اسرع وقت بررسی شود.";
    else if(/قبض|هزینه|مبلغ|پرداخت|بدهی/.test(t)) base = "در مورد مسائل مربوط به قبض و پرداخت، همکاران پیگیری می‌کنند.";
    else if(/انشعاب|کنتور|تأسیسات|سیم/.test(t)) base = "موضوع انشعاب/تأسیسات ثبت شد و برای واحد مربوطه ارسال می‌شود.";
    else if(/شکایت|اعتراض|ناراضی/.test(t)) base = "از نارضایتی‌تان متأسفیم. شکایت شما با جدیت پیگیری خواهد شد.";
    else if(/تشکر|مرسی|ممنون/.test(t)) base = "خواهش می‌کنم. در خدمتم.";
    return base + " اگر توضیح بیشتری ندارید، در مرحله بعد شماره تماس و آدرس را می‌گیرم.";
  }

  function summary(){
    return [
      data.problem ? ("موضوع: "+data.problem) : "",
      data.more ? ("توضیح بیشتر: "+data.more) : "",
      data.phone ? ("تلفن: "+data.phone) : "",
      data.address ? ("آدرس: "+data.address) : ""
    ].filter(Boolean).join(" | ");
  }

  /* ---------- ذخیره‌سازی: Supabase + Bale + localStorage ---------- */
  async function saveToBot(){
    if(saving) return null;
    saving = true;
    const payload = {
      problem: data.problem,
      more: data.more,
      phone: data.phone,
      address: data.address,
      ai_reply: data.ai_reply,
      summary: summary(),
      conversation_summary: summary(),
      history: data.history.slice(-30),
      source: 'bale_miniapp',
      first_name: '',
      last_name: ''
    };

    let supabaseOk = false, baleOk = false;

    // 1) Supabase
    if(sb){
      try{
        const { error } = await sb.from(CONFIG.SUPABASE_TABLE).insert([payload]);
        if(error) throw error;
        supabaseOk = true;
      }catch(e){ console.warn('Supabase insert failed:', e); }
    }

    // 2) Bale
    try{
      if(window.Bale && Bale.WebApp && Bale.WebApp.sendData){
        Bale.WebApp.sendData(JSON.stringify({ type:'pr_voice_ticket', id:'prweb-'+Date.now(), ...payload }));
        baleOk = true;
      }
    }catch(e){ console.warn('Bale sendData failed:', e); }

    // 3) localStorage
    try{
      const k = "pr_voice_tickets_v2";
      const a = JSON.parse(localStorage.getItem(k)||"[]");
      a.push({ ...payload, at: new Date().toISOString() });
      localStorage.setItem(k, JSON.stringify(a.slice(-200)));
    }catch(e){}

    saving = false;
    return { supabaseOk, baleOk };
  }

  /* ---------- مکالمه ---------- */
  async function onUser(text){
    text = (text||"").trim();
    if(!text || !on || ended || speaking) return;
    stopMic();
    data.history.push({role:"user", text});
    bubble("user", text);

    if(step === "problem"){
      data.problem = text;
      step = "more";
      await say("اگر توضیح بیشتری دارید بفرمایید؛ در غیر این صورت بنویسید «ندارم».");
      return;
    }
    if(step === "more"){
      if(!/^(ندارم|نه|خیر|تمام|همینه|خیر ممنون|کافیست)$/i.test(text)) data.more = text;
      data.ai_reply = smartReply(data.problem, data.more);
      step = "phone";
      await say(data.ai_reply);
      await say("لطفاً شماره تماس خود را بفرستید. مثال: صفر نهصد و دوازده…");
      return;
    }
    if(step === "phone"){
      const p = normPhone(text);
      if(!validPhone(p)){
        await say("شماره معتبر به نظر نمی‌رسد. لطفاً مثل 09121234567 بفرستید.");
        return;
      }
      data.phone = p;
      step = "address";
      await say("ممنون. حالا آدرس یا محل مورد نظر را بنویسید.");
      return;
    }
    if(step === "address"){
      if(text.length < 5){
        await say("لطفاً آدرس را کمی کامل‌تر بنویسید.");
        return;
      }
      data.address = text;
      step = "done";
      ended = true;
      await say("ثبت شد. از تماس شما سپاسگزاریم. همکاران روابط عمومی پیگیری می‌کنند.");

      const r = await saveToBot();
      if(r && (r.supabaseOk || r.baleOk)){
        st("ثبت و ارسال شد ✅","live");
        $("hint").textContent = "می‌توانید تماس را ببندید";
      } else {
        st("ثبت محلی شد — از داخل بله باز کنید","err");
        $("hint").textContent = "برای ارسال کامل، از داخل بله باز کنید";
      }
    }
  }

  /* ---------- میکروفون ---------- */
  function initRec(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return null;
    const r = new SR();
    r.lang = "fa-IR"; r.continuous = false; r.interimResults = false;
    r.onstart = () => { listening = true; $("mic").classList.add("on"); st("گوش می‌دهم…","live"); };
    r.onresult = ev => {
      let t = "";
      for(let i=ev.resultIndex; i<ev.results.length; i++){
        if(ev.results[i].isFinal) t += ev.results[i][0].transcript;
      }
      listening = false; $("mic").classList.remove("on");
      t = (t||"").trim();
      if(t) onUser(t);
      else st("چیزی نشنیدم — تایپ کنید یا 🎤 را بزنید","err");
    };
    r.onerror = (e) => {
      listening = false; $("mic").classList.remove("on");
      if(e && e.error === 'not-allowed') st("دسترسی میکروفون رد شد","err");
      else st("میکروفون خطا — تایپ کنید","err");
    };
    r.onend = () => { listening = false; $("mic").classList.remove("on"); };
    return r;
  }
  function stopMic(){
    listening = false;
    if($("mic")) $("mic").classList.remove("on");
    try{ if(rec) rec.abort(); }catch(e){}
  }
  async function startMic(){
    if(!on || ended || speaking || listening) return;
    if(!(await micPerm())) return;
    if(!rec) rec = initRec();
    if(!rec){ st("تشخیص گفتار نیست — تایپ کنید","err"); return; }
    try{ rec.start(); }
    catch(e){ st("میکروفون شروع نشد — دوباره بزنید","err"); }
  }

  /* ---------- رویدادها ---------- */
  $("go").onclick = async () => {
    await unlockAudio();
    await micPerm();
    pickVoice();
    $("gate").classList.add("hid");
    on = true; measure();
    step = "problem";
    await say("سلام، وقت بخیر. من منشی روابط عمومی هستم. بفرمایید مشکل یا درخواست‌تان چیست؟");
  };

  $("mic").onclick = () => { if(listening) stopMic(); else startMic(); };

  $("rep").onclick = async () => {
    if(!lastBot) return;
    if(!unlocked) await unlockAudio();
    await speak(lastBot);
  };

  $("spk").onclick = () => {
    mute = !mute;
    $("spk").textContent = mute ? "🔇" : "🔊";
    if(mute){
      try{ speechSynthesis.cancel(); }catch(e){}
      try{ audioEl.pause(); }catch(e){}
    }
  };

  $("hang").onclick = async () => {
    if(!ended && data.problem){
      const r = await saveToBot();
      if(r && (r.supabaseOk || r.baleOk)) st("ثبت و ارسال شد ✅","live");
    }
    ended = true;
    stopMic();
    try{ speechSynthesis.cancel(); }catch(e){}
    try{ audioEl.pause(); }catch(e){}
    st("قطع شد");
    try{ if(window.Bale && Bale.WebApp && Bale.WebApp.close) Bale.WebApp.close(); }catch(e){}
  };

  $("send").onclick = () => { const v = $("txt").value; $("txt").value=""; onUser(v); };
  $("txt").addEventListener("keydown", e => {
    if(e.key === "Enter"){ const v = $("txt").value; $("txt").value=""; onUser(v); }
  });
  $("txt").addEventListener("focus", () => { if(listening) stopMic(); });

  window.addEventListener("resize", measure);
  try{
    if(window.Bale && Bale.WebApp){
      Bale.WebApp.ready();
      try{ Bale.WebApp.expand(); }catch(e){}
    }
  }catch(e){}
  try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
  measure();
})();
</script>
</body>
</html>
